<script>
LC.register({
  order: 34, num: 23, title: '合并 K 个升序链表', diff: '困难', cat: '链表',
  method: 'mergeKLists',

  lede: '题目：把 <b>K 条已经升序</b>的链表合成一条总的升序链表。' +
        '困难点在"别合并得太笨"：最省力的排法是<b>分治两两配对</b>——每轮把相邻两条合成一条，条数直接减半，' +
        'log K 轮后只剩一条。每次"两条合成一条"就是第 21 题的工序：' +
        '<span class="var b">a[i]</span> 和 <span class="var o">b[j]</span> 两个队头比一比，小的<span class="var g">摘</span>进结果。' +
        '（动画用数组模拟链表节点，逻辑与链表版完全一致）',

  roles: [
    {c:'blue',   code:'a[i]', text:'左链队头，正在比较'},
    {c:'orange', code:'b[j]', text:'右链队头，正在比较'},
    {c:'green',  code:'out',  text:'已合并结果，只增不减'},
    {c:'violet', code:'merge2', text:'合并两条有序链的工序（= LC 21）'}
  ],

  codeTitle: '上半部分 merge2 是"合并两条有序链"的标准工序；下半部分 while 循环两两配对，条数一轮减半。比较行变<span style="color:var(--green)">绿</span>＝摘左链的，变<span style="color:var(--red)">红</span>＝摘右链的。',

  legend: [
    {c:'blue',   text:'a[i] 左链队头'},
    {c:'orange', text:'b[j] 右链队头'},
    {c:'green',  text:'out 已合并部分'},
    {c:'muted',  text:'灰色 = 本轮轮空等待的链'}
  ],

  idea: '分治两两合并：每轮把相邻两条升序链合成一条，条数减半，log K 轮后只剩一条——每次合并就是第 21 题的"摘队头"工序。',

  qa: [
    {q:'为什么不按顺序一条条往结果上并（先并 0+1，再并上 2……）？',
     a:'顺序合并最坏是 O(K·N)：第一条链会被反复拖着比 K−1 次。两两配对每轮条数减半，每轮所有节点总共只被扫一遍 O(N)，共 log K 轮 → <b>O(N log K)</b>。K=3 时差别不大，K 很大时分治优势明显。'},
    {q:'merge2 里"摘队头"到底在干嘛？',
     a:'两条链都已有序，所以全局最小的候选只可能出现在两个队头：比一下，小的接进 out，对应指针右移。一边摘空后，另一边剩下的部分<b>本来就有序且都不小于 out</b>，整段接上即可。链表版只需把 i+=1 换成 node=node.next。'},
    {q:'落单（奇数条）的链怎么办？',
     a:'这一轮没有对手就<b>原样晋级</b>到下一轮，下轮自然有对手。注意配对始终取相邻两条（第 0+1、第 2+3…），这样每条链每轮最多被合并一次，条数变为 ⌈K/2⌉。'},
    {q:'还能更快吗？',
     a:'小顶堆（优先队列）解法是 O(N log K) 常数更稳、代码也好写；两两分治是同样的复杂度但只用"合并两条链"这一块积木。两者都是本题的标准答案。'}
  ],

  complexity: '时间 O(N log K)（N 为节点总数，每轮 O(N)，共 log K 轮）　·　空间 O(1)（链表版只改指针；动画用数组模拟）',

  form: [
    {key:'lists', label:'lists（每行一条链）', type:'grid', def:[[1,4,5],[1,3,4],[2,6]]}
  ],
  presets: [
    {label:'3 条：[1,4,5] [1,3,4] [2,6]', values:{lists:[[1,4,5],[1,3,4],[2,6]]}},
    {label:'4 条：两轮减半', values:{lists:[[2,4],[1,3],[0,5],[6]]}},
    {label:'重复值：[2] 和 [1,1,1]', values:{lists:[[2],[1,1,1]]}},
    {label:'单条 [10]（边界）', values:{lists:[[10]]}}
  ],

  code: `class Solution:
    def mergeKLists(self, lists):
        # LeetCode 传入 K 条升序链表, 这里用数组模拟节点
        def merge2(a, b):                  # 合并两条升序链
            i = j = 0; out = []
            while i < len(a) and j < len(b):
                if a[i] <= b[j]:           # 两队头比一比
                    out.append(a[i]); i += 1
                else:
                    out.append(b[j]); j += 1
            out += a[i:]; out += b[j:]     # 接上没比完的剩余段
            return out
        ls = [list(x) for x in lists]      # 每条链开一份拷贝
        while len(ls) > 1:                 # 两两合并, 条数每轮减半
            nxt = []
            for i in range(0, len(ls) - 1, 2):
                nxt.append(merge2(ls[i], ls[i + 1]))
            if len(ls) % 2:                # 落单的原样晋级
                nxt.append(ls[-1])
            ls = nxt
        return ls[0] if ls else []
`,

  sol(input){
    const lists = (input.lists || []).map(r => (r || []).filter(x => x != null));
    function merge2(a, b){
      const out = []; let i = 0, j = 0;
      while(i < a.length && j < b.length){
        if(a[i] <= b[j]){ out.push(a[i]); i++; } else { out.push(b[j]); j++; }
      }
      while(i < a.length){ out.push(a[i]); i++; }
      while(j < b.length){ out.push(b[j]); j++; }
      return out;
    }
    let ls = lists.map(x => x.slice());
    while(ls.length > 1){
      const nxt = [];
      for(let i = 0; i + 1 < ls.length; i += 2) nxt.push(merge2(ls[i], ls[i + 1]));
      if(ls.length % 2) nxt.push(ls[ls.length - 1]);
      ls = nxt;
    }
    return ls[0] || [];
  },
  expected: [1,1,2,3,4,4,5,6],

  quiz: [
    {q:'把 K 条升序链并成一条,为什么推荐「两两配对分治」,而不是第 0+1 条并完、结果再和第 2 条并……顺序往上叠?',
     options:['顺序叠会并出错误结果,只有分治能保证升序','顺序叠结果也对,但大结果会被反复拖着重扫,最坏 O(K·N);两两配对每轮所有节点只扫一遍、条数减半,总共 O(N log K)','分治省内存,顺序叠必须把所有节点复制一份'],
     answer:1,
     explain:'两种做法结果都正确,差在代价。顺序合并时"结果链"越来越长,每来一条新链都要和整条大结果逐个比队头,最早并入的节点被拖着重扫 K−1 次;两两配对每轮每条链最多参加一次合并,一轮所有节点合计 O(N),共 log K 轮 → O(N log K)。K=3 时差别不大,K 很大时分治明显胜出。',
     jumpTo:2},
    {q:'默认输入 3 条链 [1,4,5]、[1,3,4]、[2,6]。第 1 轮两两配对结束后,待合并队列里剩下的是什么?',
     options:['[1,4,5,1,3,4] 和 [2,6]','[1,1,2,3,4,4,5,6]——一轮就并完了','[1,1,3,4,4,5] 和 [2,6]（[2,6] 落单原样晋级）'],
     answer:2,
     explain:'第 1 轮只配对相邻的第 0+1 条:merge2([1,4,5],[1,3,4]) 逐个摘队头 → [1,1,3,4,4,5];[2,6] 落单没有对手,原样晋级。第 2 轮才把它俩并成 [1,1,2,3,4,4,5,6]——3 条链要 ⌈log₂3⌉ = 2 轮,不是一轮;也不能简单把两条链拼接,拼完并不升序。',
     jumpTo:25},
    {q:'merge2 里某条链摘空后,为什么剩下的整段直接接上、不再逐个比较?',
     options:['因为剩余段一定只剩 1 个元素','为了省一次函数调用,结果其实要重排','剩余段自己升序,且每个数都是刚才队头对决的"赢家"、全 ≥ out 尾巴,接上顺序天然正确'],
     answer:2,
     explain:'循环退出说明有一边候选耗尽;另一边剩下的数本来就升序,而且都是在队头对决中赢过对手才留到现在的,全都 ≥ out 的尾巴。整段接上与逐个再比结果完全一样,逐个比纯属白花工夫——这也是归并排序收尾的标准写法。',
     jumpTo:22},
  ],

  steps(input){
    const F = [];
    const lists = (input.lists || []).map(r => (r || []).filter(x => x != null));
    const nodesOf = lists.map((arr, li) => arr.map((v, ni) => ({key:'p' + li + '_' + ni, val:v})));
    const byKey = {};
    nodesOf.forEach(ns => ns.forEach(n => byKey[n.key] = n));
    const vv = k => k == null ? '空' : LCesc(String(byKey[k].val));
    const vName = keys => '[' + keys.map(k => vv(k)).join(',') + ']';

    let ls = nodesOf.map(ns => ns.map(n => n.key));
    let names = lists.map((_, li) => '链表' + li);
    let round = 0, mergeCnt = 0;

    /* ★ 快照原则：rows/pointers/states 在 push 时拼成字面量快照；do() 只读快照 */
    const draw = o => (v) => {
      (o.rows || []).forEach(r => {
        const opt = {label: r.label, states: r.states || {}, dummy: !!r.dummy};
        if(r.pointers && r.pointers.length) opt.pointers = r.pointers;   // 没指针就不带这个键
        v.list(r.id, r.keys.map(k => byKey[k]), opt);
      });
      if(o.vars) v.vars('vars', o.vars, {label:'merge2 进度'});
      if(o.outer) v.vars('outer', o.outer, {label:'外层配对循环'});
      if(o.result != null) v.result(o.result, {label:'合并结果'});
      v.order((o.rows || []).map(r => r.id).concat(['outer','vars','result']));
    };

    /* 待合并队列的整排展示；act = 本轮要配对的位置集合 */
    const queueRows = act => ls.map((keys, qi) => ({
      id:'q' + qi, keys: keys.slice(), label: names[qi] + ' = ' + vName(keys),
      states: keys.reduce((m, k) => (m[k] = (act && act.has(qi)) ? 'in' : (act ? 'muted' : null), m), {}),
      pointers: []
    }));
    const mutedRow = (keys, label, qi, ai) => ({id:'q' + qi, keys: keys.slice(), label: label + (qi < ai ? '（本轮已处理）' : '（等待本轮处理）'),
      states: keys.reduce((m, k) => (m[k] = 'muted', m), {})});

    /* merge2 动画：a、b 两条升序链的队头逐个摘小者（p021 式摘取） */
    function mergeAnim(ai, bi, outer){
      const aKeys = ls[ai], bKeys = ls[bi];
      const la = names[ai], lb = names[bi];
      let i = 0, j = 0;
      const out = [];
      const waitRows = () => ls.map((keys, qi) => ({keys, qi, name: names[qi]}))
        .filter(x => x.qi !== ai && x.qi !== bi)
        .map(x => mutedRow(x.keys, x.name, x.qi, ai));
      const srcRows = (aPtr, bPtr) => ls.map((keys, qi) => qi === ai ?
        {id:'q' + ai, keys:aKeys.slice(i), label: la + '（左源 a，剩 ' + (aKeys.length - i) + ' 个）',
         states: aPtr ? {[aKeys[i]]:'active'} : {}, pointers: aPtr ? [{key:aKeys[i], text:'▼ a[i]', cls:'mi'}] : null} :
        qi === bi ? {id:'q' + bi, keys:bKeys.slice(j), label: lb + '（右源 b，剩 ' + (bKeys.length - j) + ' 个）',
         states: bPtr ? {[bKeys[j]]:'active'} : {}, pointers: bPtr ? [{key:bKeys[j], text:'▼ b[j]', cls:'mr'}] : null} :
        mutedRow(keys,names[qi],qi,ai)).concat([
        {id:'out', keys:out.slice(), label:'merge2 的局部数组 out',
         states: out.length ? {[out[out.length - 1]]:'just'} : {}}
      ]);
      const mVars = () => ({i:i, j:j, 'out 长度':out.length});

      F.push({hl:[17], tag:'取出两条', cls:'t-violet',
        msg:'把 <b>' + la + '</b> 和 <b>' + lb + '</b> 递给 <code>merge2</code>。关键前提：两条各自已经升序——所以全局最小的候选<b>只可能藏在两个队头</b>（a 队头 ' + vv(aKeys[0]) + '、b 队头 ' + vv(bKeys[0]) + '），中间的元素都比各自的队头大，根本不用看。比一次、摘一个，重复到某边摘空。',
        do: draw({rows: queueRows(new Set([ai,bi])), outer})});
      F.push({hl:[4,5], tag:'merge2 初始化', cls:'t-grey',
        msg:'初始化：<code>i = 0、j = 0、out = []</code>——i、j 是两条链的队头指针（▼ a[i] / ▼ b[j] 名牌），out 是装结果的新链。接下来每一轮只问一个问题：<code>a[i] = ' + vv(aKeys[i]) + '</code> 和 <code>b[j] = ' + vv(bKeys[j]) + '</code> 谁小？小的摘进 out。',
        do: draw({rows: srcRows(aKeys.length > 0, bKeys.length > 0), vars: mVars(), outer})});

      while(i < aKeys.length && j < bKeys.length){
        F.push({hl:[6], ok:6, tag:'while 检查', cls:'t-blue',
          msg:'循环条件 <code>i &lt; len(a) and j &lt; len(b)</code>：a 还剩 ' + (aKeys.length - i) + ' 个、b 还剩 ' + (bKeys.length - j) + ' 个，两边都没摘空 → 继续比队头。只要有一边摘空就跳出——剩下的另一边不用再逐个比，待会整段接上就行。',
          do: draw({rows: srcRows(true, true), vars: mVars(), outer})});
        const takeA = byKey[aKeys[i]].val <= byKey[bKeys[j]].val;
        F.push({hl:[7], ok: takeA ? 7 : undefined, no: takeA ? undefined : 7, tag:'比较队头', cls: takeA ? 't-green' : 't-red',
          msg:'队头对决：<code>a[i] = ' + vv(aKeys[i]) + '</code> vs <code>b[j] = ' + vv(bKeys[j]) + '</code> → ' +
              (takeA ? '<b>' + vv(aKeys[i]) + ' ≤ ' + vv(bKeys[j]) + '</b>，摘左链的。凭什么说 ' + vv(aKeys[i]) + ' 就是剩余元素里最小的？它 ≤ b 的队头（b 后面的只会更大），又 ≤ a 自己后面的（a 升序）——两边都压不住它，它就是当前全局最小。'
                     : '<b>' + vv(aKeys[i]) + ' &gt; ' + vv(bKeys[j]) + '</b>，摘右链的。同理，' + vv(bKeys[j]) + ' ≤ a 的队头、≤ b 自己后面的，是当前全局最小。'),
          do: draw({rows: srcRows(true, true), vars: mVars(), outer})});
        if(takeA){ out.push(aKeys[i]); i++; } else { out.push(bKeys[j]); j++; }
        F.push({hl: takeA ? [8] : [9,10], tag:'摘取', cls:'t-green',
          msg:'把 <b>' + vv(out[out.length - 1]) + '</b> 摘下来接到 out 尾部（尾部闪一下），' + (takeA ? 'i' : 'j') + ' 右移一格——只动赢家的指针，输家的队头原地不动，下一轮继续当候选。现在 out = <b>' + vName(out) + '</b>，始终保持升序。',
          do: draw({rows: srcRows(false, false), vars: mVars(), outer})});
      }

      const rest = aKeys.slice(i).concat(bKeys.slice(j));
      rest.forEach(k => out.push(k));
      F.push({hl:[6,11], no:6, tag:'接上剩余', cls:'t-orange',
        msg:'有一边摘空了，while 结束 → 剩下的 <b>' + vName(rest) + '</b> 一个都不用再比：它自己升序，而且这些数都是在比较中"赢"了才被留下的，全都 ≥ out 的尾巴，整段 <code>out +=</code> 接上顺序天然正确。要是继续逐个比，结果一样、纯属白花工夫。',
        do: draw({rows: srcRows(false, false), vars: mVars(), outer})});

      F.push({hl:[12], tag:'merge2 返回', cls:'t-dark',
        msg:'<code>merge2(' + la + ', ' + lb + ')</code> 收工，返回长 ' + out.length + ' 的新升序链 <b>' + vName(out) + '</b>。从此它作为一条整体参加后面的配对，原来那两条的使命结束——这就是"条数减半"的实际含义。',
        do: draw({rows: waitRows().concat([
          {id:'out', keys:out.slice(), label:'合并结果 = ' + vName(out), states:{}}
        ]), outer})});
      return out;
    }

    /* ---- 开场 ---- */
    F.push({hl:[1,2,13], tag:'初始化', cls:'t-grey',
      msg: lists.length
        ? '共 <b>K = ' + lists.length + '</b> 条升序链（合计 ' + lists.reduce((s, a) => s + a.length, 0) + ' 个节点）。策略是<b>分治两两配对</b>：每轮把相邻两条并成一条，条数直接减半，log K 轮后只剩 1 条。比"抓着第一条链一条条往上叠"聪明——那样第一条链会被反复拖着重扫，最坏 O(K·N)；两两配对每轮所有节点总共只被扫一遍。'
        : '输入为空，没有链可合并，直接返回空。',
      do: draw({rows: queueRows(null)})});

    while(ls.length > 1){
      round++;
      F.push({hl:[14], ok:14, tag:'新一轮', cls:'t-blue',
        msg:'还剩 <b>' + ls.length + '</b> 条 → 进入第 ' + round + ' 轮两两配对，本轮将并出 ' + Math.floor(ls.length / 2) + ' 条新链' + (ls.length % 2 ? '，最后 1 条落单轮空' : '') + '。配对只取相邻的两条（第 0+1、第 2+3…），保证每条链本轮最多被合并一次——一轮下来所有节点总共只被扫一遍，这是 O(N log K) 的根基。',
        do: draw({rows: queueRows(null)})});
      F.push({hl:[15], tag:'准备装结果', cls:'t-grey',
        msg:'<code>nxt = []</code>：备一个空篮子装本轮的新链。为什么用新篮子、不直接改写 <code>ls</code>？因为配对要按老顺序读 <code>ls[0]+ls[1]、ls[2]+ls[3]…</code>，一边读一边覆盖会踩掉自己还没读到的原料——所以本轮全写进 nxt，轮末一次性 <code>ls = nxt</code> 换代。',
        do: draw({rows: queueRows(null)})});

      const nxt = [];
      const nxtNames = [];
      const outerState = p => ({'轮次':round, '外层 i':p, nxt:nxt.map(keys=>keys.map(k=>byKey[k].val))});
      for(let p = 0; p + 1 < ls.length; p += 2){
        F.push({hl:[16], tag:'配对', cls:'t-violet',
          msg:'本轮第 ' + (p / 2 + 1) + ' 组配对：取出相邻的 <b>' + names[p] + '</b>（长 ' + ls[p].length + '）和 <b>' + names[p + 1] + '</b>（长 ' + ls[p + 1].length + '），画面上这两条高亮、其余灰色等待。交给 <code>merge2</code>——两条都已升序，合并等于边比边摘，不需要重新排序。',
          do: draw({rows: queueRows(new Set([p, p + 1])), outer:outerState(p)})});
        const merged = mergeAnim(p, p + 1, outerState(p));
        nxt.push(merged);
        nxtNames.push(names[p] + '+' + names[p + 1]);
        F.push({hl:[17], tag:'加入 nxt', cls:'t-green',
          msg:'merge2 已返回，现在执行 <code>nxt.append(...)</code>，把这一整条合并结果作为一个元素加入 nxt。外层 i 仍为 ' + p + '，下一组才会增加 2。',
          do: draw({rows:queueRows(new Set([p,p+1])).concat([
            {id:'out',keys:merged.slice(),label:'刚加入 nxt 的合并结果'}]),outer:outerState(p)})});
        mergeCnt++;
      }
      if(ls.length % 2){
        F.push({hl:[18,19], ok:18, tag:'落单晋级', cls:'t-orange',
          msg:'共 ' + ls.length + ' 条（奇数），<b>' + names[ls.length - 1] + '</b>（' + vName(ls[ls.length - 1]) + '）落单，这轮没有对手 → <b>原样晋级</b>到下一轮。不并它不影响正确性：它本来就是升序的，晚一轮合并只是排队，下一轮自然分到对手。',
          do: draw({rows: queueRows(null)})});
        nxt.push(ls[ls.length - 1]);
        nxtNames.push(names[ls.length - 1]);
      } else {
        F.push({hl:[18], no:18, tag:'没有落单', cls:'t-grey',
          msg:'共 ' + ls.length + ' 条（偶数），正好两两配满，没有轮空的——<code>len(ls) % 2</code> 为 0，落单分支不进，条数将精确减半。',
          do: draw({rows: queueRows(null)})});
      }
      ls = nxt; names = nxtNames;
      F.push({hl:[20], tag:'本轮结束', cls:'t-green',
        msg:'第 ' + round + ' 轮结束：条数减半，现在只剩 <b>' + ls.length + '</b> 条：' +
            names.map(nm => '<b>' + nm + '</b>').join('、') + '。注意每条新链内部已经是合并好的升序，下一轮配对时整条当作一个"大队列"来比队头。',
        do: draw({rows: queueRows(null)})});
    }

    F.push({hl:[14], no:14, tag:'只剩一条', cls:'t-blue',
      msg: ls.length === 1
        ? '只剩 <b>1</b> 条 → 循环条件 <code>len(ls) &gt; 1</code> 不再成立，合并完成。复盘：条数 K → ⌈K/2⌉ → … → 1 共 log K 轮，每轮所有节点只被扫一遍 O(N)，总时间 O(N log K)。'
        : '没有链可合并，直接收工。',
      do: draw({rows: queueRows(null)})});

    const finalKeys = ls.length ? ls[0] : [];
    F.push({hl:[21], tag:'返回', cls:'t-dark',
      msg:'🎉 <code>return</code>：K = ' + lists.length + ' 条链合并成一条升序链 <b>' + (finalKeys.length ? vName(finalKeys) : '[]') + '</b>。复盘复杂度：每个节点每轮最多被比较一次、共 log K 轮，所以是 O(N log K)；链表版只改指针、无需额外空间。',
      do: draw({rows:[{id:'q0', keys:finalKeys, label:'最终合并结果', states: finalKeys.reduce((m, k) => (m[k] = 'done', m), {})}],
        result: finalKeys.map(k => byKey[k].val)})});

    return F;
  }
});
</script>
