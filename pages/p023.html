<script>
LC.register({
  order: 23, num: 206, title: '反转链表', diff: '简单', cat: '链表',
  method: 'reverseList',

  lede: '题目：把单链表<b>整个掉头</b>：1→2→3→4→5 变成 5→4→3→2→1，返回新表头。' +
        '动画里每个箭头就是节点的 <span class="var r">next</span> 指针。<span class="var o">prev</span> 是"已经反转好"那段的头，' +
        '<span class="var i">cur</span> 是正在处理 的节点，<span class="var r">nxt</span> 负责在掉头前替你记住后面的路。' +
        '核心就一个念头：<b>让 cur 的箭头反过来指向 prev，然后三个人整体右移一格</b>。',

  roles: [
    {c:'green',  code:'prev', text:'已反转部分的头（最终答案）'},
    {c:'orange', code:'cur',  text:'正在处理的节点'},
    {c:'blue',   code:'nxt',  text:'先存下下一个，防止断链'},
    {c:'blue',   code:'next', text:'箭头方向 = 节点的 next'}
  ],

  codeTitle: '跟着高亮读代码——绿色箭头是已经反转好的部分；while 那行变<span style="color:var(--green)">绿</span>＝还有节点要处理。',

  legend: [
    {c:'orange', text:'cur 当前节点'},
    {c:'green', text:'prev 已反转部分'},
    {c:'blue', text:'nxt 预备队'},
    {swatch:'var(--violet-soft)', text:'虚线弧：反转后的新箭头走这里'}
  ],

  idea: '一边走一边把箭头掉头：save next → 反指 → prev、cur 各进一步，走完时 prev 就是新头。',

  qa: [
    {q:'为什么必须先存 nxt？不存会怎样？',
     a:'一旦执行 cur.next = prev，原来指向后面节点的箭头就<b>永久丢了</b>，后半段链表再也找不到。所以顺序是死的：先存 nxt，再反指，再平移。'},
    {q:'循环不变式是什么？',
     a:'每一轮开始时都保证：<b>prev 开头的链表已经全部反转好，cur 开头的还是原样</b>，两段之间没有箭头相连。循环结束时 cur = None，prev 正好是原链表的最后一个节点——也是新链表的头。'},
    {q:'递归版本呢？',
     a:'递归写法更短但不好画：先递归到底，回溯时让 head.next.next = head。空间 O(n)（栈），面试时能讲清迭代版通常更加分。'}
  ],

  complexity: '时间 O(n)　·　空间 O(1)（只动三个指针）',

  form: [
    {key:'head', label:'head', type:'list', def:[1,2,3,4,5]}
  ],
  presets: [
    {label:'1→2→3→4→5', values:{head:[1,2,3,4,5]}},
    {label:'1→2', values:{head:[1,2]}},
    {label:'单节点 7', values:{head:[7]}},
    {label:'1→2→3', values:{head:[1,2,3]}}
  ],

  code: `class Solution:
    def reverseList(self, head):
        prev, cur = None, head
        while cur:              # 还有节点没处理
            nxt = cur.next      # 先记住下一个
            cur.next = prev     # 箭头掉头, 指向 prev
            prev = cur          # prev 前进一格
            cur = nxt           # cur 前进一格
        return prev             # 新表头
`,

  sol(input){
    let vals = (input.head || []).filter(x => x != null);
    return vals.slice().reverse();
  },
  expected: [5,4,3,2,1],

  quiz: [
    {q:'每轮为什么必须先存 nxt = cur.next，才能执行 cur.next = prev？',
     options:['为了少用一个临时变量','箭头一掉头，cur 指向原后方的路就永久断了——不先存，后半段链表当场失踪，后面再也走不到','因为 Python 不允许直接修改 next'],
     answer:1,
     explain:'cur.next 是通向「还没反转部分」的唯一入口，执行 cur.next = prev 的瞬间它就被覆盖成回指 prev 的箭头。先把 nxt 存下来，掉头后才知道下一步该去哪。这题的头号踩坑点就是顺序写反：先反指再想存 next，链表从 cur 后面直接断成两截，while 下一轮直接崩。口诀：先存、再翻、后平移。',
     jumpTo:3},
    {q:'对 1→2→3→4→5 反转：第 3 轮 while 检查开始时，prev 和 cur 各站在哪个节点？哪些箭头已经掉头？',
     options:['prev = 节点2，cur = 节点3；1→2、2→3 两根已掉头（2 指向 1，3 还指着 4）','prev = 节点3，cur = 节点4；前三根箭头都掉头了','prev = 节点1，cur = 节点2；只有 1→2 掉头'],
     answer:0,
     explain:'逐轮数：第 1 轮处理节点 1，它反指 None（prev = None），轮末 prev=1、cur=2；第 2 轮处理节点 2，2 反指 1，轮末 prev=2、cur=3。所以第 3 轮检查时 prev 站在节点 2、cur 站在节点 3，绿段是 None←1←2，不变式「prev 开头那段已全部反转、cur 开头那段还是原样，两段之间没有连线」每轮都成立。',
     jumpTo:12},
    {q:'循环结束时 cur = None，为什么返回的是 prev 而不是 cur 或 head？',
     options:['返回 prev 只是惯例，返回 head 结果一样','head 仍是原链头（它的 next 已被改掉，成了新链的尾巴），cur 是空——每轮 prev 都接手刚反转完的节点，最后接手的正是原链最后一个节点，反转后它就是新表头','因为 cur 在循环里被销毁了'],
     answer:1,
     explain:'循环条件 while cur 决定退出时 cur 必为 None，它什么都指不了；head 在第一轮就丢了「表头」身份——原头节点反指 None 后成了新链的尾巴。prev 的轨迹是 None→1→2→…→原尾节点，恰好是「已反转段」的头。原链 1→2→3→4→5 时，最终 prev 站在原节点 5 上，return prev 即 5→4→3→2→1。',
     jumpTo:27},
  ],

  steps(input){
    const F = [];
    const hs = (input.head || []).filter(x => x != null);
    const nodes = hs.map((v, i) => ({key:'n' + i, val:v}));
    const N = nodes.length;

    let edges = [];                       // 当前画面上的所有箭头 [from,to]
    for(let i = 0; i < N - 1; i++) edges.push(['n' + i, 'n' + (i + 1)]);
    let prev = null, cur = N ? 'n0' : null, nxt = null;

    const nv = k => k == null ? 'None' : '节点' + nodes[+k.slice(1)].val;
    /* ★ 快照原则：指针/箭头必须在"帧生成那一刻"求值定死；
       绝不能在 do(v) 执行时才读外层可变变量——那时循环早已跑完，全是最终值 */
    const ptr = () => {
      const arr = [];
      if(prev != null) arr.push({key:prev, text:'▼ prev', cls:'mg'});
      if(cur != null) arr.push({key:cur, text:'▼ cur', cls:'mi'});
      if(nxt != null) arr.push({key:nxt, text:'▼ nxt', cls:'mr'});
      return arr;
    };
    const draw = (o) => (v) => {
      v.list('L', nodes, {
        label:'链表　·　箭头 = 节点的 <code>next</code> 指向',
        states: o.states || {},
        edges: o.edges,                 // 帧生成时的箭头快照
        pointers: o.pointers || [],     // 帧生成时的指针快照
        headTag: N ? {key:'n0', text:'旧 head', cls:'mq'} : null
      });
      if(o.vars) v.vars('vars', o.vars, {label:'变量'});
      if(o.result) v.result(o.result, {label:'返回结果'});
    };

    F.push({hl:[1,2,3], tag:'初始化', cls:'t-grey',
      msg:'<code>prev = None</code>（反转好的部分还空着），<code>cur = ' + nv(cur) + '</code> 准备从头处理，nxt 空缺待命；画面上所有箭头还都指向右边。' +
          '接下来每轮只做三件事：<b>存 next → 箭头掉头 → prev/cur 右移</b>。全程不变式：prev 开头那段已全部反转（最终答案的雏形），cur 开头那段还是原样，两段之间没有连线——每一轮结束时依然成立。',
      do: draw({edges: edges.slice(), pointers: ptr(), vars:{prev:'None', cur:nv(cur), nxt:'—'}})});

    while(cur != null){
      const ci = +cur.slice(1);
      F.push({hl:[4], ok:4, tag:'while 检查', cls:'t-blue',
        msg:'<code>cur</code> 指着 ' + nv(cur) + '，不为空 → 还有节点没反转，继续这一轮；此刻 prev 站在 ' + nv(prev) +
            '，绿格 = 已经掉头的部分，绿段的头就是 prev。循环条件只看 cur：它是"待处理段"的边界，等它走到 None，原链每个节点都已被收编进绿段。',
        do: draw({edges: edges.slice(), pointers: ptr(), states:{[cur]:'active'},
                  vars:{prev:nv(prev), cur:nv(cur), nxt:nv(nxt)}})});

      nxt = (ci + 1 < N) ? 'n' + (ci + 1) : null;
      F.push({hl:[5], tag:'存 next', cls:'t-blue',
        msg:'<code>nxt = cur.next</code>：' + (nxt ? '把后面的 ' + nv(nxt) + ' 存在手里。' : '后面没有了，把「空」记下存在手里。') +
            '<b>这步是保命符</b>——下一步箭头一掉头，cur 指向原后方的路就永久断了，不先存下来，后半段链表当场失踪（本题头号踩坑点）。' +
            '画面上被记住的' + (nxt ? nv(nxt) : '空位') + '就是替我们攥着的"后路"。',
        do: draw({edges: edges.slice(), pointers: ptr(),
                  states:{[cur]:'active', [nxt || '__none']:'peek'},
                  vars:{prev:nv(prev), cur:nv(cur), nxt:nv(nxt)}})});

      edges = edges.filter(([a]) => a !== cur);
      if(prev != null) edges.push([cur, prev]);
      F.push({hl:[6], tag:'箭头掉头', cls:'t-orange',
        msg:'<code>cur.next = prev</code>：' + nv(cur) + ' 的箭头不再指后面，改指 ' + nv(prev) +
            '（prev 为 None 就是不指任何人——它暂时是新链的末尾）。<b>这一下就是"反转"本体</b>：画面上旧箭头消失、新箭头掉头向左。' +
            '敢放心反指，是因为 prev 那段已经全部反转好，接上去正好构成更长的逆序段。',
        do: draw({edges: edges.slice(), pointers: ptr(),
                  states:{[cur]:'block', [prev || '__none']:'done'},
                  vars:{prev:nv(prev), cur:nv(cur), nxt:nv(nxt)}})});

      prev = cur;
      F.push({hl:[7], tag:'prev 右移', cls:'t-green',
        msg:'<code>prev = cur</code>：' + nv(prev) + ' 加入已反转段并成为它的带头人——绿段向前扩了一格，"绿段全部反转好"的不变式依然成立。' +
            'cur 那头还没动，两段依旧互不相连。',
        do: draw({edges: edges.slice(), pointers: ptr(), states:{[prev]:'done'},
                  vars:{prev:nv(prev), cur:nv(cur), nxt:nv(nxt)}})});

      cur = nxt;
      F.push({hl:[8], tag:'cur 右移', cls:'t-ink',
        msg:'<code>cur = nxt</code>：轮到' + (cur ? nv(cur) : 'None（后面没有了）') + '。三人组整体右移一格回到循环开头——刚才存 next 的伏笔在这里兑现：靠它才没断链。',
        do: draw({edges: edges.slice(), pointers: ptr(),
                  states:{[prev]:'done', [cur || '__none']:'active'},
                  vars:{prev:nv(prev), cur:nv(cur), nxt:nv(nxt)}})});
    }

    F.push({hl:[4], no:4, tag:'while 结束', cls:'t-red',
      msg:'<code>cur = None</code>：一个节点不剩，循环结束。为什么答案在 prev？每轮 prev 都接手"刚反转完的节点"，最后接手的正是原链表的最后一个节点——反转后它就是新表头。',
      do: draw({edges: edges.slice(), pointers: ptr(), states:{[prev || '__none']:'done'},
                vars:{prev:nv(prev), cur:'None', nxt:'—'}})});

    const revEdges = [];
    for(let i = N - 1; i > 0; i--) revEdges.push(['n' + i, 'n' + (i - 1)]);
    edges = revEdges;
    F.push({hl:[9], tag:'返回', cls:'t-dark',
      msg:'<code>return prev</code> 🎉 新链表从 ' + (N ? nv('n' + (N - 1)) : 'None') + ' 开始，所有箭头全部掉头：' +
          '<b>' + (N ? hs.slice().reverse().join('→') : '空表') + '</b>。全程只动了 prev/cur/nxt 三个指针，空间 O(1)。',
      do: draw({edges: edges.slice(), pointers: ptr(), states:{},
                result: N ? hs.slice().reverse() : []})});

    return F;
  },

  /* ========= 解法二：力扣官方方法二 · 递归 ========= */
  alt: {
    label: '官方 · 递归',
    method: 'reverseList',

    lede: '题目不变：把单链表<b>整个掉头</b>，返回新表头。解法一的迭代是"走到哪、翻到哪"；' +
          '这一版是力扣官方方法二——<b>递归</b>：先把"反转 head 后面那一截"整包丢给下一层，' +
          '自己原地等到<b>回溯</b>时才动手：<code>head.next.next = head</code> 让后继回头指向自己，再斩掉自己的旧箭头。' +
          '盯右侧调用栈：往下长＝把反转一层层<b>推迟</b>；往上缩＝回溯时才真正接箭头。',

    roles: [
      {c:'orange', code:'head',    text:'当前层的 head：正在接箭头的节点'},
      {c:'green',  code:'newHead', text:'新表头：递归到链尾就定死，之后原样上交'},
      {c:'blue',   code:'in',      text:'已压栈、正在等待回溯的层'},
      {c:'ink',    code:'stack',   text:'右侧竖条 = 递归调用栈'}
    ],
    legend: [
      {c:'orange', text:'head 当前回溯到的节点'},
      {c:'blue',   text:'已压栈等待回溯'},
      {c:'green',  text:'箭头已接好的部分 / ▼ newHead 名牌'}
    ],

    codeTitle: '跟着高亮读代码——下探阶段（第 5 行）画面一根箭头都不会变；真正的反转全发生在回溯的第 6、7 行。',

    idea: '递归版把反转推迟到回溯阶段：先一路递到链尾定死新表头，回来时才让后继回头指向自己、再斩断自己的旧箭头。',

    complexity: '时间 O(n)（每个节点回溯时处理一次）　·　空间 O(n)（递归调用栈最深 n 层）',

    qa: [
      {q:'为什么反转要等到回溯阶段才做？下探时行不行？',
       a:'不行。反转节点 i 的前提是"i 后面那截已经反转好"——下探时这个前提还不成立。递归先扎到链尾再往回走，走到第 i 层时后面全接好了，此刻执行 head.next.next = head 才恰到好处。把动作推迟到"前提刚成立"的时刻，正是递归的思维方式。'},
      {q:'head.next = None 为什么必须写？',
       a:'第 6 行刚让后继回头指向自己，而自己的 next 还指着后继——两个节点互相指着，是个临时的小环。不马上斩断，整条链从这里成环，之后谁也走不出去；斩断后自己成为新链当前的尾巴，等下一层回溯再把更前面的节点接上来。'},
      {q:'和迭代版（解法一）怎么取舍？',
       a:'时间同为 O(n)。迭代版边走边翻、空间 O(1)，链表多长都不怕，面试首选；递归版代码更短、更贴近链表的递归定义，但调用栈深 O(n)，长链表可能栈溢出。'},
      {q:'newHead 为什么从头到尾不变？',
       a:'它在出口处诞生（尾节点就是新头），之后每一层只是原样 return——递归链上的层都在"传话"，真正干活的只有回溯时的两行。这也解释了为什么出口可以直接 return head。'}
    ],

    code: `class Solution:
    def reverseList(self, head):
        if head is None or head.next is None:  # 递归出口: 空表 / 尾节点
            return head                        # 尾节点就是新表头
        newHead = self.reverseList(head.next)  # 下探: 先反转后面那一截
        head.next.next = head                  # 回溯: 后继回头指向自己
        head.next = None                       # 斩断旧箭头, 防止成环
        return newHead                         # 新表头原样上交
`,

    sol(input){
      const vals = (input.head || []).filter(x => x != null);
      const rec = i => (i >= vals.length) ? [] : rec(i + 1).concat([vals[i]]);
      return rec(0);
    },
    expected: [5,4,3,2,1],

    steps(input){
      const F = [];
      const hs = (input.head || []).filter(x => x != null);
      const nodes = hs.map((v, i) => ({key:'n' + i, val:v}));
      const N = nodes.length;

      let edges = [];                       // 画面箭头快照(先改好再切片定死)
      for(let i = 0; i < N - 1; i++) edges.push(['n' + i, 'n' + (i + 1)]);
      const stack = [];                     // 调用栈: {key, val}
      let newHead = null;                   // 出口之后固定为尾节点

      const nv = k => k == null ? 'None' : '节点' + nodes[+k.slice(1)].val;
      const stackSnap = () => stack.map(f => ({key:f.key, val:f.val}));
      const headTag = N ? {key:'n0', text:'旧 head', cls:'mq'} : null;

      /* ★ 快照原则：edges/stack/states/ptrs/vars 全部在 push 那一刻定死 */
      const draw = (o) => (v) => {
        v.list('L', nodes, {
          label:'链表　·　箭头 = 节点的 <code>next</code> 指向',
          states: o.states || {},
          edges: o.edges || [],
          edgeStates: o.edgeStates || {},
          pointers: o.ptrs || [],
          headTag: headTag
        });
        v.stack('S', o.stack || [], {
          label:'递归调用栈　·　越往下越新',
          states: (o.stack || []).length ? {[o.stack[o.stack.length - 1].key]:'active'} : {},
          topTag:'栈顶'
        });
        if(o.vars) v.vars('vars', o.vars, {label:'变量', hl:o.hlVars || []});
        if(o.result) v.result(o.result, {label:'返回结果'});
      };

      F.push({hl:[1,2], tag:'读题', cls:'t-grey',
        msg:'递归版换一个思路：迭代是"走到哪、翻到哪"，递归则是<b>先一头扎到链尾，回来时才翻箭头</b>。' +
            '左边盯箭头、右边盯调用栈：栈往下长一层＝把"反转这段"再推迟一次；栈往上缩一层＝回溯时真正接一根箭头。' +
            '先记住分工：<b>下探阶段只推迟不干活，反转全部发生在回溯阶段</b>。',
        do: draw({edges: edges.slice(), stack: [],
                  ptrs: N ? [{key:'n0', text:'▼ head', cls:'mi'}] : [],
                  vars:{head: N ? nv('n0') : 'None', newHead:'待定'}})});

      if(N === 0){
        F.push({hl:[3], ok:3, tag:'递归出口', cls:'t-green',
          msg:'<code>head</code> 是 None → 递归出口立即命中：空表反转还是空表，<code>return None</code>。',
          do: draw({edges:[], stack:[], vars:{head:'None', newHead:'None'}})});
        F.push({hl:[4], tag:'返回', cls:'t-dark',
          msg:'🎉 <code>return None</code>：空链表的反转结果就是空，一步出口直达。',
          do: draw({edges:[], stack:[], vars:{head:'None', newHead:'None'}, result: []})});
        return F;
      }

      for(let i = 0; i < N; i++){
        stack.push({key:'f' + i, val:'rl(节点' + hs[i] + ')'});
        if(i < N - 1){
          const descStates = {};
          for(let j = 0; j <= i; j++) descStates['n' + j] = (j === i) ? 'active' : 'in';
          F.push({hl:[5], no:3, tag:'下探 · 推迟', cls:'t-blue',
            msg:'进入 <code>reverseList(节点' + hs[i] + ')</code>：既不是 None 也不是尾节点 → 出口不成立。' +
                '本层<b>一根箭头都不动</b>，把"反转 节点' + hs[i] + ' 后面那一截"整包丢给下一层（第 5 行），自己这层压进调用栈原地等待（蓝色＝在栈里排队）。' +
                '画面验证一下：栈长高了，链表的箭头一根没变——这就是"推迟"。',
            do: draw({edges: edges.slice(), stack: stackSnap(),
                      ptrs: [{key:'n' + i, text:'▼ head', cls:'mi'}],
                      states: descStates,
                      vars:{head: nv('n' + i), newHead:'待定'}})});
        } else {
          newHead = 'n' + (N - 1);
          F.push({hl:[3], ok:3, tag:'递归出口', cls:'t-green',
            msg:'进入 <code>reverseList(节点' + hs[i] + ')</code>：<code>head.next is None</code> 成立——' + nv(newHead) + ' 身后没有箭头，' +
                '"它后面那一截"天然已经反转好（就是它自己）。<b>递归到底了</b>：' +
                nv(newHead) + ' 被点亮，它从此就是新表头 newHead，绿色名牌钉在头上不再挪窝。',
            do: draw({edges: edges.slice(), stack: stackSnap(),
                      ptrs: [{key:'n' + i, text:'▼ head', cls:'mi'}, {key:newHead, text:'▼ newHead', cls:'mg'}],
                      states: {['n' + i]:'target'},
                      vars:{head: nv('n' + i), newHead: nv(newHead)}, hlVars:['newHead']})});
          stack.pop();
          F.push({hl:[4], tag:'出口返回', cls:'t-green',
            msg:'<code>return head</code>：' + nv(newHead) + ' 出栈，把"反转好的后段"上交给上一层。' +
                (N >= 2 ? '栈顶轮到 <code>reverseList(节点' + hs[N - 2] + ')</code>——<b>回溯阶段正式开始</b>：前面被推迟的反转，从这一帧起一层层补做。'
                        : '链表只有一个节点，它自己就是新头，回溯无事可做。'),
            do: draw({edges: edges.slice(), stack: stackSnap(),
                      ptrs: [{key:newHead, text:'▼ newHead', cls:'mg'}],
                      states: {['n' + (N - 1)]:'done'},
                      vars:{head: N >= 2 ? nv('n' + (N - 2)) : 'None', newHead: nv(newHead)}})});
        }
      }

      for(let i = N - 2; i >= 0; i--){
        const doneStates = {};
        for(let j = i + 1; j < N; j++) doneStates['n' + j] = 'done';

        edges.push(['n' + (i + 1), 'n' + i]);
        const backIdx = edges.length - 1;
        F.push({hl:[6], tag:'接回头箭头', cls:'t-orange',
          msg:'回到 <code>reverseList(节点' + hs[i] + ')</code> 这一层（栈顶），执行 <code>head.next.next = head</code>：' +
              '让后继 节点' + hs[i + 1] + ' 的箭头<b>掉头回头</b>指向 节点' + hs[i] + '——画面上橙色新箭头向左接上。' +
              '此刻 节点' + hs[i] + ' → 节点' + hs[i + 1] + ' 的旧箭头还没拆，两个节点<b>互相指着、暂时是个小环</b>——这正是下一行要收拾的。' +
              '递归版的"反转本体"就是这一行，它被推迟到了回溯阶段才执行。',
          do: draw({edges: edges.slice(), edgeStates: {[backIdx]:'e-done'},
                    stack: stackSnap(),
                    ptrs: [{key:'n' + i, text:'▼ head', cls:'mi'}, {key:newHead, text:'▼ newHead', cls:'mg'}],
                    states: Object.assign({['n' + i]:'active'}, doneStates),
                    vars:{head: nv('n' + i), newHead: nv(newHead)}})});

        edges = edges.filter(([a, b]) => !(a === 'n' + i && b === 'n' + (i + 1)));
        F.push({hl:[7], tag:'斩断旧箭头', cls:'t-red',
          msg:'<code>head.next = None</code>：节点' + hs[i] + ' 指向旧后继的箭头拆掉——临时小环解除，' +
              '节点' + hs[i] + ' 成为新链<b>当前的尾巴</b>，安安静静等下一层回溯把更前面的节点接到它头上。' +
              '踩坑提醒：漏了这一行，节点' + hs[i] + ' 和 节点' + hs[i + 1] + ' 永远互指，链表从这里成环，遍历再也走不出去。',
          do: draw({edges: edges.slice(), stack: stackSnap(),
                    ptrs: [{key:'n' + i, text:'▼ head', cls:'mi'}, {key:newHead, text:'▼ newHead', cls:'mg'}],
                    states: Object.assign({['n' + i]:'active'}, doneStates),
                    vars:{head: nv('n' + i), newHead: nv(newHead)}})});

        stack.pop();
        F.push({hl:[8], tag:'本层收工', cls:'t-green',
          msg:'<code>return newHead</code>：新表头 节点' + hs[N - 1] + ' 原样上交——它<b>从头到尾没变过</b>，递归链上每一层都只是"传话"，真正干活的只有第 6、7 两行。' +
              (i > 0 ? '栈顶轮到 <code>reverseList(节点' + hs[i - 1] + ')</code>，继续回溯接箭头。'
                     : '栈已清空，最外层也返回了。'),
          do: draw({edges: edges.slice(), stack: stackSnap(),
                    ptrs: [{key:newHead, text:'▼ newHead', cls:'mg'}],
                    states: Object.assign({['n' + i]:'done'}, doneStates),
                    vars:{head: i > 0 ? nv('n' + (i - 1)) : 'None', newHead: nv(newHead)}})});
      }

      const allDone = {};
      nodes.forEach(n => { allDone[n.key] = 'done'; });
      F.push({hl:[8], tag:'递归结束', cls:'t-dark',
        msg:'🎉 最外层 <code>reverseList(节点' + hs[0] + ')</code> 返回 newHead = 节点' + hs[N - 1] +
            '，所有箭头全部掉头：<b>' + hs.slice().reverse().join('→') + '</b>。' +
            '复盘：下探阶段一根箭头都没动，反转全部发生在<b>回溯阶段</b>——这就是"递归版＝把反转推迟到回溯"的含义。' +
            '时间 O(n)；调用栈最深 n 层，空间 O(n)，比迭代版的 O(1) 费内存。',
        do: draw({edges: edges.slice(), stack: [],
                  ptrs: [{key:newHead, text:'▼ newHead', cls:'mg'}],
                  states: allDone,
                  vars:{head:'None', newHead: nv(newHead)},
                  result: hs.slice().reverse()})});

      return F;
    }
  }
});
</script>
