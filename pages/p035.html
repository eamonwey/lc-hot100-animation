/* 本地工具：标准 LeetCode 层序(+null)解析与树布局。
   注：assets/viz.js 的 Viz.parseTree 在"左孩子为 null、右孩子非 null"时会把右孩子错挂到左边，
   这里按与校验器 _build_tree 相同的标准规则在页内实现（不改 assets）。 */
function parseLC(arr){
  arr = arr || [];
  const nodes = [];
  if(!arr.length || arr[0] == null) return {root:null, nodes};
  nodes.push({key:0, val:arr[0], left:null, right:null});
  let nk = 1, k = 1;
  const q = [0];
  while(k < arr.length && q.length){
    const pk = q.shift();
    [0,1].forEach(slot => {
      if(k >= arr.length) return;
      const v = arr[k++];
      if(v != null){
        const c = {key:nk++, val:v, left:null, right:null};
        nodes.push(c);
        if(slot === 0) nodes[pk].left = c.key; else nodes[pk].right = c.key;
        q.push(c.key);
      }
    });
  }
  return {root:0, nodes};
}
function layoutLC(T){
  const CELLW = 46, GAPX = 24, ROWH = 74, pad = 6;
  const byKey = {}; T.nodes.forEach(n => byKey[n.key] = n);
  const nodes = [], edges = [];
  if(T.root == null) return {nodes, edges, w:120, h:60};
  let maxD = 0, counter = 0;
  (function rec(k, d){
    const nd = byKey[k];
    if(nd.left != null) rec(nd.left, d + 1);
    nodes.push({key:k, val:nd.val, x: pad + counter * (CELLW + GAPX), y: pad + d * ROWH,
                leaf: nd.left == null && nd.right == null});
    counter++; maxD = Math.max(maxD, d);
    if(nd.right != null) rec(nd.right, d + 1);
  })(T.root, 0);
  T.nodes.forEach(n => {
    if(n.left != null) edges.push([n.key, n.left]);
    if(n.right != null) edges.push([n.key, n.right]);
  });
  return {
    nodes, edges,
    w: Math.max(120, pad * 2 + T.nodes.length * (CELLW + GAPX) - GAPX),
    h: Math.max(60, pad * 2 + (maxD + 1) * ROWH)
  };
}

    def inorderTraversal(self, root):
        res = []                       # 访问序列
        def dfs(node):                 # 中序: 左 → 根 → 右
            if not node:               # 空位: 什么都不记
                return
            dfs(node.left)             # 1. 先走完左子树

    const byKey = {}; T.nodes.forEach(n => byKey[n.key] = n);
    const out = [];
    (function dfs(k){
      if(k == null) return;
      dfs(byKey[k].left);
      out.push(byKey[k].val);
      dfs(byKey[k].right);
    })(T.root);
    return out;
  },

        msg:'节点 ' + valOf(k) + ' 的左子树整个走完（左边该记的都已记入 res）→ 按口诀"<b>左、根、右</b>"，轮到中间的根了。' +

        do: draw({stack, cur:k, path: path.concat(k), done: doneKeys(), tags: tagSnap(), res: res.slice()})});

      res.push(byKey[k].val);
      ord.set(k, res.length);
      F.push({hl:[8], tag:'记录', cls:'t-orange',
        msg:'<code>res.append(' + valOf(k) + ')</code>：左子树已完、右子树未去，节点 ' + valOf(k) + ' 正好卡在中间——这就是中序的"根"位。' +
            '它是第 <b>' + res.length + '</b> 个被访问的 → res = <b>[' + res.map(x => LCesc(String(x))).join(',') + ']</b>，res 行新格子标亮，树上同时挂出访问名次牌。',
        do: draw({stack, cur:k, path: path.concat(k), done: doneKeys(), tags: tagSnap(), res: res.slice()})});

      visit(byKey[k].right, stack, path.concat(k));
      F.push({hl:[9], tag:'右边回来', cls:'t-green',
        msg:'节点 ' + valOf(k) + ' 的右子树也走完 → 左、根、右三件事全部做完，<code>dfs(节点 ' + valOf(k) + ')</code> 返回，栈顶弹出。' +
            '对上一层来说，这整棵子树只是它"左半边"或"右半边"的一部分——上一层一直等着的就是这个 return。',
        do: draw({stack: frames, path, done: doneKeys(), tags: tagSnap(), res: res.slice()})});

    F.push({hl:[1,2,3,4,10], tag:'初始化', cls:'t-grey',
      msg:'中序口诀：<b>左子树 → 根 → 右子树</b>——"根"记在中间，这就是"中"字的由来（前序、后序只是根的位置提前或延后）。' +
          '实现就是三行递归加一个空位刹车，res 从空 [] 开始攒。盯右侧调用栈：往下长 = 走进孩子，往上缩 = 返回汇报。',
      do: draw({stack:[], done:[], tags:{}, res:[]})});

    visit(T.root, [], []);
    const vals = res.slice();

    F.push({hl:[11], tag:'遍历完成', cls:'t-dark',

    code: `class Solution:
    def inorderTraversal(self, root):
        res = []
        stack = []                  # 显式栈: 手动模拟调用栈
        cur = root                  # 当前指针
        while cur or stack:         # 指针还有路走 或 栈里还有活
            while cur:              # 一路向左
                stack.append(cur)   # 途经节点全部压栈
                cur = cur.left
            cur = stack.pop()       # 左边到底: 弹栈访问
            res.append(cur.val)     # 记入访问序列
            cur = cur.right         # 转向右子树
        return res
`,

        cur = stack.pop();
        res.push(byKey[cur].val);
        cur = byKey[cur].right;
      }
      return res;
    },

        const st = o.stack || [];
        v.stack('S', st, {
          label:'显式栈 <code>stack</code>　·　手动模拟的调用栈',
          states: st.length ? {[st[st.length - 1].key]:'active'} : {},
          topTag:'栈顶'
        });
        v.arr('res', o.res || [], {label:'已访问序列 <code>res</code>',
          states: (o.res || []).length ? {[o.res.length - 1]:'just'} : {}});
        if(o.vars) v.vars('vars', o.vars, {label:'变量', hl:o.hlVars || []});
        if(o.result != null) v.result(o.result, {label:'返回结果'});
      };

      F.push({hl:[1,2,3,4,5], tag:'初始化', cls:'t-grey',
        msg:'递归版把"待会回到哪个节点"托付给看不见的<b>函数调用栈</b>；这一版自己雇一个显式栈 <code>stack</code> 来记，' +
            '再派指针 <code>cur</code> 在树上走。口诀不变——<b>左 → 根 → 右</b>：' +
            'cur 一路向左把途经节点压栈，压到头就弹栈访问、再转向右子树。<b>压栈＝递归里"调用自己"，弹栈＝"返回上一层"</b>。',
        do: draw({stack: [], done: [], tags: {}, res: [],
                  vars: {cur: T.root != null ? ev(byKey[T.root].val) : 'None', 栈深: 0}})});

      while(true){
        const cond = (cur != null) || stack.length > 0;
        F.push({hl:[6], ok: cond ? 6 : undefined, no: cond ? undefined : 6,
          tag: cond ? '外层检查' : '外层检查 · 结束', cls: cond ? 't-blue' : 't-red',
          msg: cond
            ? '<code>while cur or stack</code>：cur = ' + (cur != null ? ev(byKey[cur].val) : 'None') +
              '，栈里有 ' + stack.length + ' 个节点（从底到顶：' + stackText() + '）→ 条件成立，继续。' +
              '两个条件的分工：<b>cur 非空＝左边还有新路可下；栈非空＝还有节点欠一次访问</b>——只看其中一个都会提前收工。'
            : 'cur = None 且栈也空了——左边的路走完了、欠访问的节点也弹干净了，<code>while</code> 首次不成立，遍历结束。',
          do: draw({stack: stackSnap(), cur, done: doneKeys(), tags: tagSnap(), res: res.slice(),
                    vars: {cur: cur != null ? ev(byKey[cur].val) : 'None', 栈深: stack.length}})});
        if(!cond) break;

        while(cur != null){
          stack.push(cur);
          F.push({hl:[7,8], ok:7, tag:'压栈', cls:'t-blue',
            msg:'<code>while cur</code>：cur = 节点' + ev(byKey[cur].val) + ' 非空 → 把它<b>压栈</b>。' +
                '为什么先不访问它？中序要求"根"排在左子树后面——它现在只是路上的祖先，先存进栈里排队，' +
                '等左边全部处理完再弹出来记。这个压栈动作，正是递归版里"函数调用自己"时调用栈偷偷做的事。',
            do: draw({stack: stackSnap(), cur, done: doneKeys(), tags: tagSnap(), res: res.slice(),
                      vars: {cur: ev(byKey[cur].val), 栈深: stack.length}})});
          const par = cur;
          cur = byKey[cur].left;
          F.push({hl:[9], tag:'向左走', cls:'t-ink',
            msg:'<code>cur = cur.left</code>：从 节点' + ev(byKey[par].val) + ' 挪到' +
                (cur != null ? ' <b>节点' + ev(byKey[cur].val) + '</b>，继续向左探。' : ' <b>空位</b>——这一路压栈告一段落。') +
                (cur != null ? '' : ' 栈里每个节点都在等同一件事：左子树清完，轮到自己被弹出访问。'),
            do: draw({stack: stackSnap(), cur, done: doneKeys(), tags: tagSnap(), res: res.slice(),
                      vars: {cur: cur != null ? ev(byKey[cur].val) : 'None', 栈深: stack.length}})});
        }
        F.push({hl:[7], no:7, tag:'左边到底', cls:'t-grey',
          msg:'<code>while cur</code>：cur = None → 内层循环停。此刻栈从底到顶是 <b>' + stackText() + '</b>——' +
              '栈顶就是"最靠左、该第一个被访问的节点"。递归版此刻正对应"一路 dfs(node.left) 触底、即将返回"的瞬间。',
          do: draw({stack: stackSnap(), cur: null, done: doneKeys(), tags: tagSnap(), res: res.slice(),
                    vars: {cur: 'None', 栈深: stack.length}})});

        cur = stack.pop();
        F.push({hl:[10], tag:'弹栈访问', cls:'t-orange',
          msg:'<code>cur = stack.pop()</code>：弹出栈顶 <b>节点' + ev(byKey[cur].val) + '</b>——它的左子树恰好全部处理完（访问过或是空位），' +
              '按"左 → 根 → 右"正好轮到它自己。<b>弹栈＝递归版里"函数返回、回到上一层"的手动版</b>：栈就是那口调用锅。',
          do: draw({stack: stackSnap(), cur, done: doneKeys(), tags: tagSnap(), res: res.slice(),
                    vars: {cur: ev(byKey[cur].val), 栈深: stack.length}})});

        res.push(byKey[cur].val);
        ord.set(cur, res.length);
        F.push({hl:[11], tag:'记录', cls:'t-green',
          msg:'<code>res.append(' + ev(byKey[cur].val) + ')</code>：它是第 <b>' + res.length + '</b> 个被访问的 → ' +
              'res = <b>[' + res.map(x => ev(x)).join(',') + ']</b>，res 行新格子标亮，树上同时挂出绿色名次牌。' +
              '到此"左"和"根"都齐了，还差"右"。',
          do: draw({stack: stackSnap(), cur, done: doneKeys(), tags: tagSnap(), res: res.slice(),
                    vars: {cur: ev(byKey[cur].val), 栈深: stack.length}, hlVars:['cur']})});

        const par2 = cur;
        cur = byKey[cur].right;
        F.push({hl:[12], tag:'转向右子树', cls:'t-ink',
          msg:'<code>cur = cur.right</code>：节点' + ev(byKey[par2].val) + ' 的"根"位记完，指针挪向' +
              (cur != null ? '右孩子 <b>节点' + ev(byKey[cur].val) + '</b>——对这棵右子树再走一遍同一套流程（压栈 → 弹栈 → 记录）。'
                           : ' <b>空位</b>——节点' + ev(byKey[par2].val) + ' 的整棵子树完工，控制权交回栈里更上层的节点。'),
          do: draw({stack: stackSnap(), cur, done: doneKeys(), tags: tagSnap(), res: res.slice(),
                    vars: {cur: cur != null ? ev(byKey[cur].val) : 'None', 栈深: stack.length}})});
      }

      F.push({hl:[13], tag:'遍历完成', cls:'t-dark',
        msg:'🎉 <code>return res</code>：中序序列 <b>[' + res.map(x => ev(x)).join(',') + ']</b>。' +
            '复盘：每个节点恰好压栈、弹栈、记录各一次，时间 O(n)；显式栈最深等于树高，空间 O(h)。' +
            '对比递归版：那个看不见的调用栈在这里变成了看得见的 <code>stack</code>——' +
            '<b>显式栈就是手动模拟的调用栈</b>，这套"自己维护栈 + 指针"的写法是所有递归转迭代的通用套路。',
        do: draw({stack: [], cur: null, done: doneKeys(), tags: tagSnap(), res: res.slice(), result: res.slice()})});

      return F;
    }
  }
});
</script>
