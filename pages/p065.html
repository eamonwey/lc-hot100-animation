<script>
LC.register({
  order: 65, num: 33, title: '搜索旋转排序数组', diff: '中等', cat: '二分查找',
  method: 'search',

  lede: '题目：数组原本升序、但在某个点上被<b>拧断旋转</b>了（如 0,1,2,4,5,6,7 → 4,5,6,7,0,1,2），要在 O(log n) 里找到 <span class="var o">target</span> 的下标，没有就返回 -1。' +
        '动画里 <span class="var r">l</span>/<span class="var r">r</span> 圈住候选区间，<span class="var i">mid</span> 每轮先问一句：<b>左右哪一半是有序的？</b>' +
        'target 若落在有序那一半的范围里就去那边，否则去另一半——每次都稳稳扔掉一半。',

  roles: [
    {c:'blue',   code:'l / r', text:'候选区间 [l, r]（闭区间）'},
    {c:'orange', code:'mid',   text:'每轮试探的中点'},
    {c:'blue',   code:'蓝格',  text:'还在候选区间里的格子'},
    {c:'green',  code:'绿格',  text:'本轮判定为有序的那一半'}
  ],

  codeTitle: '跟着高亮读代码——第 8 行变<span style="color:var(--green)">绿</span>＝左半有序，变<span style="color:var(--red)">红</span>＝断点在左半、右半有序；第 9/14 行绿＝target 在有序半的范围内。',

  legend: [
    {c:'blue', text:'候选区间 [l, r]'},
    {c:'orange', text:'mid 中点'},
    {c:'green', text:'本轮判定有序的一半'},
    {swatch:'var(--grey-soft)', text:'灰格 = 已整段出局'}
  ],

  idea: '无序的旋转数组里，mid 切开的两半<b>必有一半完全有序</b>：先认出有序半，再看 target 萪不落在它的范围内——落里去那边，不落去另一半。',

  qa: [
    {q:'为什么两半里必有一半有序？',
     a:'断点（数值断崖）只有一个。mid 无论切在哪，断点只能落在其中一侧：断点不在左半，左半就是纯递增；断点在左半，右半就是纯递增。所以 <code>nums[l] ≤ nums[mid]</code> 成立时左半必有序，否则右半必有序。'},
    {q:'l == mid 时（区间只剩一两个数）怎么办？',
     a:'此时 nums[l] 和 nums[mid] 是同一个数，nums[l] ≤ nums[mid] 恒成立，会走"左半有序"分支——其实"有序半"只有 mid 自己一个元素，判定 nums[l] ≤ target < nums[mid] 依然正确：不满足就 l = mid + 1，不会漏也不会错。预设 [5,1,3] 可以看到这种情况。'},
    {q:'范围判断为什么要带等号？',
     a:'左半有序时 target 的地盘是 <code>nums[l] ≤ target &lt; nums[mid]</code>：左端 nums[l] 本身就在区间里，所以带等号；mid 已经查过不是 target，所以右端开。右半同理是 <code>nums[mid] &lt; target ≤ nums[r]</code>。等号放错一边就会漏掉边界上的答案。'},
    {q:'复杂度？',
     a:'每轮扔掉一半，O(log n)；只动几个下标，空间 O(1)。比"先找断点再二分两次"的写法少一半代码。'}
  ],

  complexity: '时间 O(log n)　·　空间 O(1)',

  form: [
    {key:'nums', label:'nums', type:'arr', def:[4,5,6,7,0,1,2]},
    {key:'target', label:'target', type:'num', def:0}
  ],
  presets: [
    {label:'[4,5,6,7,0,1,2] 找 0', values:{nums:[4,5,6,7,0,1,2], target:0}},
    {label:'[4,5,6,7,0,1,2] 找 3（不存在）', values:{nums:[4,5,6,7,0,1,2], target:3}},
    {label:'[6,7,0,1,2,4,5] 找 4（走右半有序分支）', values:{nums:[6,7,0,1,2,4,5], target:4}},
    {label:'[6,7,0,1,2,4,5] 找 7（右半有序但不中）', values:{nums:[6,7,0,1,2,4,5], target:7}},
    {label:'[5,1,3] 找 3（断点在窗口里）', values:{nums:[5,1,3], target:3}}
  ],

  code: `class Solution:
    def search(self, nums, target):
        l, r = 0, len(nums) - 1          # 闭区间 [l, r]
        while l <= r:
            mid = (l + r) // 2
            if nums[mid] == target:      # 正中目标
                return mid
            if nums[l] <= nums[mid]:     # 左半 [l..mid] 有序
                if nums[l] <= target < nums[mid]:
                    r = mid - 1          # target 落在有序的左半
                else:
                    l = mid + 1          # 不在左半, 只能去右半
            else:                        # 右半 [mid..r] 有序
                if nums[mid] < target <= nums[r]:
                    l = mid + 1          # target 落在有序的右半
                else:
                    r = mid - 1          # 不在右半, 只能去左半
        return -1
`,

  sol(input){
    const nums = input.nums, target = input.target;
    let l = 0, r = nums.length - 1;
    while(l <= r){
      const mid = (l + r) >> 1;
      if(nums[mid] === target) return mid;
      if(nums[l] <= nums[mid]){
        if(nums[l] <= target && target < nums[mid]) r = mid - 1;
        else l = mid + 1;
      } else {
        if(nums[mid] < target && target <= nums[r]) l = mid + 1;
        else r = mid - 1;
      }
    }
    return -1;
  },
  expected: 4,

  quiz: [
    {q:'mid 把旋转数组切成两半,有没有可能两半「同时」都不是纯递增?',
     options:['可能,旋转得厉害时会两半都乱','不可能:数值断崖(断点)全数组只有一个,mid 无论切在哪,断点都只能掉进一侧,另一侧必然纯递增','取决于数组长度是奇数还是偶数'],
     answer:1,
     explain:'旋转数组 = 高坡 + 低坡两段各自递增,唯一的"乱源"是断点。mid 切开后,断点只能落在左半或右半之一:断点不在左半 → 左半纯递增(nums[l] ≤ nums[mid]);断点在左半 → 右半纯递增。所以 <code>nums[l] ≤ nums[mid]</code> 一次比较就能认出有序半——这是本题一切操作的支点,也是"无序数组也能二分"的全部底气。',
     jumpTo:7},
    {q:'代入算一算:nums = [8,9,2,3,4]、target = 3,返回下标几?',
     options:['1','2','3','-1'],
     answer:2,
     explain:'第一轮:l=0,r=4,mid=2(nums[mid]=2≠3)。nums[0]=8 > nums[2]=2 → 断点在左半,右半 [2..4](值 2,3,4)有序;判断 2 < 3 ≤ 4 成立 → l=3。第二轮:l=3,r=4,mid=3,nums[3]=3 正中目标 → <b>返回 3</b>。两轮各扔一半,正是"先认有序半、再用数值范围定方向"的标准走法。',
     jumpTo:16},
    {q:'左半有序时,范围判断若写成 nums[l] < target < nums[mid](把左端的等号也去掉),会出什么问题?',
     options:['没事,更保守不会错','会漏解:target 恰好等于 nums[l] 时(如 [4,5,6,7,0,1,2] 找 4)会被误判去右半——可 4 根本不在右边,最后错报 -1','只有数组有重复数字时才出问题'],
     answer:1,
     explain:'等号口诀:<b>等号给还留在区间里的端点 nums[l],mid 已当面查过、永远开</b>。找 4 时第一轮 nums[l]=4 ≤ nums[mid]=7,左半有序,4 正好踩在左端点上——范围 [4,7) 用 ≥ 才罩得住它;去掉等号,4 被赶去右半,而右半全是 0、1、2,4 从此石沉大海,返回 -1。范围判断的每一边开闭,都对应"这个数有没有被当面排除过",不是随手写的。',
     jumpTo:8},
  ],

  steps(input){
    const F = [];
    const nums = input.nums, target = input.target;
    const n = nums.length;

    const draw = (o) => (v) => {
      v.arr('nums', nums, {
        label:'数组 <code>nums</code>　·　' + o.phase,
        states:o.states, markers:o.markers, labels:o.labels || {}
      });
      v.vars('vars', o.vars, {label:'变量'});
      if(o.res !== undefined) v.result(o.res, {label:'返回结果'});
    };
    const mk = (l, r, mid) => {
      const a = [{name:'l', idx:l, cls:'mr', text:'▲ l'},
                 {name:'r', idx:r, cls:'mr', text:'▲ r'}];
      if(mid != null) a.push({name:'mid', idx:mid, cls:'mi', text:'▲ mid'});
      return a;
    };
    const stOf = (l, r, mid, extra) => {
      const s = {};
      for(let t = 0; t < n; t++) s[t] = (t >= l && t <= r) ? 'in' : 'muted';
      if(mid != null) s[mid] = 'active';
      Object.assign(s, extra || {});
      return s;
    };

    let l = 0, r = n - 1;

    // 找旋转断点（只为解说用，不是算法一部分）
    let drop = -1;
    for(let t = 0; t + 1 < n; t++) if(nums[t] > nums[t + 1]){ drop = t; break; }

    F.push({hl:[1,2], tag:'准备', cls:'t-grey',
      msg:'target = <b>' + target + '</b>，先在闭区间 [0, ' + (n - 1) + '] 里找。数组被拧过、整体不再递增，普通二分"比中点定方向"那套失效了——但每一轮 <b>mid 切开的两半里必有一半完全有序</b>，只要认出有序的那一半，二分就能继续走下去。',
      do: draw({phase:'准备', states: stOf(0, n - 1, null), markers: mk(0, n - 1, null),
                vars:{l:l, r:r, mid:'—', target:target}})});

    F.push({hl:[3], tag:'认题', cls:'t-grey',
      msg: drop >= 0
        ? '旋转断点在 <code>' + nums[drop] + ' → ' + nums[drop + 1] + '</code>（第 ' + (drop + 1) + ' → 第 ' + (drop + 2) + ' 格）：数组 = 高坡 + 低坡两段各自递增，且低坡整体比高坡小（绿色 = 断点后的那段）。断点全数组<b>只有一个</b>——这就是"两半必有一半有序"的根源：mid 不管切在哪，断点都只能掉进一侧，另一侧必然是纯递增。'
        : '数组没转（或转了整圈），本来就整体递增——那就是普通二分，本页逻辑同样成立（每轮都会判"左半有序"）。',
      do: (function(){
        const s = {}, labels = {};
        for(let t = 0; t < n; t++) s[t] = 'in';
        if(drop >= 0){
          for(let t = 0; t <= drop; t++) s[t] = 'in';
          for(let t = drop + 1; t < n; t++) s[t] = 'peek';
          labels[0] = '段1';
          labels[drop + 1] = '段2';
        }
        return (v) => draw({phase:'认题：两段各自递增', states:s, labels:labels,
                            markers: mk(0, n - 1, null), vars:{l:l, r:r, mid:'—', target:target}})(v);
      })()});

    F.push({hl:[8,13,14,15,16,17,18], tag:'分支地图', cls:'t-grey',
      msg:'整段代码只有两个岔路口：<b>第 8 行</b>判断哪半有序——成立走 9~12（左半有序），不成立走 13~17（右半有序）；两半都容不下 target 时由 <b>第 18 行</b> return -1 兜底。每轮的套路固定三拍：<b>认出有序半 → 查 target 在不在它的数值范围里 → 扔掉确认不含 target 的那一半</b>。预设 [6,7,0,1,2,4,5] 和「找 3」会走右半分支，可以对照着看。',
      do: draw({phase:'分支地图', states: stOf(0, n - 1, null), markers: mk(0, n - 1, null),
                vars:{l:l, r:r, mid:'—', target:target}})});

    while(l <= r){
      const mid = (l + r) >> 1;
      F.push({hl:[4], ok:4, tag:'循环检查', cls:'t-blue',
        msg:'<code>l = ' + l + ' ≤ r = ' + r + '</code>，区间里还剩 <b>' + (r - l + 1) + '</b> 个候选 → 继续收缩。这里用 <code>&lt;=</code>（闭区间）：l == r 时区间还剩最后一个格子，它也可能是 target，必须进循环查——写成 &lt; 就会把它漏掉。',
        do: draw({phase:'区间 [' + l + ', ' + r + ']', states: stOf(l, r, null), markers: mk(l, r, null),
                  vars:{l:l, r:r, mid:'—', target:target}})});
      F.push({hl:[5], tag:'取中点', cls:'t-ink',
        msg:'<code>mid = (' + l + '+' + r + ')//2 = ' + mid + '</code>，看第 ' + (mid + 1) + ' 格：<code>nums[mid] = ' + nums[mid] + '</code>。mid 把区间劈成左半 [l..mid] 和右半 [mid..r]——接下来先查 mid 本人是不是 target，再判断哪半有序。',
        do: draw({phase:'区间 [' + l + ', ' + r + ']', states: stOf(l, r, mid), markers: mk(l, r, mid),
                  vars:{l:l, r:r, mid:mid, target:target, 'nums[mid]':nums[mid]}})});

      if(nums[mid] === target){
        F.push({hl:[6,7], ok:6, tag:'正中目标', cls:'t-green',
          msg:'<code>nums[' + mid + '] = ' + nums[mid] + ' = target</code> → 正中目标，返回下标 <b>' + mid + '</b>。每轮进门先查 mid 本人，查完才轮到"判断哪半有序"——这个顺序不能颠倒：先排除 mid，后面扔半边时才敢把 mid 连着一起扔。整体无序的数组，照样被"找有序半"的二分拿下。',
          do: draw({phase:'命中！', states: stOf(l, r, mid, (function(){ const o = {}; o[mid] = 'target'; return o; })()),
                    markers: mk(l, r, mid),
                    vars:{l:l, r:r, mid:mid, target:target, 'nums[mid]':nums[mid]}})});
        F.push({hl:[7], tag:'返回', cls:'t-dark',
          msg:'<code>return mid = ' + mid + '</code>：target 站在第 ' + (mid + 1) + ' 格 🎉 带走一句话：无序拦不住二分，只要每轮能认出有序的那一半、并用数值范围决定去留，每次都能稳稳扔掉一半。',
          do: draw({phase:'返回 ' + mid,
                    states: stOf(l, r, mid, (function(){ const o = {}; o[mid] = 'target'; return o; })()),
                    markers: mk(l, r, mid),
                    vars:{l:l, r:r, mid:mid, target:target, 'nums[mid]':nums[mid]},
                    res: mid})});
        return F;
      }
      F.push({hl:[6], no:6, tag:'不是它', cls:'t-red',
        msg:'<code>nums[' + mid + '] = ' + nums[mid] + ' ≠ ' + target + '</code>：mid 本人出局。整体无序没法直接"比中点定方向"，但断点只有一个、只能躲在 mid 的一侧——所以下一步<b>先认出有序的那一半</b>：只有有序才有连续的数值范围，才能用"target 落不落在这个范围里"来定方向（第 8 行）。',
        do: draw({phase:'区间 [' + l + ', ' + r + ']', states: stOf(l, r, mid), markers: mk(l, r, mid),
                  vars:{l:l, r:r, mid:mid, target:target, 'nums[mid]':nums[mid]}})});

      const leftSorted = nums[l] <= nums[mid];
      const sortedLabels = {};
      if(leftSorted){ for(let t = l; t <= mid; t++) sortedLabels[t] = '有序'; }
      else { for(let t = mid; t <= r; t++) sortedLabels[t] = '有序'; }
      F.push({hl:[8], ok: leftSorted ? 8 : undefined, no: leftSorted ? undefined : 8,
        tag:'找有序半', cls:'t-blue',
        msg: leftSorted
          ? '<code>nums[l] = ' + nums[l] + ' ≤ nums[mid] = ' + nums[mid] + '</code> 成立 → 左半 [l..mid] <b>无断点、纯递增</b>（标"有序"的格子）。为什么一次比较就够？断点若藏在左半，nums[l] 会站在高坡头、nums[mid] 落在低坡里，必有 nums[l] &gt; nums[mid]——与事实矛盾。target 若想藏在左半，必须卡在 <code>[' + nums[l] + ', ' + nums[mid] + ')</code> 这个数值范围里。'
          : '<code>nums[l] = ' + nums[l] + ' &gt; nums[mid] = ' + nums[mid] + '</code> → 左半里藏着断点（乱），<b>右半必有序</b>（标"有序"的格子）——断点只有一个，两半不可能同时乱。target 若想藏在右半，必须卡在 <code>(' + nums[mid] + ', ' + nums[r] + ']</code> 之间。',
        do: draw({phase:'区间 [' + l + ', ' + r + ']', states: stOf(l, r, mid),
                  labels: sortedLabels, markers: mk(l, r, mid),
                  vars:{l:l, r:r, mid:mid, target:target, 'nums[mid]':nums[mid]}})});

      if(leftSorted){
        const inLeft = nums[l] <= target && target < nums[mid];
        if(inLeft){
          r = mid - 1;
          F.push({hl:[9,10], ok:9, tag:'去左半', cls:'t-green',
            msg:'<code>' + nums[l] + ' ≤ ' + target + ' &lt; ' + nums[mid] + '</code> 成立 → target 落在有序左半的数值范围内。左半纯递增、范围又罩住 target，若它存在就必站在这半里（元素互异，target 只有一份）→ <code>r = mid − 1 = ' + r + '</code>，mid 及其右边整段出局——被扔的部分已确认不含 target，这就是"每次安全扔一半"的底气。',
            do: draw({phase:'区间 [' + l + ', ' + r + ']', states: stOf(l, r, null),
                      markers: mk(l, r, null), vars:{l:l, r:r, mid:'—', target:target}})});
        } else {
          const lOld = l;              // 先拍下旧左端: 数值地盘是"被扔掉的左半"的
          l = mid + 1;
          F.push({hl:[9,11,12], no:9, tag:'去右半', cls:'t-orange',
            msg:'<code>' + target + '</code> 不在 <code>[' + nums[lOld] + ', ' + nums[mid] + ')</code> 里 → 9 行不成立：有序左半的数值地盘就这么宽，罩不住 target，它只能去右半 → <code>l = mid + 1 = ' + l + '</code>，左半整段扔掉。范围判断的口诀：<b>等号给还留在这一半里的端点 nums[l]，mid 已经当面查过、永远开</b>——等号放错一边，target 正好踩在端点上时就会被扔错方向、漏掉答案。',
            do: draw({phase:'区间 [' + l + ', ' + r + ']', states: stOf(l, r, null),
                      markers: mk(l, r, null), vars:{l:l, r:r, mid:'—', target:target}})});
        }
      } else {
        const inRight = nums[mid] < target && target <= nums[r];
        if(inRight){
          l = mid + 1;
          F.push({hl:[14,15], ok:14, tag:'去右半', cls:'t-green',
            msg:'<code>' + nums[mid] + ' &lt; ' + target + ' ≤ ' + nums[r] + '</code> 成立 → target 落在有序右半的数值范围内，若存在必在这半 → <code>l = mid + 1 = ' + l + '</code>，mid 及左边整段出局。口诀依旧：等号给还在区间里的右端点 nums[r]，左端开——mid 已被当面排除。被扔的左半已确认不含 target，放心扔。',
            do: draw({phase:'区间 [' + l + ', ' + r + ']', states: stOf(l, r, null),
                      markers: mk(l, r, null), vars:{l:l, r:r, mid:'—', target:target}})});
        } else {
          const rOld = r;              // 先拍下旧右端: 数值地盘是"被扔掉的右半"的
          r = mid - 1;
          F.push({hl:[14,16,17], no:14, tag:'去左半', cls:'t-orange',
            msg:'<code>' + target + '</code> 不在 <code>(' + nums[mid] + ', ' + nums[rOld] + ']</code> 里 → 14 行不成立：有序右半罩不住 target，它只能去左半 → <code>r = mid − 1 = ' + r + '</code>，右半整段扔掉。每轮都是同一套：<b>认有序半 → 查数值范围 → 扔掉确认不含 target 的那一半</b>——候选每轮严格减半，这就是 O(log n) 的来源。',
            do: draw({phase:'区间 [' + l + ', ' + r + ']', states: stOf(l, r, null),
                      markers: mk(l, r, null), vars:{l:l, r:r, mid:'—', target:target}})});
        }
      }
    }

    F.push({hl:[4], no:4, tag:'区间空了', cls:'t-red',
      msg:'<code>l = ' + l + ' &gt; r = ' + r + '</code> → 循环结束：候选区间被扔空了。注意每一轮扔掉的半边都<b>先证明过不含 target</b>，所以区间扔空 = 数组里确实没有 ' + target + '，而不是把它弄丢了。',
      do: draw({phase:'找完', states: stOf(l, r, null), markers: mk(l, r, null),
                vars:{l:l, r:r, mid:'—', target:target}})});
    F.push({hl:[18], tag:'返回', cls:'t-dark',
      msg:'<code>return -1</code>：target 不在旋转数组里。带走一句话：<b>mid 劈两半必有一半有序 → 认出有序半 → 用数值范围定方向 → 扔掉另一半</b>——O(log n) 的底气就在"扔之前先证明它不含答案"。',
      do: draw({phase:'返回 -1', states: stOf(l, r, null), markers: mk(l, r, null),
                vars:{l:l, r:r, mid:'—', target:target}, res:-1})});
    return F;
  }
});
</script>
