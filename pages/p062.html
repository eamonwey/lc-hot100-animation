<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P062 · 搜索插入位置 · 动画题解</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="wrap" id="app"></div>
<script src="../assets/problems.js"></script>
<script src="../assets/viz.js"></script>
<script src="../assets/engine.js"></script>
<script>
LC.register({
  order: 62, num: 35, title: '搜索插入位置', diff: '简单', cat: '二分查找',
  method: 'searchInsert',

  lede: '题目：在<b>升序</b>数组里找 <span class="var r">target</span>：找到了返回下标；找不到就返回它<b>该插入的位置</b>（保证插进去后数组仍然有序）。' +
        '动画三名牌：<span class="var r">left</span>（蓝）、<span class="var o">mid</span>（橙）、<span class="var v">right</span>（紫）守着左闭右闭区间 [left, right]，' +
        '每轮看一眼中点、砍掉一半。默认用例里 target 能找到；结尾还会<b>重点加演一遍"找不到"的情形</b>——看 left 怎么恰好停在插入点上。',

  roles: [
    {c:'blue',   code:'left',  text:'区间左端（含）——比 target 小的都被它甩在身后'},
    {c:'orange', code:'mid',   text:'本轮检查的中点'},
    {c:'violet', code:'right', text:'区间右端（含）——比 target 大的都在它前面'},
    {c:'green',  code:'return left', text:'没找到时：left 停在哪，就插哪'}
  ],

  codeTitle: '跟着高亮读代码——第 6 行变<span style="color:var(--green)">绿</span>＝中点命中；' +
             '第 8 行绿＝中点太小去右半、第 10 行绿＝太大去左半；while 变<span style="color:var(--red)">红</span>＝区间空了，该 return left 了。',

  idea: '左闭右闭 + while left<=right + 缩区间必用 mid±1；循环结束时 left 左边全 < target、右边全 ≥ target——所以 left 就是插入点。',

  qa: [
    {q:'为什么找不到时 return left 一定对？',
     a:'这是二分的不变式：整个过程中，<b>left 左侧的数全部 &lt; target</b>（都是被"太小"淘汰出局的），<b>right 右侧全部 &gt; target</b>。区间缩空的那一刻，left 恰好越过最后一个比 target 小的数，站在第一个 ≥ target 的位置——把 target 插这儿，数组依然有序。'},
    {q:'为什么缩区间要 mid±1，不能留 mid？',
     a:'左闭右闭意味着 mid 还在 [left, right] 里面。mid 已经查过、肯定不是答案（否则早就 return 了），不把它踢出去，下一轮区间可能原封不动 → 死循环。±1 就是"连中点带那一半一起扔"。'},
    {q:'mid = (left + right) // 2 会不会出问题？',
     a:'Python 整数没有溢出，放心写。// 是向下取整，区间里有偶数个元素时取偏左那个中点，配合 mid±1 不会漏掉任何数。其他语言里建议写 left + (right - left) // 2 防两个大数相加溢出。'},
    {q:'复杂度？',
     a:'时间 O(log n)：每轮候选至少减半，1000 个数也只要约 10 次比较。空间 O(1)：只有三个下标变量。这题同时是"二分找左边界"思想的最小入门样本。'}
  ],

  complexity: '时间 O(log n)　·　空间 O(1)',

  form: [
    {key:'nums', label:'nums', type:'arr', def:[1,3,5,6]},
    {key:'target', label:'target', type:'num', def:5}
  ],
  presets: [
    {label:'[1,3,5,6] target=5（默认 → 2）', values:{nums:[1,3,5,6], target:5}},
    {label:'target=2（插中间 → 1）', values:{nums:[1,3,5,6], target:2}},
    {label:'target=7（插最后 → 4）', values:{nums:[1,3,5,6], target:7}},
    {label:'target=0（插最前 → 0）', values:{nums:[1,3,5,6], target:0}}
  ],

  code: `class Solution:
    def searchInsert(self, nums, target):
        left, right = 0, len(nums) - 1
        while left <= right:            # 区间 [left,right] 还有格子
            mid = (left + right) // 2
            if nums[mid] == target:     # 一步命中
                return mid
            if nums[mid] < target:      # 中点太小 → 去右半
                left = mid + 1
            else:                       # 中点太大 → 去左半
                right = mid - 1
        return left                     # 没找到: left 就是插入位置
`,

  sol(input){
    const nums = (input.nums || []).map(Number);
    const target = Number(input.target);
    let left = 0, right = nums.length - 1;
    while(left <= right){
      const mid = (left + right) >> 1;
      if(nums[mid] === target) return mid;
      if(nums[mid] < target) left = mid + 1;
      else right = mid - 1;
    }
    return left;
  },
  expected: 2,

  quiz: [
    {q:'缩区间时为什么必须 <code>left = mid + 1</code> / <code>right = mid − 1</code>,不能把 mid 留在区间里?',
     options:['怕数组越界','mid 这一轮已被查过、确认不是答案;左闭右闭区间里留着它,下一轮区间可能原封不动 → 死循环','±1 只是个人编程习惯,两种写法完全等价'],
     answer:1,
     explain:'左闭右闭意味着 mid 本尊也在候选之列。它已经被检验过、既然没 return 就必定不是答案,继续留在区间里毫无价值;更要命的是当区间缩到只剩 mid 一个格子时,留它等于不缩——while 永远转下去。±1 的真正含义是「连中点带那一半一起扔」,这也是左闭右闭写法必须配 left ≤ right 的原因:区间只剩 1 格时也得进循环看最后一眼。',
     jumpTo:7},
    {q:'代入算一算:nums = [5,7,10]、target = 8,返回多少?',
     options:['1','2','3','找不到,返回 -1'],
     answer:1,
     explain:'两轮走完:L=0,R=2 → mid=1,nums[1]=7 < 8,left=2;L=2,R=2 → mid=2,nums[2]=10 > 8,right=1。此时 left=2 > right=1,区间缩空 → <b>return left = 2</b>:8 应插在下标 2(夹在 7 和 10 之间)。注意不是 -1——本题找不到也要报插入点,而 left 正好停在第一个 ≥ 8 的数(10)前面,插进去数组照样有序。',
     jumpTo:24},
    {q:'没找到时,不变式保证循环结束的瞬间 left 停在哪个位置?',
     options:['最后一个 < target 的数上','第一个 ≥ target 的数前面——left 左边全 < target、right 右边全 > target,交叉而过的瞬间 left 恰好被顶到插入点','数组的末尾+1,永远'],
     answer:1,
     explain:'全程不变式:left 左侧的数都是被「太小」淘汰的、一律 < target;right 右侧都是被「太大」淘汰的、一律 > target。区间缩空意味着 left 与 right 交叉而过——left 右边紧挨着的就是第一个 ≥ target 的数。选「最后一个 < target」的人记住的是 right−1(或说 left−1)的语义,而插入点要的是「第一个能容纳 target 的位置」,两者恰差一格。',
     jumpTo:23},
  ],

  steps(input){
    const F = [];
    const nums = (input.nums || []).map(Number);
    const target = Number(input.target);
    const N = nums.length;

    const draw = (o) => (v) => {
      v.arr('N', nums, {label:'有序数组 <code>nums</code>　·　<code>target = ' + o.tgt + '</code>' + (o.pfx ? '（' + o.pfx + '）' : ''), states:o.st, markers:o.mk || []});
      v.vars('V', o.vars, {label:'变量'});
      if(o.res !== undefined) v.result(o.res, {label:'返回值'});
    };
    const stWin = (L, R, mid, found) => {
      const st = {};
      for(let x = 0; x < N; x++) st[x] = (x >= L && x <= R) ? 'in' : 'muted';
      if(mid != null) st[mid] = 'active';
      if(found != null) st[found] = 'target';
      return st;
    };
    const mk3 = (L, mid, R) => {
      const a = [{name:'left', idx:L, cls:'mr', text:'▲ left'}];
      if(mid != null) a.push({name:'mid', idx:mid, cls:'mi', text:'▲ mid'});
      a.push({name:'right', idx:R, cls:'mv', text:'▲ right'});
      return a;
    };
    const vv = (L, R, mid, t) => ({left:L, right:R, mid:mid, target:t});

    /* 一段完整二分：返回 {pos, found}。pfx 用于"找不到"的加演标注 */
    function trace(t, pfx, main){
      let L = 0, R = N - 1;
      while(L <= R){
        F.push({hl:[4], ok:4, tag:pfx + 'while 检查', cls:'t-blue',
          msg:pfx + '<code>left=' + L + ' ≤ right=' + R + '</code> → 区间 [' + L + ', ' + R + '] 还剩 <b>' + (R - L + 1) + '</b> 个候选格子，循环继续。本轮任务：挑个中点，用一次比较把候选砍掉一半。画面里亮着的格子就是还活着的候选人。',
          do: draw({tgt:t, pfx:pfx, st:stWin(L, R), mk:mk3(L, null, R), vars:vv(L, R, '—', t)})});
        const mid = (L + R) >> 1;
        F.push({hl:[5], tag:pfx + '取中点', cls:'t-ink',
          msg:pfx + '<code>mid = (' + L + ' + ' + R + ') ÷ 2 向下取整 = ' + mid + '</code>。向下取整意味着候选为偶数个时取偏左的中点——没关系，配合后面的 mid±1，谁也不会被漏查或重复查。橙牌已站上 ' + mid + ' 号位，接下来只看 <code>nums[' + mid + ']</code> 这一个数。',
          do: draw({tgt:t, pfx:pfx, st:stWin(L, R, mid), mk:mk3(L, mid, R), vars:vv(L, R, mid, t)})});
        if(nums[mid] === t){
          F.push({hl:[6], ok:6, tag:pfx + '命中！', cls:'t-green',
            msg:pfx + '<code>nums[' + mid + '] = ' + nums[mid] + '</code>，正好等于 target=' + t + ' → 命中！这就是二分的甜头：' + N + ' 个数一次比较就定位。立即 <code>return mid</code>，连区间都不用缩。',
            do: draw({tgt:t, pfx:pfx, st:stWin(L, R, mid), mk:mk3(L, mid, R), vars:vv(L, R, mid, t)})});
          if(main) F.push({hl:[7], tag:pfx + '返回', cls:'t-dark',
            msg:pfx + '<code>return mid = ' + mid + '</code> ✅ target=' + t + ' 本来就住在数组里，下标 ' + mid + ' 就是它现状的位置。顺带一提：找到时"应插入的位置"恰好也是它——插到与自己相等的数前面，数组照样有序。',
            do: draw({tgt:t, pfx:pfx, st:stWin(L, R, null, mid), mk:mk3(L, null, R), vars:vv(L, R, mid, t), res:mid})});
          return {pos:mid, found:true};
        }
        F.push({hl:[6], no:6, tag:pfx + '比对', cls:'t-ink',
          msg:pfx + '<code>nums[' + mid + '] = ' + nums[mid] + '</code> ≠ ' + t + ' → 中点不是答案。但<b>有序</b>给了底气：它' + (nums[mid] < t ? '比 target 小，那么它左边的数只会更小，连同它自己统统出局' : '比 target 大，那么它右边的数只会更大，连同它自己统统出局') + '——一次比较敢排除整整一半，这就是二分存在的意义。',
          do: draw({tgt:t, pfx:pfx, st:stWin(L, R, mid), mk:mk3(L, mid, R), vars:vv(L, R, mid, t)})});
        const oL = L, oR = R, small = nums[mid] < t;
        if(small){
          F.push({hl:[8,9], ok:8, tag:pfx + '中点太小', cls:'t-orange',
            msg:pfx + nums[mid] + ' &lt; ' + t + '：中点和它左边的全部候选都 &lt; target → 答案只可能在<b>右半边</b>。<code>left = mid + 1 = ' + (mid + 1) + '</code>：mid 刚被证明不是答案，自己也一并出局——留着只会拖慢搜索。不变式同步更新：新 left 左边（含旧 mid）全部 &lt; ' + t + '。',
            do: draw({tgt:t, pfx:pfx, st:stWin(mid + 1, R), mk:mk3(mid + 1, null, R), vars:vv(mid + 1, R, mid, t)})});
          L = mid + 1;
        } else {
          F.push({hl:[10,11], ok:10, tag:pfx + '中点太大', cls:'t-orange',
            msg:pfx + nums[mid] + ' &gt; ' + t + '：中点和它右边的全部候选都 &gt; target → 答案只可能在<b>左半边</b>。<code>right = mid − 1 = ' + (mid - 1) + '</code>：mid 自己一并出局。不变式同步更新：新 right 右边（含旧 mid）全部 &gt; ' + t + '。',
            do: draw({tgt:t, pfx:pfx, st:stWin(L, mid - 1), mk:mk3(L, null, mid - 1), vars:vv(L, mid - 1, mid, t)})});
          R = mid - 1;
        }
        F.push({hl:[small ? 9 : 11], tag:pfx + '砍掉一半', cls:'t-violet',
          msg:pfx + '候选区间 [' + oL + ', ' + oR + '] → [' + L + ', ' + R + ']：' + (oR - oL + 1) + ' 个变 ' + Math.max(0, R - L + 1) + ' 个，一刀砍掉 ' + ((oR - oL + 1) - Math.max(0, R - L + 1)) + ' 个。每轮减半，' + N + ' 个格子最多 ⌈log₂' + Math.max(N, 2) + '⌉ ≈ ' + Math.ceil(Math.log2(Math.max(N, 2))) + ' 轮见分晓——O(log n) 就是这么攒出来的。',
          do: draw({tgt:t, pfx:pfx, st:stWin(L, R), mk:mk3(L, null, R), vars:vv(L, R, '—', t)})});
      }
      F.push({hl:[4], no:4, tag:pfx + '区间空了', cls:'t-red',
        msg:pfx + '<code>left=' + L + ' &gt; right=' + R + '</code> → 区间缩空，<code>while</code> 条件不再成立，查找结束：数组里没有 ' + t + '。但别急着散场——看看两根指针最后停在哪：<b>left 停的位置就是插入点</b>，下一帧给出完整推导。',
        do: draw({tgt:t, pfx:pfx, st:stWin(L, R), mk:mk3(L, null, R), vars:vv(L, R, '—', t)})});
      F.push({hl:[12], tag:pfx + 'left 就是插入点', cls:'t-green',
        msg:pfx + '<code>return left = ' + L + '</code>。插入位置本质上只有三种：① 比所有数都小 → 插在下标 0；② 比所有数都大 → 插在末尾 ' + N + '；③ 夹在中间 → 插在<b>第一个 ≥ ' + t + '</b> 的数前面。而不变式保证：<b>left 左边全 &lt; ' + t + '、right 右边全 &gt; ' + t + '</b>，区间缩空（left、right 交叉而过）的瞬间，left 恰好被顶到这三种情形对应的同一个位置——插它，数组依然有序。' + (N > 0 ? (t < nums[0] ? '（本例 ' + t + ' 比所有数都小——情形①：left 压根没动过，停在 0。）' : t > nums[N - 1] ? '（本例 ' + t + ' 比所有数都大——情形②：left 一路右移到末尾 ' + N + '。）' : '（本例 ' + t + ' 夹在中间——情形③：left 停在第一个 ≥ ' + t + ' 的数前面。）') : '（本例数组为空：left = 0 是唯一合法插入点。）'),
        do: draw({tgt:t, pfx:pfx, st:(function(){ const st = stWin(L, R); if(L >= 0 && L < N) st[L] = 'peek'; return st; })(), mk:mk3(L, null, R), vars:vv(L, R, '—', t), res: main ? L : undefined})});
      return {pos:L, found:false};
    }

    F.push({hl:[1,2,3], tag:'初始化', cls:'t-grey',
      msg:'任务：在升序数组里找 <code>' + target + '</code>——找到返回下标，找不到返回<b>该插入的位置</b>。初始候选区间左闭右闭 <code>[left, right]</code> = [0, ' + (N - 1) + ']，共 ' + N + ' 个格子（两端都算数）。三名牌就位：蓝 ▲left、橙 ▲mid、紫 ▲right。不变式先记牢：<b>left 左边的数永远 &lt; target，right 右边的数永远 &gt; target</b>——初始时两侧为空，天然成立，之后每轮缩区间都在维护它。' + (N === 0 ? '（数组为空：区间 [0, -1] 天生为空）' : ''),
      do: draw({tgt:target, st:stWin(0, N - 1), mk:mk3(0, null, N - 1), vars:vv(0, N - 1, '—', target)})});
    F.push({hl:[4], tag:'游戏规则', cls:'t-grey',
      msg:'<b>左闭右闭</b> = 两端格子都算候选，所以条件写成 <code>left &lt;= right</code>：区间只剩最后 1 格时也得看它一眼，否则可能漏掉答案。代价是缩区间必须 <code>mid ± 1</code>——mid 本尊这一轮已被查过、确认不是答案，若还留在区间里，下一轮区间可能原封不动 → 死循环。±1 的含义就是"连中点带那一半一起扔"。',
      do: draw({tgt:target, st:stWin(0, N - 1), mk:mk3(0, null, N - 1), vars:vv(0, N - 1, '—', target)})});

    const main = trace(target, '', true);

    if(main.found){
      trace(2, '演示·', false);
    }

    F.push({hl:[7,12], ok: main.found ? 7 : undefined,
      tag:'总结', cls:'t-dark',
      msg:(main.found
        ? '两个出口合起来记：<b>找到 → return mid</b>（本例返回 ' + main.pos + '），<b>没找到 → return left</b>（上面"演示·"加演用 target=2 完整走了一遍，看它结尾 left 停在哪）。两个出口返回的其实都是 target <b>应在的位置</b>：在，就是它现状的下标；不在，就是该插入的点。'
        : '本例没找到 → <code>return left = ' + main.pos + '</code>：把 ' + target + ' 插到下标 ' + main.pos + '，数组依然有序。返回值永远是 target 应在的位置——找到时报现状下标，找不到时报插入点，两件事一个公式。') +
        ' 时间 O(log n)：' + Math.max(N, 1) + ' 个格子最多比较 ⌈log₂' + Math.max(N, 2) + '⌉ ≈ ' + Math.ceil(Math.log2(Math.max(N, 2))) + ' 次。',
      do: (function(){
        const L = main.pos, R = main.found ? main.pos : main.pos - 1;
        return (v) => {
          v.arr('N', nums, {label:'有序数组 <code>nums</code>　·　<code>target = ' + target + '</code>', states:stWin(L, R, null, main.found ? main.pos : null), markers:mk3(main.found ? main.pos : L, null, main.found ? main.pos : main.pos - 1)});
          v.vars('V', vv(main.found ? main.pos : L, main.found ? main.pos : main.pos - 1, main.found ? main.pos : '—', target), {label:'变量'});
          v.result(main.pos, {label:'返回值'});
        };
      })()});

    return F;
  }
});
</script>
