<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P003 · 最长连续序列 · 动画题解</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="wrap" id="app"></div>
<script src="../assets/problems.js"></script>
<script src="../assets/progress.js"></script>
<script src="../assets/viz.js"></script>
<script src="../assets/engine.js"></script>
<script>
LC.register({
  order: 3, num: 128, title: '最长连续序列', diff: '中等', cat: '哈希',
  method: 'longestConsecutive',

  lede: '题目：数字可以乱序，找出最长的“连续整数链”有多长（1-2-3-4 就是长 4，不要求在数组里挨着）。' +
        '要求 O(n)，就<b>不能排序</b>。动画里 <span class="var r">ns</span> 是哈希集合（查一个数只要 O(1)），' +
        '<span class="var i">i</span> 逐个试着当起点：只要 <code>i−1</code> 也在集合里，i 就不是头，<b>立刻让位</b>；' +
        '真正的头才一路向右数到底。',

  roles: [
    {c:'orange', code:'i',      text:'正在试着当起点的数值（不是数组下标）'},
    {c:'green',  code:'cur',    text:'当前连续链已经数到的数'},
    {c:'violet', code:'lenth',  text:'当前连续链的长度'},
    {c:'blue',   code:'longest',   text:'目前最长的连续长度'}
  ],

  codeTitle: '跟着高亮读代码——<code>if i-1 not in ns</code> 变<span style="color:var(--green)">绿</span>＝前面没人，i 就是头；变<span style="color:var(--red)">红</span>＝前面还有人，跳过本轮的 if 代码块。',

  legend: [
    {c:'orange', text:'i 当前数'},
    {c:'violet', text:'正在数的链条'},
    {c:'green', text:'cur 当前数到的位置'},
    {c:'blue', text:'longest 目前纪录'}
  ],

  idea: '连续段必有“没人差它一”的头：只让头向右数到底，其余数原地待命——每个数最多被摸两次，O(n) 拿下。',

  qa: [
    {q:'为什么只从“没有 i−1”的数开始数？',
     a:'如果 i−1 还在集合里，那从 i 开始数出的链一定比从 i−1 开始的<b>短一截</b>，白数。只有 i−1 不在，i 才可能是某段的最小头。这样每段只被它的头完整数一遍，其余数只被查一两次——总操作数还是 O(n)。'},
    {q:'不判断起点、每个数都往右数一遍，会怎样？',
     a:'也能出对答案，但最坏会退化：比如 1~n 全在集合里，从每个数出发都要数到 n，共 O(n²) 次查询。“只让头数”这一步判断正是把复杂度摁回 O(n) 的关键。'},
    {q:'为什么用哈希集合而不用数组？',
     a:'核心动作是“i 在不在”这件事被问了几万次。数组查一次要 O(n)，集合（哈希表）O(1)。把最频繁的操作做到 O(1)，整个算法才是 O(n)——典型的空间换时间。'},
    {q:'数组里有重复的数怎么办？',
     a:'进集合时自动去重：连续长度只跟“有哪些值”有关，跟出现几次无关。动画里 ns 展示的就是去重后的值。集合的遍历顺序不保证与数组顺序一致，动画按首次出现顺序演示；每段都只数一次，答案不受顺序影响。'}
  ],

  complexity: '时间 O(n)（每个数最多被查常数次）　·　空间 O(n)（哈希集合）',

  form: [
    {key:'nums', label:'nums', type:'arr', def:[100,4,200,1,3,2]}
  ],
  presets: [
    {label:'[100,4,200,1,3,2]', values:{nums:[100,4,200,1,3,2]}},
    {label:'[1,2,0,1]（重复 + 跨 0）', values:{nums:[1,2,0,1]}},
    {label:'[0]（单元素）', values:{nums:[0]}},
    {label:'[]（空数组）', values:{nums:[]}}
  ],

  code: `class Solution:
    def longestConsecutive(self, nums: list[int]) -> int:
        ns=set(nums)
        longest=0
        for i in ns:
            if i-1 not in ns:
                cur=i
                lenth=1
                while cur+1 in ns:
                    cur+=1
                    lenth+=1
                longest=max(lenth,longest)
        return longest
`,

  sol(input){
    const ns = new Set(input.nums || []);
    let longest = 0;
    for(const i of ns){
      if(!ns.has(i - 1)){
        let cur = i;
        let lenth = 1;
        while(ns.has(cur + 1)){
          cur += 1;
          lenth += 1;
        }
        longest = Math.max(lenth, longest);
      }
    }
    return longest;
  },
  expected: 4,

  quiz: [
    {q:'为什么 i−1 还在集合里时,i 连「当起点数一趟」的资格都没有?',
     options:['因为 i 一定不在任何连续段里','从 i 起头数出的链一定比从 i−1 起头的短一截——i 能连到的 i−1 全都能连到,数了是白数,还拖慢速度','因为 i−1 会把 i 从集合里挤掉'],
     answer:1,
     explain:'连续段只有一个最小的头。i−1 在集合里说明 i 只是某段的中间一节,让头去数才能数出完整长度,让 i 数只能得到后半截。更要命的是效率:若每个数都往右数一遍,1~n 连成一片时要从每个数数到 n,总查询 O(n²) 直接超时——「非头让位」正是把复杂度摁回 O(n) 的关键。',
     jumpTo:3},
    {q:'nums = [10,5,12,3,55,30,4,31,2],最长连续序列有多长?',
     options:['2','3','4','5'],
     answer:2,
     explain:'先去重丢进集合,再逐段找头:2−3−4−5 连成一条(长 4);30−31 连成一条(长 2);10、12、55 各自孤零零(长 1)。答案是 4。注意题目只要求数值连续,不要求在数组里挨着——[2,3,4,5] 在数组里是散着放的,照样算一条链。',
     jumpTo:30},
    {q:'把「if i-1 not in ns」这层判断去掉,每个数都从自己往右数一遍,结果和复杂度会怎样?',
     options:['答案仍对,但像 1~n 连成一片的用例会退化成 O(n²),可能超时','答案立刻算错','答案对,复杂度也不变,还是 O(n)'],
     answer:0,
     explain:'每个数无脑往右数,各段全长都会被数出来,max 之后答案仍对。但「每段只让头数一遍」变成「每个数都数一遍」:1~n 全在集合里时,从 1 数到 n、从 2 数到 n……总查询约 n²/2 次。正是这个看似多余的判断,保证非头只查一次前驱就退场,总工作量 O(n)。',
     jumpTo:17},
  ],

  steps(input){
    const F = [];
    const nums = input.nums || [];
    const ns = new Set(nums);
    const setArr = Array.from(ns);
    let longest = 0;
    let cur, lenth;
    const doneVals = [];
    const snapDone = () => doneVals.slice();
    const streakSnap = (start, len) => Array.from({length:len}, (_, k) => start + k);
    const marks = (i, cur) => {
      const a = [{name:'i', idx:nums.indexOf(i), cls:'mi', text:'▲ i（起点候选值）'}];
      if(cur != null) a.push({name:'cur', idx:nums.indexOf(cur), cls:'mg', text:'▲ cur'});
      return a;
    };
    const draw = (o) => (v) => {
      const states = {};
      nums.forEach((val, idx) => {
        if(o.peek != null && val === o.peek) states[idx] = 'peek';
        else if(o.cur != null && val === o.cur) states[idx] = 'just';
        else if(o.active != null && val === o.active) states[idx] = 'active';
        else if(o.streak && o.streak.includes(val)) states[idx] = 'target';
        else if(o.done && o.done.includes(val)) states[idx] = 'done';
      });
      v.arr('nums', nums, {label:'数组 <code>nums</code>', states, markers:o.marks || []});
      v.set('ns', setArr, {label:'哈希集合 <code>ns</code>（去重后） · 查询 O(1)', color:'b'});
      v.text('line', o.line || '…', {html:true});
      if(o.vars) v.vars('vars', o.vars, {label:'变量', hl:o.hlV});
      if(o.result != null) v.result(o.result, {label:'最长连续长度'});
    };

    F.push({hl:[1,2,3,4], tag:'初始化', cls:'t-grey',
      msg:'<code>ns = set(nums)</code> 把输入去重，后面查一个数在不在，平均只要 O(1)。<code>longest = 0</code> 先把最长纪录设为 0，空数组时就直接返回 0。注意下面的 i 是集合里的<b>数值</b>，不是数组下标；集合顺序不影响答案，动画按首次出现顺序演示。',
      do:draw({line:'还没开始数', vars:{i:'—', cur:'—', lenth:'—', longest:0}})});

    for(const i of ns){
      F.push({hl:[5], tag:'遍历', cls:'t-ink',
        msg:'<code>for i in ns</code>：这轮取出的数值是 <b>' + i + '</b>，▲ i 标在它第一次出现的格子。先判断它是不是一段连续整数的最小值；目前最长纪录 longest = ' + longest + '。',
        do:draw({active:i, done:snapDone(), marks:marks(i), line:'i = ' + i + '：先检查前驱',
                 vars:{i:i, cur:cur ?? '—', lenth:lenth ?? '—', longest:longest}, hlV:['i']})});

      const isStart = !ns.has(i - 1);
      F.push({hl:[6], ok:isStart ? 6 : undefined, no:isStart ? undefined : 6,
        tag:isStart ? '找到起点' : '不是起点', cls:isStart ? 't-green' : 't-red',
        msg:isStart
          ? '<code>i-1 = ' + (i - 1) + '</code> 不在 ns 里，所以 <code>if i-1 not in ns</code> 成立：' + i + ' 就是这段连续序列的头。接下来进入 if 代码块，从它开始向右数，每一段只会由自己的头完整数一次。'
          : '<code>i-1 = ' + (i - 1) + '</code> 在 ns 里，条件不成立：' + i + ' 只是某段的中间成员。本轮不进入 if 代码块，直接取下一个 i；代码不用写 continue，也能让数数的工作只交给真正的段头，避免重复扫描。',
        do:draw({active:i, peek:isStart ? null : i - 1, done:snapDone(), marks:marks(i),
                 line:'i-1 = ' + (i - 1) + (isStart ? '：不在 ns ✓ 进入 if' : '：在 ns ✗ 跳过 if'),
                 vars:{i:i, 'i-1':i - 1, cur:cur ?? '—', lenth:lenth ?? '—', longest:longest}})});
      if(!isStart){ doneVals.push(i); continue; }

      cur = i;
      F.push({hl:[7], tag:'设置当前位置', cls:'t-blue',
        msg:'执行 <code>cur = i = ' + cur + '</code>：cur 从段头出发，绿色 ▲ cur 和橙色 ▲ i 此刻在同一个数上。以后 i 固定在段头，cur 才会随连续链向右移动；“向右”指数值加 1，不是数组下标加 1。',
        do:draw({active:i, cur:cur, done:snapDone(), marks:marks(i, cur), line:'从段头 ' + i + ' 开始',
                 vars:{i:i, cur:cur, lenth:lenth ?? '—', longest:longest}, hlV:['cur']})});

      lenth = 1;
      F.push({hl:[8], tag:'长度设为一', cls:'t-blue',
        msg:'执行 <code>lenth = 1</code>：段头 ' + i + ' 自己就算一个数，所以长度从 1 开始。这里保留你代码里的变量名 lenth，它表示当前连续链的长度；接下来检查 cur+1 能不能接上。',
        do:draw({active:i, cur:cur, streak:streakSnap(i, lenth), done:snapDone(), marks:marks(i, cur),
                 line:'链条：' + i + '（长 1）', vars:{i:i, cur:cur, lenth:lenth, longest:longest}, hlV:['lenth']})});

      while(ns.has(cur + 1)){
        const nxt = cur + 1;
        F.push({hl:[9], ok:9, tag:'问右邻', cls:'t-blue',
          msg:'检查 <code>cur+1 = ' + cur + '+1 = ' + nxt + '</code>：它在 ns 里，while 条件成立，链条还能接一节。此时只完成了查询，cur 仍是 ' + cur + '，lenth 仍是 ' + lenth + '；后面两行会分别更新位置和长度。',
          do:draw({active:i, cur:cur, peek:nxt, streak:streakSnap(i, lenth), done:snapDone(), marks:marks(i, cur),
                   line:'下一个连续数 ' + nxt + ' 在 ns 里', vars:{i:i, cur:cur, 'cur+1':nxt, lenth:lenth, longest:longest}})});
        cur += 1;
        F.push({hl:[10], tag:'当前位置加一', cls:'t-green',
          msg:'执行 <code>cur += 1</code>，cur 从 ' + (cur - 1) + ' 变成 <b>' + cur + '</b>，绿色名牌移到新接上的数。这一行只移动 cur，lenth 还没变，仍为 ' + lenth + '；下一行再把这个新数计入长度。',
          do:draw({active:i, cur:cur, streak:streakSnap(i, lenth + 1), done:snapDone(), marks:marks(i, cur),
                   line:'cur 已移到 ' + cur + '，等待更新长度', vars:{i:i, cur:cur, lenth:lenth, longest:longest}, hlV:['cur']})});
        lenth += 1;
        F.push({hl:[11], tag:'长度加一', cls:'t-green',
          msg:'执行 <code>lenth += 1</code>，长度从 ' + (lenth - 1) + ' 变成 <b>' + lenth + '</b>。现在从段头 i = ' + i + ' 到 cur = ' + cur + '，连续链是 ' + streakSnap(i, lenth).join(' → ') + '；回到 while 那行，再问新的 cur+1 在不在。',
          do:draw({active:i, cur:cur, streak:streakSnap(i, lenth), done:snapDone(), marks:marks(i, cur),
                   line:'链条：' + streakSnap(i, lenth).join(' → ') + '（长 ' + lenth + '）',
                   vars:{i:i, cur:cur, lenth:lenth, longest:longest}, hlV:['lenth']})});
      }

      F.push({hl:[9], no:9, tag:'这段数完', cls:'t-red',
        msg:'检查 <code>cur+1 = ' + (cur + 1) + '</code>：它不在 ns 里，while 条件不成立，这段就到头了。cur 停在 ' + cur + '，这一段 ' + streakSnap(i, lenth).join(' → ') + ' 的长度是 <b>' + lenth + '</b>；接下来拿它和最长纪录比较。',
        do:draw({active:i, cur:cur, streak:streakSnap(i, lenth), done:snapDone(), marks:marks(i, cur),
                 line:'链条到头：' + streakSnap(i, lenth).join(' → ') + '（长 ' + lenth + '）',
                 vars:{i:i, cur:cur, 'cur+1':cur + 1, lenth:lenth, longest:longest}})});

      const oldLongest = longest;
      longest = Math.max(lenth, longest);
      F.push({hl:[12], tag:longest > oldLongest ? '刷新纪录' : '纪录保持', cls:'t-orange',
        msg:'执行 <code>longest = max(lenth, longest) = max(' + lenth + ', ' + oldLongest + ') = ' + longest + '</code>。当前段长 ' + lenth + '，' + (longest > oldLongest ? '超过旧纪录，最长纪录更新为 ' + longest : '没有超过旧纪录，最长纪录保持为 ' + longest) + '。用 max 保留见过的最大长度，后面遇到短段也不会把长纪录覆盖掉。',
        do:draw({active:i, cur:cur, streak:streakSnap(i, lenth), done:snapDone(), marks:marks(i, cur),
                 line:'longest = ' + longest, vars:{i:i, cur:cur, lenth:lenth, longest:longest}, hlV:['longest']})});
      doneVals.push(i);
    }

    F.push({hl:[13], tag:'返回', cls:'t-dark',
      msg:ns.size
        ? '集合里的每个数都检查完，返回 <code>longest = ' + longest + '</code>。每个数只检查一次前驱，每段只从最小的头完整向右数一遍，所以即使有 for 和 while，总工作量仍是 O(n)。'
        : 'ns 是空集合，for 一轮都不执行，longest 保持初始化的 0。返回 <code>0</code>：空数组的最长连续序列长度就是 0。',
      do:draw({done:snapDone(), line:'最长连续长度 = ' + longest, result:longest,
               vars:{longest:longest}, hlV:['longest']})});
    return F;
  }
});
</script>
