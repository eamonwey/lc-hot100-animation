<script>
LC.register({
  order: 22, num: 160, title: '相交链表', diff: '简单', cat: '链表',
  method: 'getIntersectionNode',

  lede: '题目：两条链表<b>从某个节点开始共用同一段尾巴</b>（内存里是同一批节点），找到那个相交节点；不相交就返回 None。' +
        '动画里两条链各画一行，<span class="var v">紫框节点</span>就是共用的公共尾巴。' +
        '<span class="var i">pA</span>、<span class="var r">pB</span> 各从自己的头出发，<b>走到头就换到另一条链的开头</b>——两人路程一样长，必定在交点碰面。',

  roles: [
    {c:'orange', code:'pA', text:'从 A 链出发的指针，走到头换去 B 链'},
    {c:'blue',   code:'pB', text:'从 B 链出发的指针，走到头换去 A 链'},
    {c:'violet', code:'公共尾巴', text:'紫框节点 = 两条链共用的同一批节点'}
  ],

  codeTitle: '跟着高亮读代码——while 那行变<span style="color:var(--green)">绿</span>＝还没相遇继续走，变<span style="color:var(--red)">红</span>＝相遇（或一起到 None）退出。',

  legend: [
    {c:'orange', text:'pA'},
    {c:'blue',   text:'pB'},
    {c:'violet', text:'公共尾巴（两边同一批节点）'}
  ],

  idea: '让两个指针走同样的总路程：pA 走完 A 就去走 B，pB 走完 B 就去走 A——路程相同，要么在交点相遇，要么一起到 None。',

  qa: [
    {q:'为什么换了链就一定相遇？',
     a:'设 A 独有 a 个、B 独有 b 个、公共 c 个节点。pA 走 a+c 后换到 B 再走 b 步；pB 走 b+c 后换到 A 再走 a 步——<b>两人总步数都是 a+b+c</b>。若有交点，最后一段路完全重合，必同时踩上交点；若不相交，两人同时到达 None。'},
    {q:'比较两个"节点"为什么用 is not 而不是 !=？',
     a:'节点是对象，<code>is</code> 比的是"是不是内存里同一个节点"。两条链可能出现值相同的节点但并不是同一个节点，所以相交判定必须比身份，不能比值。'},
    {q:'暴力法为什么不好？',
     a:'先数出两条链的长度差，让长的先走差值步再同步走，也能 O(m+n)——但"换链"写法不用数长度、代码更短；哈希表存 A 链所有节点再扫 B 也行，只是要 O(n) 空间。'}
  ],

  complexity: '时间 O(m+n)　·　空间 O(1)（只有两个指针）',

  form: [
    {key:'a', label:'A 链', type:'arr', def:[4,1,8,4,5]},
    {key:'b', label:'B 链', type:'arr', def:[5,6,1,8,4,5]},
    {key:'skipA', label:'skipA', type:'num', def:2},
    {key:'skipB', label:'skipB', type:'num', def:3}
  ],
  presets: [
    {label:'官方例：4→1→8→4→5 与 5→6→1→8→4→5', values:{a:[4,1,8,4,5], b:[5,6,1,8,4,5], skipA:2, skipB:3}},
    {label:'不相交：1→2→3 与 4→5→6', values:{a:[1,2,3], b:[4,5,6], skipA:3, skipB:3}},
    {label:'B 整条是公共尾巴', values:{a:[1,2,3,4], b:[3,4], skipA:2, skipB:0}}
  ],

  code: `class Solution:
    def getIntersectionNode(self, headA, headB):
        pA, pB = headA, headB
        while pA is not pB:
            pA = pA.next if pA else headB  # 走到头就换到另一条链
            pB = pB.next if pB else headA
        return pA                          # 相遇点就是交点(可能为 None)
`,

  sol(input){
    const a = (input.a || []).map(Number), b = (input.b || []).map(Number);
    const sA = Math.max(0, input.skipA | 0), sB = Math.max(0, input.skipB | 0);
    const build = (vals, nxt) => {        // 把 vals 接到 nxt 前面, 返回头
      const nds = vals.map(v => ({v, next: null}));
      nds.forEach((nd, i) => { nd.next = nds[i + 1] || nxt; });
      return nds.length ? nds[0] : nxt;
    };
    const common = build(a.slice(sA), null);
    const headA = build(a.slice(0, sA), common);
    const headB = build(b.slice(0, sB), common);
    let pA = headA, pB = headB;
    while(pA !== pB){
      pA = pA ? pA.next : headB;
      pB = pB ? pB.next : headA;
    }
    return pA ? pA.v : null;
  },
  expected: 8,
  pyCheck: false,   // 展示代码为官方签名(吃链表), 页面输入是数组——正确性由 JS sol 对拍验证

  quiz: [
    {q:'为什么「走到头就换到另一条链」的两个指针一定相遇？',
     options:['因为交点之后的路是共享的，走得快的人先到会等慢的','pA 走 a+c 再补 b、pB 走 b+c 再补 a——两人总路程都是 a+b+c，抹平长度差后交点成了必经之地；不相交就同时到 None','因为 while 里加了步数上限，时间一到强制停'],
     answer:1,
     explain:'设 A 独有 a 个、B 独有 b 个、公共 c 个节点。pA 先走完 A（含落到 None 那一步）换到 B；pB 先走完 B 换到 A。两人每轮各走一步、总路程锁定同一数值，最后一段路又完全重合——要么在交点同时踩上同一个节点，要么（c=0）同时变成 None，while 的身份比较不成立退出。不存在一个先停、一个还在走的情况。',
     jumpTo:2},
    {q:'A 链 2→3、B 链 1→7→9（完全没有公共节点），两个指针最终怎样？返回什么？',
     options:['pA 先走完自己那条就停住，返回 null','死循环——谁也遇不到谁，程序停不下来','两人各移动 6 次后同时变成 None，返回 null'],
     answer:2,
     explain:'不相交时：pA 走完 A 的 2 个节点落到 None（2 步），跳到 B 走 1→7→9 再落到 None（4 步），共 6 步；pB 走完 B 的 3 个节点落到 None，跳到 A 走 2→3 再落到 None，也是 6 步——两人在同一轮同时变成 None，pA is not pB 不再成立（None is None），循环退出返回 null。不会死循环：最迟 2(m+n) 步内必同时落地；也不会一个先停——两人每轮都各走一步。',
     jumpTo:30},
    {q:'比较两个指针时为什么用 is（节点身份）而不是比节点的值？',
     options:['is 比 == 快，纯性能优化','两条链可能出现值相同的「陌生」节点——值相等不代表是内存里同一个节点，比值会把假的当成交点；相交判定必须比身份','因为链表节点没有实现 == 运算，只能用 is'],
     answer:1,
     explain:'「相交」的定义是共享同一批节点：交点之后两条链在内存里是同一段。若只比值，A 链里一个恰好同值的独立节点会让指针在错误位置「相遇」。同理，最后两人同时落到 None 也是靠身份比较判停——None is None 成立。这是链表题里「结构相等」和「值相等」的经典区分。',
     jumpTo:3},
  ],

  steps(input){
    const F = [];
    const A = (input.a || []).map(Number), B = (input.b || []).map(Number);
    const sA = Math.max(0, input.skipA | 0), sB = Math.max(0, input.skipB | 0);
    const shared = A.slice(sA);           // 公共尾巴的值(以 A 链为准)
    const aU = A.slice(0, Math.min(sA, A.length));
    const bU = B.slice(0, Math.min(sB, B.length));
    const nodesA = aU.map((v, i) => ({key: 'a' + i, val: v}))
        .concat(shared.map((v, i) => ({key: 's' + i, val: v})));
    const nodesB = bU.map((v, i) => ({key: 'b' + i, val: v}))
        .concat(shared.map((v, i) => ({key: 's' + i, val: v})));
    const orderA = nodesA.map(n => n.key), orderB = nodesB.map(n => n.key);
    const valOf = {};
    nodesA.forEach(n => { valOf[n.key] = n.val; });
    nodesB.forEach(n => { valOf[n.key] = n.val; });
    const name = k => k == null ? 'None' : '节点' + valOf[k];
    const nextOf = k => {                 // 沿链走一步; 尾巴之后是 None
      if(k == null) return null;
      let i = orderA.indexOf(k);
      if(i >= 0) return i + 1 < orderA.length ? orderA[i + 1] : null;
      i = orderB.indexOf(k);
      return i >= 0 && i + 1 < orderB.length ? orderB[i + 1] : null;
    };
    const headA = orderA.length ? orderA[0] : null;
    const headB = orderB.length ? orderB[0] : null;
    const chainStr = ks => ks.length ? ks.map(k => valOf[k]).join('→') : '(空)';

    let pA = headA, pB = headB;

    /* ★ 快照原则：指针/状态在 F.push 那一刻求值定死，绝不留到渲染时再读 */
    const ptrs = () => {
      const pa = [], pb = [];
      const put = (k, text, cls) => {
        if(k == null) return;
        if(orderA.indexOf(k) >= 0) pa.push({key: k, text, cls});
        if(orderB.indexOf(k) >= 0) pb.push({key: k, text, cls});
      };
      if(pA != null && pA === pB) put(pA, '▼ pA = pB', 'mv');
      else { put(pA, '▼ pA', 'mi'); put(pB, '▼ pB', 'mr'); }
      return {pa, pb};
    };
    const stOf = () => {
      const st = {};
      shared.forEach((_, i) => { st['s' + i] = 'pivot'; });
      if(pA != null) st[pA] = 'active';
      if(pB != null) st[pB] = (pA != null && pA === pB) ? 'target' : 'active';
      return st;
    };
    const varsNow = () => ({pA: name(pA), pB: name(pB)});
    const hA = headA ? {key: headA, text: 'headA', cls: 'mq'} : null;
    const hB = headB ? {key: headB, text: 'headB', cls: 'mq'} : null;
    const draw = (o) => (v) => {
      v.list('LA', nodesA, {label: '链表 A　·　紫框 = 公共尾巴（两边同一批节点）',
        states: o.st, pointers: o.pa, headTag: o.hA});
      v.list('LB', nodesB, {label: '链表 B',
        states: o.st, pointers: o.pb, headTag: o.hB});
      if(o.vars) v.vars('vars', o.vars, {label: '两个指针'});
      if(o.res !== undefined) v.result(o.res, {label: '返回值'});
    };

    F.push({hl: [1,2], tag: '读题·两条链就位', cls: 't-grey',
      msg: '力扣的这道题直接给你两个<b>已建好的链表</b> headA、headB（页面用 skipA/skipB 描述它们在哪里相交，与官方题面的用例格式一致）——画面上下两行各画一条链，A 链前 <b>' + sA + '</b> 个、B 链前 <b>' + sB + '</b> 个是各自独有的前缀，' +
           (shared.length
             ? '后面的 <b>' + LCesc(shared.join('→')) + '</b> 两条链<b>共用同一批节点</b>——内存里就是同一段，紫框把它们标出来；不是"碰巧值相同"，是同一个节点画了两遍。'
             : '公共尾巴为 <b>(空)</b>——两条链各自独立、互不相交，待会看两个指针怎么一起落空。'),
      do: draw({st: stOf(), pa: ptrs().pa, pb: ptrs().pb, hA, hB, vars: {pA: '—', pB: '—'}})});

    F.push({hl: [], tag: '用例速览', cls: 't-ink',
      msg: 'headA = ' + LCesc(chainStr(orderA)) + '，headB = ' + LCesc(chainStr(orderB)) + '。' +
           (shared.length
             ? '看画面：两行末尾的紫框节点一一对应——那不是两串恰好相等的值，而是<b>同一批节点</b>画了两遍，这就是"相交"在内存里的样子。'
             : '两边没有任何公共节点。盯住两个指针，看它们最后怎么一起走到 None。'),
      do: draw({st: stOf(), pa: ptrs().pa, pb: ptrs().pb, hA, hB, vars: varsNow()})});

    F.push({hl: [3], tag: '出发', cls: 't-blue',
      msg: 'pA 站上 A 的头（' + name(headA) + '），pB 站上 B 的头（' + name(headB) + '）。规则：<b>各自走一步；谁走到 None，就瞬移到另一条链的开头</b>。' +
           '为什么这样必定相遇？pA 的总路程 = A 独有 + 公共 + B 独有，pB = B 独有 + 公共 + A 独有——<b>两人一样长</b>，最后一段路完全重合，必然同时踩上交点；不相交就一起到 None。' +
           '类比：两人从各自的楼出发、中途互换楼梯，只要总步数相同，要么在共同的台阶上碰头，要么一起踩空。',
      do: draw({st: stOf(), pa: ptrs().pa, pb: ptrs().pb, hA, hB, vars: varsNow()})});

    while(pA !== pB){
      F.push({hl: [4], ok: 4, tag: 'while 检查', cls: 't-blue',
        msg: 'pA 在 <b>' + name(pA) + '</b>，pB 在 <b>' + name(pB) + '</b>，不是内存里同一个节点 → <code>pA is not pB</code> 成立，继续走。' +
             '注意比较的是<b>节点身份</b>（is），不是值——两条链可能有值相同的"陌生"节点，比值会上当；只有踩上同一格（或一起走到 None）循环才停。',
        do: draw({st: stOf(), pa: ptrs().pa, pb: ptrs().pb, hA, hB, vars: varsNow()})});

      const oldA = pA;
      pA = (pA == null) ? headB : nextOf(pA);
      F.push({hl: [5], tag: 'pA 移动', cls: 't-ink',
        msg: oldA == null
          ? 'pA 在 None（A 侧走完了）→ 按规则<b>跳到 B 链开头</b>，落到 ' + name(pA) + '。这就是"换跑道"：接下来它走的是 B 的路。'
          : (pA == null
              ? 'pA 从 ' + name(oldA) + ' 走到 <b>None</b>——A 侧（含公共尾巴）到头了，下一步它将跳去 B 链开头，路程继续累计。'
              : 'pA 从 ' + name(oldA) + ' 走到 <b>' + name(pA) + '</b>，沿 A 链老老实实前进。'),
        do: draw({st: stOf(), pa: ptrs().pa, pb: ptrs().pb, hA, hB, vars: varsNow()})});

      const oldB = pB;
      pB = (pB == null) ? headA : nextOf(pB);
      F.push({hl: [6], tag: 'pB 移动', cls: 't-ink',
        msg: oldB == null
          ? 'pB 在 None（B 侧走完了）→ 按规则<b>跳到 A 链开头</b>，落到 ' + name(pB) + '。pB 换的这条道正好是 pA 刚走完的——两人路程就在这一换一走中对齐。'
          : (pB == null
              ? 'pB 从 ' + name(oldB) + ' 走到 <b>None</b>——B 侧（含公共尾巴）到头了，下一步它将跳去 A 链开头。'
              : 'pB 从 ' + name(oldB) + ' 走到 <b>' + name(pB) + '</b>，沿 B 链老老实实前进。'),
        do: draw({st: stOf(), pa: ptrs().pa, pb: ptrs().pb, hA, hB, vars: varsNow()})});
    }

    const meetNode = pA;
    F.push({hl: [4], no: 4, tag: meetNode ? '相遇！' : '同时到 None', cls: meetNode ? 't-green' : 't-red',
      msg: meetNode
        ? '<code>pA is not pB</code> 不成立了：两人<b>站在同一个节点 ' + name(meetNode) + ' 上</b> → 循环结束。从这往后两条链是同一段路，而两人总步数又相同，所以必然在这里（交点）碰头，不会擦肩错过。'
        : 'pA、pB <b>同时变成 None</b> → 两条链不相交：两人走了同样的总路程（m+n 步），却始终没踩到同一个节点，最后只能一起落空。',
      do: draw({st: stOf(), pa: ptrs().pa, pb: ptrs().pb, hA, hB, vars: varsNow()})});

    F.push({hl: [7], tag: '返回', cls: 't-dark',
      msg: meetNode
        ? '<code>return pA</code>：返回<b>交点节点本身</b>（力扣要求返回节点，页面用它的值展示）→ 交点值 = <b>' + valOf[meetNode] + '</b>。复盘：pA 走了 a+c 再补 b，pB 走了 b+c 再补 a——路程抹平之后，交点成了两人的必经之地。'
        : '<code>return pA</code> = <b>None</b>：pA 是 None，两条链没有相交节点，返回空。',
      do: draw({st: stOf(), pa: ptrs().pa, pb: ptrs().pb, hA, hB, vars: varsNow(),
                res: meetNode ? valOf[meetNode] : null})});

    return F;
  },

  /* ========= 解法二：力扣官方方法一 · 哈希表 ========= */
  alt: {
    label: '官方 · 哈希表',
    method: 'getIntersectionNode',

    lede: '题目不变：两条链表<b>从某个节点开始共用同一段尾巴</b>，找到那个相交节点；不相交返回 None。' +
          '这一版是力扣官方方法一——<b>哈希集合</b>：上半场遍历 A 链，把见过的<b>每个节点</b>登记进 ' +
          '<span class="var r">seen</span> 集合（芯片逐个飞入）；下半场遍历 B 链逐个查表，' +
          '<b>第一个已在集合里的节点就是交点</b>；B 走完都没查到 → 不相交。记住：集合里存的是<b>节点</b>，不是值。',

    roles: [
      {c:'orange', code:'p',    text:'当前指针：先扫 A 登记，再扫 B 查表'},
      {c:'blue',   code:'seen', text:'seen 哈希集合：A 链的节点逐个飞入登记'},
      {c:'violet', code:'公共尾巴', text:'紫框节点 = 两条链共用的同一批节点'}
    ],
    legend: [
      {c:'orange', text:'p 当前节点'},
      {c:'blue',   text:'已登记进 seen 的节点'},
      {c:'green',  text:'查表命中 = 交点'},
      {c:'violet', text:'公共尾巴（两边同一批节点）'}
    ],

    codeTitle: '跟着高亮读代码——上半场第 6 行把 A 链逐个 <code>add</code> 进集合；下半场第 10 行 <code>if p in seen</code> 变' +
               '<span style="color:var(--green)">绿</span>＝查到了（交点实锤），变<span style="color:var(--red)">红</span>＝新面孔、继续走。',

    idea: '官方最直白的思路：先把 A 链整条登记进哈希集合，B 链第一个查到的就是交点——用 O(m) 空间买"不用绕跑道"的简单。',

    complexity: '时间 O(m+n)（两条链各扫一遍）　·　空间 O(m)（seen 最坏存下整条 A 链；先扫短的那条可降到 O(min(m,n))）',

    qa: [
      {q:'和双指针（解法一）怎么取舍？',
       a:'时间都是 O(m+n)，分水岭在<b>空间</b>：双指针 O(1)，靠"换跑道走够 a+b+c 步"抹平长度差；哈希表要 O(m) 把 A 链整个记住。哈希法胜在直白、一眼写对，还能自然扩展（比如顺带统计每个节点被走到几次）；双指针胜在零额外空间，是面试的标准答案。'},
      {q:'为什么集合里存节点而不存值？',
       a:'「相交」的定义是<b>内存里同一个节点</b>，不是"值相等"。两条链完全可能各有一个值是 8 的陌生节点——按值登记会把假交点当真。Python 的 set 对对象按身份（id）去重：存节点，查到就一定是踩上了同一格。'},
      {q:'先扫 A 还是先扫 B 有讲究吗？',
       a:'正确性上无所谓——交点在两边都能查到。但<b>空间有讲究</b>：集合存的是先扫那条链的全部节点，先扫短的那条，空间就从 O(m) 降到 O(min(m,n))。官方题解先扫 A，这里跟随。'},
      {q:'B 链查到交点后，为什么不继续扫完？',
       a:'公共尾巴意味着交点之后两条链完全重合，B 链<b>第一个</b>落进集合的节点就是最早的交点——找到即可 return。后面的节点必然也都在集合里，但没有一个是"第一个"，再扫只是白跑。'}
    ],

    code: `class Solution:
    def getIntersectionNode(self, headA, headB):
        seen = set()                      # 哈希集合: 登记见过的每个节点
        pA = headA
        while pA:                         # 上半场: 扫 A 链, 逐个登记
            seen.add(pA)
            pA = pA.next
        pB = headB
        while pB:                         # 下半场: 扫 B 链, 逐个查表
            if pB in seen:                # 第一个查到的 = 交点
                return pB
            pB = pB.next
        return None                       # B 走完都没查到 → 不相交
`,

    sol(input){
      const a = (input.a || []).map(Number), b = (input.b || []).map(Number);
      const sA = Math.max(0, input.skipA | 0), sB = Math.max(0, input.skipB | 0);
      const build = (vals, nxt) => {
        const nds = vals.map(v => ({v, next: null}));
        nds.forEach((nd, i) => { nd.next = nds[i + 1] || nxt; });
        return nds.length ? nds[0] : nxt;
      };
      const common = build(a.slice(sA), null);
      const headA = build(a.slice(0, sA), common);
      const headB = build(b.slice(0, sB), common);
      const seen = new Set();
      let p = headA;
      while(p){ seen.add(p); p = p.next; }
      p = headB;
      while(p){ if(seen.has(p)) return p.v; p = p.next; }
      return null;
    },
    expected: 8,
    pyCheck: false,   // 展示代码为官方签名(吃链表), 页面输入是数组——正确性由 JS sol 对拍验证

    steps(input){
      const F = [];
      const A = (input.a || []).map(Number), B = (input.b || []).map(Number);
      const sA = Math.max(0, input.skipA | 0), sB = Math.max(0, input.skipB | 0);
      const shared = A.slice(sA);           // 公共尾巴的值(以 A 链为准)
      const aU = A.slice(0, Math.min(sA, A.length));
      const bU = B.slice(0, Math.min(sB, B.length));
      const nodesA = aU.map((v, i) => ({key: 'a' + i, val: v}))
          .concat(shared.map((v, i) => ({key: 's' + i, val: v})));
      const nodesB = bU.map((v, i) => ({key: 'b' + i, val: v}))
          .concat(shared.map((v, i) => ({key: 's' + i, val: v})));
      const orderA = nodesA.map(n => n.key), orderB = nodesB.map(n => n.key);
      const valOf = {};
      nodesA.forEach(n => { valOf[n.key] = n.val; });
      nodesB.forEach(n => { valOf[n.key] = n.val; });
      const posA = {}; orderA.forEach((k, i) => { posA[k] = i; });
      const name = k => k == null ? 'None' : '节点' + valOf[k];
      const chip = k => 'A[' + posA[k] + ']=' + valOf[k];
      const headA = orderA.length ? orderA[0] : null;
      const headB = orderB.length ? orderB[0] : null;
      const chainStr = ks => ks.length ? ks.map(k => valOf[k]).join('→') : '(空)';
      const seen = [];                      // 已登记节点 key(按登记顺序)

      /* ★ 快照原则：seen/指针/状态全部在 push 那一刻求值定死，draw 只读快照 o */
      const stOf = (cur, hit) => {
        const st = {};
        shared.forEach((_, i) => { st['s' + i] = 'pivot'; });
        seen.forEach(k => { if(st[k] == null) st[k] = 'in'; });
        if(cur != null) st[cur] = hit ? 'target' : 'active';
        return st;
      };
      const ptrsOf = (cur) => {
        const pa = [], pb = [];
        if(cur != null){
          if(orderA.indexOf(cur) >= 0) pa.push({key: cur, text: '▼ p', cls: 'mi'});
          if(orderB.indexOf(cur) >= 0) pb.push({key: cur, text: '▼ p', cls: 'mi'});
        }
        return {pa, pb};
      };
      const varsOf = (p) => ({p: name(p), seen: seen.length + ' 个'});
      const chipsSnap = () => seen.map(k => chip(k));
      const hA = headA ? {key: headA, text: 'headA', cls: 'mq'} : null;
      const hB = headB ? {key: headB, text: 'headB', cls: 'mq'} : null;
      const draw = (o) => (v) => {
        v.list('LA', nodesA, {label: '链表 A　·　上半场: 每个节点飞入集合',
          states: o.st, pointers: o.pa, headTag: o.hA});
        v.list('LB', nodesB, {label: '链表 B　·　下半场: 逐个查名册',
          states: o.st, pointers: o.pb, headTag: o.hB});
        v.set('seen', o.chips, {label: '<code>seen</code> 集合　·　存节点不存值（' + o.chips.length + ' 个）', color: 'b'});
        if(o.vars) v.vars('vars', o.vars, {label: '变量'});
        if(o.res !== undefined) v.result(o.res, {label: '返回值'});
      };

      F.push({hl: [1,2], tag: '读题·两条链就位', cls: 't-grey',
        msg: '力扣直接给你两个<b>建好的链表</b> headA、headB（页面用 skipA/skipB 构造相交结构，与官方题面用例格式一致）：A 链 = ' + LCesc(chainStr(orderA)) + '，B 链 = ' + LCesc(chainStr(orderB)) + '。' +
             (shared.length
               ? '两行末尾的紫框节点是<b>同一批节点</b>画了两遍——内存里就是同一段公共尾巴。'
               : '两边没有任何公共节点——两条链各自独立，待会看 B 链怎么查空名册。') +
             '这一版不绕跑道：拿哈希集合当<b>名册</b>，先把 A 链全员登记，再拿 B 链逐个对名册。',
        do: draw({st: stOf(null), pa: [], pb: [], hA, hB, chips: [], vars: {p: '—', seen: '0 个'}})});

      F.push({hl: [3,4], tag: '哈希集合就位', cls: 't-ink',
        msg: 'headA = ' + LCesc(chainStr(orderA)) + '，headB = ' + LCesc(chainStr(orderB)) + '，<code>seen = set()</code> 还是空的。' +
             '接下来分两幕：<b>上半场</b>扫 A 链——每个节点飞进集合变成一枚芯片；<b>下半场</b>扫 B 链——每个节点都去集合里查一次自己的名字。' +
             '芯片上写的是"第几号节点=值"，这样即使两条链里有值相同的节点，芯片也不会混。',
        do: draw({st: stOf(null), pa: [], pb: [], hA, hB, chips: [], vars: {p: '—', seen: '0 个'}})});

            for(let i = 0; i < orderA.length; i++){
        const k = orderA[i];
        F.push({hl: [5], ok: 5, tag: 'A 链 · while', cls: 't-blue',
          msg: '<code>while p</code>：p 在 ' + name(k) + '（A 链第 ' + (i + 1) + ' / ' + orderA.length + ' 个），不是 None → 继续登记。集合现有 ' + seen.length + ' 个节点，还剩 ' + (orderA.length - i) + ' 个没进门。',
          do: draw({st: stOf(k), pa: ptrsOf(k).pa, pb: ptrsOf(k).pb, hA, hB, chips: chipsSnap(), vars: varsOf(k)})});
        const dupKey = seen.find(x => valOf[x] === valOf[k]);
        seen.push(k);
        F.push({hl: [6], tag: '登记', cls: 't-blue',
          msg: '<code>seen.add(p)</code>：' + name(k) + ' 飞入集合 → 下方芯片墙多了一枚 <b>' + chip(k) + '</b>。' +
               (dupKey != null
                 ? '注意！集合里已经有一枚值相同的芯片 ' + chip(dupKey) + ' 了——但它们是<b>两枚不同芯片</b>：集合按节点身份登记，值相同 ≠ 同一个节点，这正是"存节点不存值"的意义。'
                 : '从这一刻起，B 链谁走到它、谁就查得到——登记的不只是数字，是"这个节点来过"的事实。目前集合大小：' + seen.length + '。'),
          do: draw({st: stOf(k), pa: ptrsOf(k).pa, pb: ptrsOf(k).pb, hA, hB, chips: chipsSnap(), vars: varsOf(k)})});
        const nx = orderA[i + 1] || null;
        F.push({hl: [7], tag: '前进', cls: 't-ink',
          msg: nx
            ? '<code>p = p.next</code>：走到 ' + name(nx) + '，继续登记。'
            : '<code>p = p.next</code>：' + name(k) + ' 是 A 链最后一个节点，next 是 <b>None</b>——上半场收工。',
          do: draw({st: stOf(nx), pa: ptrsOf(nx).pa, pb: ptrsOf(nx).pb, hA, hB, chips: chipsSnap(), vars: varsOf(nx)})});
      }

      F.push({hl: [5], no: 5, tag: 'A 链登记完毕', cls: 't-grey',
        msg: headA == null
          ? 'A 链是空的：<code>p = None</code> → <code>while p</code> 第一次就不成立，一个节点都没登记。'
          : 'p 走到 <b>None</b> → <code>while p</code> 不成立，上半场结束：A 链全部 <b>' + seen.length + '</b> 个节点都登记在案。' +
            '这就是哈希法的空间开销所在——不管相不相交，A 链都得整个记住（O(m) 空间）。',
        do: draw({st: stOf(null), pa: [], pb: [], hA, hB, chips: chipsSnap(), vars: {p: 'None', seen: seen.length + ' 个'}})});

      F.push({hl: [8], tag: '换扫 B 链', cls: 't-blue',
        msg: '<code>p = headB</code>：指针改扫 B 链' + (headB ? '（' + name(headB) + '）' : '——B 链也是空的') + '。' +
             '下半场规则：p 每到一个节点，就问集合一句"你登记过它吗"——<b>第一个查到的就是交点</b>，因为公共尾巴开头那个节点，正是 A 链登记过的第一个公共节点。',
        do: draw({st: stOf(headB), pa: ptrsOf(headB).pa, pb: ptrsOf(headB).pb, hA, hB, chips: chipsSnap(), vars: varsOf(headB)})});

      let hit = null;
      for(let i = 0; i < orderB.length; i++){
        const k = orderB[i];
        F.push({hl: [9], ok: 9, tag: 'B 链 · while', cls: 't-blue',
          msg: '<code>while p</code>：p 在 ' + name(k) + '（B 链第 ' + (i + 1) + ' / ' + orderB.length + ' 个）→ 继续查表。集合里登记的全是 A 链的节点，B 的独有前缀节点注定查不到——除非它踩进公共尾巴。',
          do: draw({st: stOf(k), pa: ptrsOf(k).pa, pb: ptrsOf(k).pb, hA, hB, chips: chipsSnap(), vars: varsOf(k)})});
        if(seen.indexOf(k) >= 0){
          F.push({hl: [10], ok: 10, tag: '查表命中！', cls: 't-green',
            msg: '<code>p in seen</code> 成立！' + name(k) + ' 在集合里查到了——它就是登记过的芯片 <b>' + chip(k) + '</b>。' +
                 'B 的节点出现在 A 的名册上，唯一的解释是：<b>从它开始两条链走进了同一段内存</b>——这就是交点（链上两行同时点亮成绿色 target）。' +
                 '哈希法全程不追不赶，判定逻辑就这一句查表。',
            do: draw({st: stOf(k, true), pa: ptrsOf(k).pa, pb: ptrsOf(k).pb, hA, hB, chips: chipsSnap(), vars: varsOf(k)})});
          hit = k;
          break;
        }
        const sameVal = seen.find(x => valOf[x] === valOf[k]);
        F.push({hl: [10], no: 10, tag: '查无此人', cls: 't-ink',
          msg: '<code>p in seen</code>：' + name(k) + ' 不在集合里 → 这不是交点，继续走。' +
               (sameVal != null
                 ? '注意：A 链里明明有个值也是 ' + valOf[k] + ' 的节点（芯片 ' + chip(sameVal) + '），但那是<b>另一个节点</b>——集合按身份查、不按值查，所以查无此人。这正是"存节点不存值"在起作用。'
                 : '它是 B 链自己的前缀节点，A 从没来过这里。'),
          do: draw({st: stOf(k), pa: ptrsOf(k).pa, pb: ptrsOf(k).pb, hA, hB, chips: chipsSnap(), vars: varsOf(k)})});
        const nx = orderB[i + 1] || null;
        F.push({hl: [12], tag: '前进', cls: 't-ink',
          msg: nx
            ? '<code>p = p.next</code>：走到 ' + name(nx) + '。'
            : '<code>p = p.next</code>：B 链也走到头了。',
          do: draw({st: stOf(nx), pa: ptrsOf(nx).pa, pb: ptrsOf(nx).pb, hA, hB, chips: chipsSnap(), vars: varsOf(nx)})});
      }

      if(!hit){
        F.push({hl: [8], no: 8, tag: 'B 走完了', cls: 't-red',
          msg: 'p 走到 <b>None</b> → <code>while p</code> 不成立：B 链全部 ' + orderB.length + ' 个节点查了个遍，没有一个在集合里 → 两条链<b>不相交</b>。' +
               'A 链登记的 ' + seen.length + ' 个节点全程没等到熟人——空等一场也是证据。',
          do: draw({st: stOf(null), pa: [], pb: [], hA, hB, chips: chipsSnap(), vars: {p: 'None', seen: seen.length + ' 个'}})});
        F.push({hl: [13], tag: '返回 None', cls: 't-dark',
          msg: '🎉 <code>return None</code>：不相交。复盘：时间 O(m+n)——两条链各扫一遍；空间 O(m)——seen 把 A 链整个记住。' +
               '对比解法一的双指针：那边 O(1) 空间走 a+b+c 步也能得到同样结论——一个用空间买直白，一个用零空间买优雅，都是官方正解。',
          do: draw({st: stOf(null), pa: [], pb: [], hA, hB, chips: chipsSnap(), vars: {p: 'None', seen: seen.length + ' 个'}, res: null})});
      } else {
        F.push({hl: [11], tag: '返回交点', cls: 't-dark',
          msg: '🎉 <code>return pB</code>：返回<b>交点节点本身</b>（力扣要求返回节点，页面用它的值展示）→ 交点值 = <b>' + valOf[hit] + '</b>。复盘：时间 O(m+n)——两条链各扫一遍；空间 O(m)——seen 最坏存下整条 A 链' +
               '（官方进阶：先扫短的那条，可降到 O(min(m,n))）。对比解法一：双指针 O(1) 空间零额外记忆，哈希表 O(m) 空间换"逐个查名册"的直白——两版都要会讲。',
          do: draw({st: stOf(hit, true), pa: ptrsOf(hit).pa, pb: ptrsOf(hit).pb, hA, hB, chips: chipsSnap(), vars: varsOf(hit), res: valOf[hit]})});
      }

      return F;
    }
  }
});
</script>
