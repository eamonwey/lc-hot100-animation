<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P066 · 寻找旋转排序数组中的最小值 · 动画题解</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="wrap" id="app"></div>
<script src="../assets/problems.js"></script>
<script src="../assets/progress.js"></script>
<script src="../assets/viz.js"></script>
<script src="../assets/engine.js"></script>
<script>
LC.register({
  order: 66, num: 153, title: '寻找旋转排序数组中的最小值', diff: '中等', cat: '二分查找',
  method: 'findMin',

  lede: '题目：升序数组被在某个点<b>拧断旋转</b>了（如 0,1,2,4,5,6,7 → 4,5,6,7,0,1,2），要 O(log n) 找出里面的<b>最小值</b>。' +
        '最小值一定站在<b>断点</b>上。动画里 <span class="var r">l</span>/<span class="var r">r</span> 收缩候选区间，' +
        '<span class="var i">mid</span> 每轮只和右端 <code>nums[r]</code> 比一次：<span class="var i">mid</span> 比右端小 → 右半有序、最小在左半（mid 也算）；mid 比右端大 → 断崖在中间、最小在 mid 右边。',

  roles: [
    {c:'blue',   code:'l / r',  text:'候选区间 [l, r]（闭区间）'},
    {c:'orange', code:'mid',    text:'每轮试探的中点'},
    {c:'violet', code:'nums[r]',text:'每轮的比较基准（右端点）'},
    {c:'blue',   code:'蓝格',   text:'还在候选区间里的格子'}
  ],

  codeTitle: '跟着高亮读代码——第 6 行变<span style="color:var(--green)">绿</span>＝nums[mid] &lt; nums[r]（右半没断点，压右界到 mid），变<span style="color:var(--red)">红</span>＝mid 比右端还大（断崖在右，跳过 mid）。',

  legend: [
    {c:'blue', text:'候选区间 [l, r]'},
    {c:'orange', text:'mid（与右端比较）'},
    {c:'violet', text:'nums[r] 比较基准'},
    {swatch:'var(--grey-soft)', text:'灰格 = 已出局'}
  ],

  idea: '拿 mid 和右端 nums[r] 比：mid 更小 ⇒ mid 右边没断点，最小在含 mid 的左半（r = mid）；mid 更大 ⇒ 断崖就在 mid 右边，最小在 mid+1 之后（l = mid + 1）。',

  qa: [
    {q:'为什么跟 nums[r] 比，而不是跟 nums[l] 比？',
     a:'跟 nums[l] 比会出事：没旋转（或只剩有序段）时 nums[mid] &gt; nums[l] 恒成立，你分不清"最小在左边"还是"左边本来就最小"。而 nums[r] 是"右半段的天花板"：<b>nums[mid] &lt; nums[r]</b> 说明 mid 到 r 之间没有任何断崖，最小值只会在 mid 左边（含 mid）；反之断崖必在 mid 和 r 之间。右端点不会骗人。'},
    {q:'为什么 mid 比 nums[r] 小时要写 r = mid，而不是 r = mid − 1？',
     a:'因为 nums[mid] 自己<b>可能就是最小值</b>（断点右侧的第一个数）。扔掉它就可能把答案扔了。只有确定 mid 不可能最小（mid &gt; nums[r] 时）才敢 l = mid + 1。'},
    {q:'为什么不会死循环？',
     a:'l &lt; r 时 mid = (l+r)//2 一定 &lt; r。走 r = mid：上界从 r 变成 mid &lt; r，区间变小；走 l = mid + 1：下界跳过 mid，区间也变小。两边都严格收缩，最终 l == r 收敛到唯一候选。'},
    {q:'这题数组里有重复数怎么办？',
     a:'本题保证元素互不相同，所以 mid ≠ nums[r] 时大小关系干净。若有重复（LC 154），nums[mid] == nums[r] 时无法判断断点在哪边，只能 r-- 保守缩一格，最坏退化为 O(n)。'}
  ],

  complexity: '时间 O(log n)　·　空间 O(1)',

  form: [
    {key:'nums', label:'nums', type:'arr', def:[4,5,6,7,0,1,2]}
  ],
  presets: [
    {label:'[4,5,6,7,0,1,2]', values:{nums:[4,5,6,7,0,1,2]}},
    {label:'[3,4,5,1,2]', values:{nums:[3,4,5,1,2]}},
    {label:'[2,1]（最小在开头前）', values:{nums:[2,1]}},
    {label:'[1,2,3,4,5]（没旋转）', values:{nums:[1,2,3,4,5]}},
    {label:'[2]（单元素）', values:{nums:[2]}}
  ],

  code: `class Solution:
    def findMin(self, nums):
        l, r = 0, len(nums) - 1          # 闭区间 [l, r]
        while l < r:                     # 还剩不止一个候选
            mid = (l + r) // 2           # 中点(偏左)
            if nums[mid] < nums[r]:      # mid..r 无断点 → 最小在左半(含 mid)
                r = mid                  # 保留 mid, 向左压
            else:                        # mid 比 nums[r] 大 → 断崖在 mid 右侧
                l = mid + 1              # mid 连自己一起出局
        return nums[l]                   # 收缩到只剩一个, 它就是最小
`,

  sol(input){
    const nums = input.nums;
    let l = 0, r = nums.length - 1;
    while(l < r){
      const mid = (l + r) >> 1;
      if(nums[mid] < nums[r]) r = mid; else l = mid + 1;
    }
    return nums[l];
  },
  expected: 0,

  quiz: [
    {q:'每轮拿 mid 和<b>右端 nums[r]</b> 比。为什么不改成和左端 nums[l] 比?',
     options:['右端的数总是更小,好比','和 nums[l] 比分不清方向:没旋转时 nums[mid] > nums[l] 恒成立,你判断不了"最小在左边"还是"左边本来就是最小";而 nums[r] 是右半的天花板,不会骗人','习惯问题,两者完全等价'],
     answer:1,
     explain:'nums[r] 的语义干净:<b>nums[mid] < nums[r] ⇔ mid..r 之间没有断崖</b>,最小值只会在 mid 左边(含 mid);nums[mid] > nums[r] 则断崖必在 mid 与 r 之间,最小在 mid 右侧。换成 nums[l],数组没旋转(或区间已整体有序)时 mid 永远比 l 大,这个信息既不指向左边也不指向右边,二分直接失灵。选基准不是玄学,要看它的值能不能唯一"翻译"出断点位置。',
     jumpTo:5},
    {q:'代入算一算:nums = [7,8,9,10,11,3,4,5],最小值是多少?',
     options:['3','11','5','4'],
     answer:0,
     explain:'跟跑一遍:l=0,r=7,mid=3(10 > nums[7]=5,断崖在 mid 右侧)→ l=4;l=4,r=7,mid=5(3 < nums[7]=5,mid..r 无断崖)→ r=5;l=4,r=5,mid=4(11 > nums[5]=3)→ l=5;l=r=5 收敛 → <b>nums[5] = 3</b>。断崖 11→3 一露头,高坡尾巴(11)被整段扔掉,答案 3 站在低坡开头,正好被 r = mid 一路保留到最后。',
     jumpTo:16},
    {q:'如果数组压根没旋转(如 [1,2,3,4,5]),这套二分还能返回正确的最小值吗?',
     options:['能:每轮 nums[mid] < nums[r] 都成立,r 一路左压,最后 l=r=0,返回 nums[0]=1','不能,会返回中间的数','会死循环'],
     answer:0,
     explain:'没旋转 = 断点不存在,整个数组就是一个大爬坡。每轮 mid 都比 nums[r] 小(左 < 右),走 r = mid 分支:区间 [0,4]→[0,2]→[0,1]→[0,0],l==r 时停在开头,返回 1——正确。这题的优雅之处:它不需要先判断"转没转",比较逻辑天然兼容两种情况;<b>死循环也不会有</b>,因为向下取整保证 mid < r,r = mid 每轮至少缩一格。',
     jumpTo:16},
  ],

  steps(input){
    const F = [];
    const nums = input.nums;
    const n = nums.length;

    const draw = (o) => (v) => {
      v.arr('nums', nums, {
        label:'数组 <code>nums</code>　·　' + o.phase,
        states:o.states, markers:o.markers, labels:o.labels || {}
      });
      v.vars('vars', o.vars, {label:'变量'});
      if(o.res !== undefined) v.result(o.res, {label:'返回结果'});
    };
    const mk = (l, r, mid) => {
      const a = [{name:'l', idx:l, cls:'mr', text:'▲ l'},
                 {name:'r', idx:r, cls:'mg', text:'▲ r'}];
      if(mid != null) a.push({name:'mid', idx:mid, cls:'mi', text:'▲ mid'});
      return a;
    };
    const stOf = (l, r, hot) => {
      const s = {};
      for(let t = 0; t < n; t++) s[t] = (t >= l && t <= r) ? 'in' : 'muted';
      Object.assign(s, hot || {});
      return s;
    };

    let l = 0, r = n - 1;

    // 断点（仅供解说）
    let drop = -1;
    for(let t = 0; t + 1 < n; t++) if(nums[t] > nums[t + 1]){ drop = t; break; }

    F.push({hl:[1,2,3], tag:'准备', cls:'t-grey',
      msg:'数组旋转后其实成了<b>两段各自递增</b>的爬坡，最小值就是<b>第二段的开头</b>（断点后的第一个数）。现在的候选是闭区间 [0, ' + (n - 1) + '] 共 ' + n + ' 个数：▲蓝 l 是左界、▲绿 r 是右界，两个之间（含两端）都还可能有最小值。目标：每轮只问一次"mid 和右端谁小"，就把候选扔掉一半，最后夹得只剩一个。',
      do: draw({phase:'准备', states: stOf(0, n - 1), markers: mk(0, n - 1, null),
                vars:{l:l, r:r, mid:'—', 'nums[mid]':'—', 'nums[r]':'—'}})});

    F.push({hl:[3], tag:'关键直觉', cls:'t-grey',
      msg: drop >= 0
        ? '断点在 <code>' + nums[drop] + ' → ' + nums[drop + 1] + '</code>（第 ' + (drop + 1) + ' → 第 ' + (drop + 2) + ' 格）：最小值 <b>' + nums[drop + 1] + '</b> 就站在断点右边。怎么用二分找到它？每轮拿 mid 和<b>右端 nums[r]</b> 比一次。'
        : '数组没旋转（或转了整圈），本来就整体递增——最小值就是开头那个。别担心，下面的二分照样能把它逼出来：每一轮都会正确地扔掉一半" certainly不是最小值"的候选，最后剩下的就是它。',
      do: (function(){
        const s = {}, labels = {};
        for(let t = 0; t < n; t++) s[t] = 'in';
        if(drop >= 0){
          for(let t = 0; t <= drop; t++) s[t] = 'in';
          for(let t = drop + 1; t < n; t++) s[t] = 'peek';
          labels[drop + 1] = '最小值在这';
        }
        return (v) => draw({phase:'认题：最小值站在断点上', states:s, labels:labels,
                            markers: mk(0, n - 1, null),
                            vars:{l:l, r:r, mid:'—', 'nums[mid]':'—', 'nums[r]':'—'}})(v);
      })()});

    while(l < r){
      const mid = (l + r) >> 1;
      F.push({hl:[4], ok:4, tag:'循环检查', cls:'t-blue',
        msg:'先看循环条件 <code>l &lt; r</code>：当前候选区间 [' + l + ', ' + r + '] 还剩 <b>' + (r - l + 1) + '</b> 个数，两头没碰面，还能再扔一半。注意循环用的是 <code>&lt;</code> 而不是 <code>&lt;=</code>——一旦 l == r，候选只剩一个，它就是答案，不用再比了。',
        do: draw({phase:'区间 [' + l + ', ' + r + ']', states: stOf(l, r), markers: mk(l, r, null),
                  vars:{l:l, r:r, mid:'—', 'nums[mid]':'—', 'nums[r]':nums[r]}})});
      F.push({hl:[5], tag:'取中点', cls:'t-ink',
        msg:'<code>mid = (l + r) // 2 = (' + l + ' + ' + r + ') ÷ 2 向下取整 = ' + mid + '</code>。<b>向下取整保证 mid 永远不会等于 r</b>（mid 偏左）——这一点很要命：待会如果走 r = mid，区间一定在缩小，绝不会原地打转死循环。现在的比较对象：<code>nums[mid] = ' + nums[mid] + '</code> vs 右端 <code>nums[r] = ' + nums[r] + '</code>。',
        do: draw({phase:'区间 [' + l + ', ' + r + ']',
                  states: stOf(l, r, (function(){ const o = {}; o[mid] = 'active'; o[r] = 'pivot'; return o; })()),
                  markers: mk(l, r, mid),
                  vars:{l:l, r:r, mid:mid, 'nums[mid]':nums[mid], 'nums[r]':nums[r]}})});

      const lt = nums[mid] < nums[r];
      F.push({hl:[6], ok: lt ? 6 : undefined, no: lt ? undefined : 6,
        tag:'比右端', cls: lt ? 't-green' : 't-red',
        msg: lt
          ? '<b>mid 比 r 小</b>（' + nums[mid] + ' &lt; ' + nums[r] + '）：从 mid 到 r 这一段是纯递增的爬坡，中间没有断崖——断崖的特征是"左边比右边大"，这里没有。最小值是断崖后的第一个数，所以它<b>绝不可能在 mid 右边</b>；它要么就是 mid 自己，要么在 mid 左边。结论：右边界可以压到 mid（mid 仍有嫌疑，先留着）。'
          : '<b>mid 居然比 r 还大</b>（' + nums[mid] + ' &gt; ' + nums[r] + '）：一段纯递增的数组里左边不可能比右端大——唯一的解释是 <b>mid 和 r 之间正好跨过了断崖</b>（从高坡尾巴直接掉到低坡开头）。所以最小值一定在 mid 的<b>右边</b>；而 mid 自己站在高坡上，绝不可能是最小值。结论：mid 和它左边全部出局。',
        do: draw({phase:'区间 [' + l + ', ' + r + ']',
                  states: stOf(l, r, (function(){ const o = {}; o[mid] = 'active'; o[r] = 'pivot'; return o; })()),
                  markers: mk(l, r, mid),
                  vars:{l:l, r:r, mid:mid, 'nums[mid]':nums[mid], 'nums[r]':nums[r]}})});

      if(lt){
        r = mid;
        F.push({hl:[7], tag:'压右界', cls:'t-orange',
          msg:'<code>r = mid = ' + r + '</code>。注意是 <code>r = mid</code> 而不是 <code>r = mid − 1</code>：mid 压线比 nums[r] 小，它<b>自己可能正好是断点后的第一个数（最小值本人）</b>，不能冤枉它，先留着。候选区间缩成 [' + l + ', ' + r + ']，还剩 ' + (r - l + 1) + ' 个。',
          do: draw({phase:'区间 [' + l + ', ' + r + ']', states: stOf(l, r),
                    markers: mk(l, r, null),
                    vars:{l:l, r:r, mid:'—', 'nums[mid]':'—', 'nums[r]':nums[r]}})});
      } else {
        l = mid + 1;
        F.push({hl:[8,9], tag:'推左界', cls:'t-orange',
          msg:'<code>l = mid + 1 = ' + l + '</code>。mid 站在高坡上<b>绝不可能是最小值</b>，连它一起扔掉；这里必须 +1——如果只写 <code>l = mid</code>，区间可能一点都不缩（死循环）。候选区间缩成 [' + l + ', ' + r + ']，还剩 ' + (r - l + 1) + ' 个。',
          do: draw({phase:'区间 [' + l + ', ' + r + ']', states: stOf(l, r),
                    markers: mk(l, r, null),
                    vars:{l:l, r:r, mid:'—', 'nums[mid]':'—', 'nums[r]':nums[r]}})});
      }
    }

    F.push({hl:[4], no:4, tag:'区间只剩一个', cls:'t-grey',
      msg:'<code>l = r = ' + l + '</code> → 两端碰面，循环结束。复盘一下：不管断点原来藏在哪，每一轮都严格扔掉了一半嫌疑人，剩下的第 ' + (l + 1) + ' 格就是唯一幸存者，值是 <b>' + nums[l] + '</b>。',
      do: draw({phase:'只剩一个候选',
                states: stOf(l, l, (function(){ const o = {}; o[l] = 'target'; return o; })()),
                markers: mk(l, l, null),
                vars:{l:l, r:r, mid:'—', 'nums[mid]':'—', 'nums[r]':'—'}})});
    F.push({hl:[10], tag:'返回', cls:'t-dark',
      msg:'<code>return nums[' + l + ']</code> → 最小值 = <b>' + nums[l] + '</b> 🎉 复杂度复盘：每轮一次比较扔掉一半候选，' + n + ' 个数只要约 log₂' + n + ' 轮——这就是 O(log n)；对比从头扫到尾的 O(n)，数组越长二分越划算。',
      do: draw({phase:'返回 ' + nums[l],
                states: stOf(l, l, (function(){ const o = {}; o[l] = 'target'; return o; })()),
                markers: mk(l, l, null),
                vars:{l:l, r:r, mid:'—', 'nums[mid]':'—', 'nums[r]':'—'},
                res: nums[l]})});
    return F;
  }
});
</script>
