<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P093 · 编辑距离 · 动画题解</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="wrap" id="app"></div>
<script src="../assets/problems.js"></script>
<script src="../assets/progress.js"></script>
<script src="../assets/viz.js"></script>
<script src="../assets/engine.js"></script>
<script>
LC.register({
  order: 93, num: 72, title: '编辑距离', diff: '中等', cat: '多维动态规划',
  method: 'minDistance',

  lede: '题目：把单词 <span class="var r">word1</span> 变成 <span class="var r">word2</span>，每次可以<b>插入 / 删除 / 替换</b>一个字符，求最少几步。' +
        '动画填一张二维 DP 表：行是 word1 的前缀、列是 word2 的前缀，<code>dp[i][j]</code> = "前 i 个变前 j 个"最少几步。' +
        '填每格时 <span class="var i">i</span>、<span class="var r">j</span> 两根名牌分别指着正在比较的两个字符，格子上的小字记录这格用了哪种操作。',

  roles: [
    {c:'orange', code:'i / j', text:'正在比较的两个字符'},
    {c:'blue',   code:'dp[i][j]', text:'格子 = 前 i 个变前 j 个的最少操作数'},
    {c:'green',  code:'同', text:'字符相同：白拿左上角，不花操作'},
    {c:'red',    code:'改/删/增', text:'字符不同：三个来源取最小再 +1'}
  ],

  codeTitle: '跟着高亮读代码——if 行变<span style="color:var(--green)">绿</span>＝两个字符相同(白拿左上)，变<span style="color:var(--red)">红</span>＝不同，要在增/删/改里挑最省的。',

  legend: [
    {c:'orange', text:'正在填的格子'},
    {c:'blue',   text:'被参考的来源格'},
    {c:'green',  text:'字符相同、直接抄来的格子'}
  ],

  idea: 'dp[i][j] = word1 前 i 个 → word2 前 j 个的最少步数：字符相同抄左上；否则 min(左上=改, 上=删, 左=增) + 1。',

  qa: [
    {q:'为什么字符相同就只抄左上角？',
     a:'最后一个字符已经相等，不用为它花任何操作，问题直接缩小成"前 i−1 个变前 j−1 个"。其他走法都得先折腾掉这个相同的字符，不可能更省——所以抄左上就是最优。'},
    {q:'增 / 删 / 改分别对应哪个格子？',
     a:'都站在已算好的小问题肩膀上：<b>改</b> = dp[i−1][j−1]+1（把 word1[i] 替换成 word2[j]）；<b>删</b> = dp[i−1][j]+1（删掉 word1 的第 i 个字符）；<b>增</b> = dp[i][j−1]+1（在 word1 尾部插入 word2 的第 j 个字符）。'},
    {q:'第一行第一列为什么是 0,1,2,…？',
     a:'边界：一边是空串。word1 前 i 个变空串 = 全删光，要 i 步；空串变 word2 前 j 个 = 逐个插入，要 j 步。它们是所有递推的地基。'},
    {q:'复杂度是多少？',
     a:'表有 (m+1)×(n+1) 格，每格 O(1) 递推 → 时间 O(mn)、空间 O(mn)。只保留两行可以压到 O(min(m,n))。'}
  ],

  complexity: '时间 O(m·n)　·　空间 O(m·n)（整张 DP 表）',

  form: [
    {key:'word1', label:'word1', type:'str', def:'horse'},
    {key:'word2', label:'word2', type:'str', def:'ros'}
  ],
  presets: [
    {label:'horse → ros（3 步）', values:{word1:'horse', word2:'ros'}},
    {label:'abc → abc（0 步，全同）', values:{word1:'abc', word2:'abc'}},
    {label:'sea → eat（3 步）', values:{word1:'sea', word2:'eat'}},
    {label:'a → b（单字符边界）', values:{word1:'a', word2:'b'}}
  ],

  code: `class Solution:
    def minDistance(self, word1, word2):
        m, n = len(word1), len(word2)
        dp = [[0] * (n + 1) for _ in range(m + 1)]
        for i in range(m + 1):      # 第 0 列: 删光
            dp[i][0] = i
        for j in range(n + 1):      # 第 0 行: 插入
            dp[0][j] = j
        for i in range(1, m + 1):
            for j in range(1, n + 1):
                if word1[i-1] == word2[j-1]:
                    dp[i][j] = dp[i-1][j-1]  # 白拿左上
                else:               # 增删改取最小
                    dp[i][j] = 1 + min(
                        dp[i-1][j],     # 删
                        dp[i][j-1],     # 增
                        dp[i-1][j-1])   # 改
        return dp[m][n]
`,

  sol(input){
    const w1 = String(input.word1 || ''), w2 = String(input.word2 || '');
    const m = w1.length, n = w2.length;
    const dp = Array.from({length:m + 1}, () => new Array(n + 1).fill(0));
    for(let i = 0; i <= m; i++) dp[i][0] = i;
    for(let j = 0; j <= n; j++) dp[0][j] = j;
    for(let i = 1; i <= m; i++)
      for(let j = 1; j <= n; j++)
        dp[i][j] = w1[i-1] === w2[j-1]
          ? dp[i-1][j-1]
          : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    return dp[m][n];
  },
  expected: 3,

  quiz: [
    {q:'替换一次就能把一个字符对上,那"增"和"删"两个选项是不是冗余、只留"改"就够了?',
     options:['够——任何增删都能用几次替换拼出来,步数不会更多','不够——替换改变不了长度:word1="abc" 变 word2="c" 靠删两个字符只要 2 步,光用替换永远凑不齐长度差','不够——因为题目要求三种操作至少各用一次'],
     answer:1,
     explain:'替换是"同长度"操作,两个前缀长度不一时,增/删是唯一能把长度差消掉的手段:第 0 列 dp[i][0] = i(全删光)就是纯删的极端情形。默认例 horse→ros 的最优方案也是"改 1 + 删 2":horse→rorse(改)→rose(删)→ros(删)——没有删,3 步做不到。三个来源各有分工:改管"对齐字符"、删管"甩掉 word1 的尾巴"、增管"补上 word2 的尾巴",min 缺一不可。',
     jumpTo:2},
    {q:'word1 = "kitten",word2 = "sitting",最少几步?',
     options:['2','3','4','5'],
     answer:1,
     explain:'k→s(改)、e→i(改)、末尾补一个 g(增),其余 i/t/t/n 逐位相同白拿左上 → 3 步。选 2 的是只看见两处替换、漏了长度差:6 个字母变 7 个,必须再花 1 步插入(替换永远变不出多出来的字符)。选 4、5 的是把"逐位比较不同就改"当成了全部——真正的 DP 会在相同字符处免费抄左上,不会傻改。',
     jumpTo:34},
    {q:'DP 表 (m+1)×(n+1) 的空间能压到多少? 代价是什么?',
     options:['必须留整张表,不然递推无米下锅','O(min(m,n)):算第 i 行只需上一行和本行左边一格,滚动数组即可;代价是丢掉"来源"信息,想还原具体编辑方案得保留整表或用分治','O(1):两个变量滚着走就够'],
     answer:1,
     explain:'转移只查三个格子:左上、上(上一行)和左(本行左侧)。用一维数组从左到右原地更新、再用一个临时变量记住"左上旧值",就能滚出每一行——空间从 O(mn) 降到 O(min(m,n))(挑短词当列更省)。但滚动表覆盖了历史行,右下角只剩"距离"这个数:要回放出"改哪个、删哪个、插哪个"的完整方案,要么整表留底,要么用 Hirschberg 分治线性空间重建。两个变量(选项 C)连"上一行"都装不下,三来源里有两个会踩空。',
     jumpTo:1},
  ],

  steps(input){
    const F = [];
    const w1 = String(input.word1 || ''), w2 = String(input.word2 || '');
    const m = w1.length, n = w2.length;
    const c1 = w1.split(''), c2 = w2.split('');

    // 真实跑一遍算法（与 Python 同逻辑），随跑随记
    const dp = Array.from({length:m + 1}, () => new Array(n + 1).fill(0));
    const filled = Array.from({length:m + 1}, () => new Array(n + 1).fill(false));
    const op = Array.from({length:m + 1}, () => new Array(n + 1).fill(''));

    // 快照：整张表当前长什么样（铁律 5：帧生成那一刻求值）
    const disp = () => {
      const mat = [];
      for(let i = 0; i <= m; i++){
        const row = [];
        for(let j = 0; j <= n; j++)
          row.push(filled[i][j] ? String(dp[i][j]) + (op[i][j] || '') : '');
        mat.push(row);
      }
      return mat;
    };
    const mi = i => ({name:'i', idx:i - 1, cls:'mi', text:'▲ i'});
    const mj = j => ({name:'j', idx:j - 1, cls:'mr', text:'▲ j'});

    const draw = (o) => (v) => {
      v.arr('w1', c1, {label:'<code>word1</code>　·　表的第 i 行用到它的前 i 个字符',
        quotes:true, states:o.s1 || {}, markers:o.m1 || [], idxCls:o.i1 || {}});
      v.arr('w2', c2, {label:'<code>word2</code>　·　表的第 j 列用到它的前 j 个字符',
        quotes:true, states:o.s2 || {}, markers:o.m2 || [], idxCls:o.i2 || {}});
      v.grid('dp', o.mat, {label:'<code>dp</code> 表　·　行 i = word1 前 i 个 → 列 j = word2 前 j 个的最少操作数',
        states:o.gst || {}});
      if(o.vars) v.vars('vars', o.vars, {label:'当前变量', hl:o.hlv || []});
      if(o.res !== undefined) v.result(o.res, {label:'返回结果'});
    };

    F.push({hl:[1,2,3,4], tag:'开表', cls:'t-grey',
      msg:'开一张 (' + (m + 1) + ')×(' + (n + 1) + ') 的表：<code>dp[i][j]</code> = 把 word1 的<b>前 i 个</b>字符变成 word2 的<b>前 j 个</b>字符最少几步——行是 word1 的前缀、列是 word2 的前缀。每格只看两个字符：word1 的第 i 个 vs word2 的第 j 个（i、j 名牌指着它们）。规则先记住：<b>字符相同白拿左上角；不同就在增/删/改三个邻居里挑最省的，再 +1</b>。',
      do: draw({mat: disp(), vars:{m:m, n:n}})});

    F.push({hl:[5,6], tag:'铺第 0 列', cls:'t-ink',
      msg:'先铺第 0 列：目标 word2 是<b>空串</b>（前 0 个字符），word1 前 i 个字符只能<b>一个一个全删光</b>，恰好 i 步 → <code>dp[i][0] = i</code>，从上到下 0、1、…、' + m + '。这些边界不是摆设：里面每格递推都要查"上一行 / 左一列"，第 0 行和第 0 列正是最靠边的那些小问题，是整张表的地基。',
      do: (function(){
        const gst = {};
        for(let i = 0; i <= m; i++){ gst[i + ',0'] = 'just'; dp[i][0] = i; filled[i][0] = true; }
        return draw({mat: disp(), gst: gst, vars:{m:m, n:n, 'dp[i][0]':'i'}});
      })()});

    F.push({hl:[7,8], tag:'铺第 0 行', cls:'t-ink',
      msg:'再铺第 0 行：word1 是<b>空串</b>，凭空变出 word2 前 j 个字符只能<b>逐个插入</b>，恰好 j 步 → <code>dp[0][j] = j</code>，从左到右 0、1、…、' + n + '。至此边界铺齐：任何 dp[i][j] 的三个来源（左上 / 上 / 左）都落在已填好的格子上，递推不会再踩空。',
      do: (function(){
        const gst = {};
        for(let j = 0; j <= n; j++){ gst['0,' + j] = 'just'; dp[0][j] = j; filled[0][j] = true; }
        return draw({mat: disp(), gst: gst, vars:{m:m, n:n, 'dp[0][j]':'j'}});
      })()});

    for(let i = 1; i <= m; i++){
      for(let j = 1; j <= n; j++){
        const ch1 = w1[i-1], ch2 = w2[j-1];
        const same = ch1 === ch2;
        const mk1 = [mi(i)], mk2 = [mj(j)];
        const s1 = {}, s2 = {};
        s1[i-1] = 'active'; s2[j-1] = 'active';
        const i1 = {}, i2 = {};
        i1[i-1] = 'on-i'; i2[j-1] = 'on-r';

        F.push({hl:[9,10,11], ok: same ? 11 : undefined, no: same ? undefined : 11,
          tag:'填 dp[' + i + '][' + j + ']', cls:'t-blue',
          msg: same
            ? '读数：word1 第 ' + i + ' 个字符 <code>' + LCesc(ch1) + '</code> = word2 第 ' + j + ' 个字符 <code>' + LCesc(ch2) + '</code>，<b>相同！</b>两个尾巴已经对齐，不用为它们花任何操作，问题直接缩小成"前 ' + (i-1) + ' 个变前 ' + (j-1) + ' 个"——也就是左上角 <code>dp[' + (i-1) + '][' + (j-1) + ']</code>，蓝色格。'
            : '读数：word1 的 <code>' + LCesc(ch1) + '</code> ≠ word2 的 <code>' + LCesc(ch2) + '</code>——两个尾巴对不上，<b>必须花一次操作</b>把局面收小。三种操作各对应一个已算好的邻居：<b>改</b> = 左上 dp[i−1][j−1]（把 word1 第 i 个字符改成 word2 第 j 个）；<b>删</b> = 上方 dp[i−1][j]（把 word1 第 i 个字符删掉）；<b>增</b> = 左方 dp[i][j−1]（在 word1 尾部插入 word2 第 j 个字符）。蓝色格是左上来源。',
          do: draw({mat: disp(),
                    gst: (function(){ const g = {}; g[i + ',' + j] = 'active'; g[(i-1) + ',' + (j-1)] = 'in'; return g; })(),
                    s1: s1, s2: s2, m1: mk1, m2: mk2, i1: i1, i2: i2,
                    vars:{i:i, j:j, 'word1[i-1]':"'"+ch1+"'", 'word2[j-1]':"'"+ch2+"'", 'dp[i][j]':'?'}})});

        let val, wop, gstB, varsB, hlvB;
        if(same){
          val = dp[i-1][j-1]; wop = '同';
          gstB = {}; gstB[i + ',' + j] = 'just'; gstB[(i-1) + ',' + (j-1)] = 'in';
          varsB = {i:i, j:j, 'dp[i-1][j-1]':val, 'dp[i][j]':val};
          hlvB = ['dp[i][j]'];
          dp[i][j] = val; op[i][j] = wop; filled[i][j] = true;
          F.push({hl:[12], tag:'抄左上', cls:'t-green',
            msg:'<code>dp[' + i + '][' + j + '] = dp[' + (i-1) + '][' + (j-1) + '] = ' + val + '</code>，白拿左上、零操作定格（小字记"同"）。为什么敢只抄左上？这对相同字符本来就不用动；若绕道别的邻居，得先把它们折腾掉、平白多花至少 1 步，绝不可能更省——所以"相同即抄左上"永远是最优。',
            do: draw({mat: disp(), gst: gstB, s1: s1, s2: s2, m1: mk1, m2: mk2, i1: i1, i2: i2,
                      vars: varsB, hlv: hlvB})});
        } else {
          const cD = dp[i-1][j-1] + 1, cU = dp[i-1][j] + 1, cL = dp[i][j-1] + 1;
          const cands = [['改', cD, (i-1) + ',' + (j-1)], ['删', cU, (i-1) + ',' + j], ['增', cL, i + ',' + (j-1)]];
          cands.sort((a, b) => a[1] - b[1]);
          val = cands[0][1]; wop = cands[0][0];
          gstB = {}; gstB[i + ',' + j] = 'just';
          gstB[cands[0][2]] = 'in'; gstB[cands[1][2]] = 'muted'; gstB[cands[2][2]] = 'muted';
          varsB = {i:i, j:j, 改:cD, 删:cU, 增:cL, 'dp[i][j]':val};
          hlvB = ['dp[i][j]'];
          dp[i][j] = val; op[i][j] = wop; filled[i][j] = true;
          F.push({hl:[13,14,15,16,17], ok:14, tag:'取最小 +1', cls:'t-orange',
            msg:'三个候选逐一读数：<b>改</b>（把 <code>' + LCesc(ch1) + '</code> 改成 <code>' + LCesc(ch2) + '</code>，缩到左上）= dp[' + (i-1) + '][' + (j-1) + ']+1 = ' + cD + '；<b>删</b>（删掉 word1 的 <code>' + LCesc(ch1) + '</code>，缩到上方）= dp[' + (i-1) + '][' + j + ']+1 = ' + cU + '；<b>增</b>（在 word1 尾部插入 <code>' + LCesc(ch2) + '</code>，缩到左方）= dp[' + i + '][' + (j-1) + ']+1 = ' + cL + '。最小是 <b>' + val + '</b>，走「<b>' + wop + '</b>」→ dp[' + i + '][' + j + '] = ' + val + ' 定格（画面：赢家的来源格蓝色，另两个灰色；+1 就是刚花的这一步操作）。',

            do: draw({mat: disp(), gst: gstB, s1: s1, s2: s2, m1: mk1, m2: mk2, i1: i1, i2: i2,
                      vars: varsB, hlv: hlvB})});
        }
      }
    }

    F.push({hl:[18], tag:'返回', cls:'t-dark',
      msg:'全表填完！<code>return dp[' + m + '][' + n + ']</code> = <b>' + dp[m][n] + '</b> —— 把 "' + LCesc(w1) + '" 变成 "' + LCesc(w2) + '" 最少 <b>' + dp[m][n] + '</b> 步 🎉 右下角就是答案，因为两个词都整只进来了。格子里的小字记录每格用的操作：同＝白拿左上，改/删/增＝三个邻居谁最小用谁——沿小字从右下往左上走，就能还原整套编辑方案。',
      do: (function(){
        const gst = {}; gst[m + ',' + n] = 'target';
        return draw({mat: disp(), gst: gst, res: dp[m][n]});
      })()});

    return F;
  }
});
</script>
