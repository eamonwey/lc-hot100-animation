<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P042 · 验证二叉搜索树 · 动画题解</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="wrap" id="app"></div>
<script src="../assets/problems.js"></script>
<script src="../assets/progress.js"></script>
<script src="../assets/viz.js"></script>
<script src="../assets/engine.js"></script>
<script>
LC.register({
  order: 42, num: 98, title: '验证二叉搜索树', diff: '中等', cat: '二叉树',
  method: 'isValidBST',

  lede: '题目：判断这棵树是不是<b>合法 BST</b>——每个节点的值必须<b>大于左子树的全部、小于右子树的全部</b>，不是只跟直接孩子比！' +
        '招式：递归 <span class="var r">check(node, lo, hi)</span> 给每个节点发一个<b>允许区间</b>，' +
        '动画里它就挂在节点头顶；往左走上界收紧、往右走下界抬高，谁越界谁变红。默认用例里节点 4 就是这么被抓住的。',

  roles: [
    {c:'orange', code:'active', text:'正在接受区间检查的节点'},
    {c:'blue',   code:'in',     text:'递归路径上的祖先'},
    {c:'red',    code:'block',  text:'越界的节点（ BST 被判假的原因）'},
    {c:'violet', code:'tags',   text:'节点头顶 = 允许取值区间 (lo, hi)'}
  ],

  codeTitle: '跟着高亮读代码——节点头顶的标签就是 (lo, hi) 紧箍咒。if 行变<span style="color:var(--green)">绿</span>＝命中出口，变<span style="color:var(--red)">红</span>＝区间检查通过、继续往下查。',

  idea: '递归携带上下界：左子树上界收紧成当前值、右子树下界抬高成当前值，一路收紧，谁出界谁暴露。',

  qa: [
    {q:'为什么只比"父与子"会判错？',
     a:'经典反例 [5,1,4,null,null,3,6]：4 > 5 不成立吗？4 是 5 的右孩子，4 < 5 直接违规还行；更隐蔽的是 [10,5,15,null,null,6,20]——6 < 15 是合法的父子关系，但 6 还必须大于祖先 10。所以每个节点实际受<b>所有祖先</b>的约束，要带着区间走。'},
    {q:'区间为什么是"开区间"？',
     a:'BST 定义要求严格小于/大于，值等于边界也不行。所以检查的是 lo < node.val < hi，而不是 ≤。'},
    {q:'lo、hi 初始为什么是 ±∞？',
     a:'根节点没有祖先约束，任何值都允许，所以区间是 (-∞, +∞)。Python 里用 float(\'-inf\') 表示，往下传时才逐层收紧。'},
    {q:'还有别的写法吗？',
     a:'中序遍历：合法 BST 的中序是严格递增序列，边遍历边比前驱也行，且不用 ∞。两种都是 O(n)；区间法更好推广（比如求第 k 大、修剪 BST）。'}
  ],

  complexity: '时间 O(n)（每个节点访问一次）　·　空间 O(h)（递归栈，h 为树高）',

  form: [
    {key:'root', label:'root', type:'tree', def:[5,1,4,null,null,3,6]}
  ],
  presets: [
    {label:'[5,1,4,null,null,3,6] 假', values:{root:[5,1,4,null,null,3,6]}},
    {label:'[2,1,3] 真', values:{root:[2,1,3]}},
    {label:'[10,5,15,null,null,6,20] 假(跨层)', values:{root:[10,5,15,null,null,6,20]}},
    {label:'单节点 [1] 真', values:{root:[1]}},
    {label:'空树 []', values:{root:[]}}
  ],

  code: `class Solution:
    def isValidBST(self, root):
        def check(node, lo, hi):          # node 的值必须落在开区间 (lo, hi)
            if not node:                  # 空位天然合法
                return True
            if not (lo < node.val < hi):  # 越出允许区间 -> 不是 BST
                return False
            l = check(node.left, lo, node.val)    # 左走: 上界收紧为当前值
            r = check(node.right, node.val, hi)   # 右走: 下界抬高为当前值
            return l and r
        return check(root, float('-inf'), float('inf'))
`,

  sol(input){
    const T = Viz.parseTree(input.root || []);
    const byKey = {}; T.nodes.forEach(n => byKey[n.key] = n);
    function check(k, lo, hi){
      if(k == null) return true;
      const val = byKey[k].val;
      if(!(lo < val && val < hi)) return false;
      return check(byKey[k].left, lo, val) && check(byKey[k].right, val, hi);
    }
    return check(T.root, -Infinity, Infinity);
  },
  expected: false,

  quiz: [
    {q:'验证 BST 时只比较「父节点和直接孩子」的大小,够用吗?',
     options:['够,BST 的定义就是父 > 左孩子、父 < 右孩子','不够——每个节点受的是全部祖先的合围,只比父子会漏掉跨层反例;所以递归要给每个节点带一个允许区间 (lo, hi)','不够,还得顺便检查左右子树高度是否平衡'],
     answer:1,
     explain:'默认树的节点 3 就是活证据:3 < 4,父子比合法;但 3 住在根 5 的右子树里,必须同时大于祖先 5——只比父子永远发现不了这条跨层约束。解法是 check(node, lo, hi):往左走上界收紧成当前值、往右走下界抬高成当前值,区间越走越窄,每个边界都对应一位路过的祖先,谁越界谁暴露。',
     jumpTo:4},
    {q:'把输入换成 [10,5,15,null,null,6,20] 时,节点 6 进场时头顶的允许区间是?最终返回?',
     options:['(-∞, 15),返回 true','(5, 15),返回 false','(10, 15),返回 false'],
     answer:2,
     explain:'沿路径 10 → 15 → 6:根 10 往右走把下界抬成 10(右子树全体必须 >10);15 往左走把上界收紧成 15 → 6 拿到开区间 (10, 15)。检查 10 < 6 < 15 不成立 → return false。6 < 15 这关父子比能过,但它没够到祖先 10 划的下界——这就是带区间法才能抓住的跨层违规。',
     jumpTo:15},
    {q:'区间检查为什么写成 lo < val < hi(严格不等),而不是 ≤?',
     options:['写 ≤ 也完全等价,只是习惯','因为浮点数不能判断相等','BST 要求严格大于/小于:值等于任何一位祖先的边界也不合法,所以用开区间,等于边界即当场判假'],
     answer:2,
     explain:'BST 的定义是"左子树全部 < 根 < 右子树全部",没有等于的余地:若允许重复值,同一个值出现在两侧,"左 < 根 < 右"就自相矛盾,查找时也没法唯一导航。所以检查用开区间 (lo, hi),val 撞线即违规;根节点没有祖先约束,区间从 (-∞, +∞) 起步。',
     jumpTo:2},
  ],

  steps(input){
    const F = [];
    const T = Viz.parseTree(input.root || []);
    const t = Viz.treeLayout(input.root || []);
    const byKey = {}; T.nodes.forEach(n => byKey[n.key] = n);
    const bounds = new Map();      // key -> [lo, hi] 进入该节点时的允许区间
    const badSet = new Set();      // 越界的节点
    let seq = 0;

    const nm = k => k == null ? '空' : '节点' + LCesc(String(byKey[k].val));
    const sv = k => k == null ? '空' : String(byKey[k].val);
    const fmtB = x => x === -Infinity ? '-∞' : x === Infinity ? '∞' : String(x);
    const snapBad = () => Array.from(badSet);
    const tagsSnap = () => {
      const tg = {};
      bounds.forEach((bv, k) => {
        const isBad = badSet.has(k);
        tg[k] = {text:'(' + fmtB(bv[0]) + ', ' + fmtB(bv[1]) + ')' + (isBad ? ' 越界!' : ''),
                 cls:'mi', color:isBad ? 'var(--red)' : null};
      });
      return tg;
    };

    /* ★ 快照原则：bounds/bad/path/stack/vars 全部在 push 时求值定死, do() 只读快照 o */
    const draw = o => (v) => {
      const states = {};
      (o.bad || []).forEach(k => { states[k] = 'block'; });
      (o.path || []).forEach(k => { if(states[k] == null) states[k] = 'in'; });
      if(o.cur != null) states[o.cur] = 'active';
      v.tree('T', t, {label:'二叉树　·　头顶 = 该节点允许的取值区间 (lo, hi)', states, tags: o.tags || {}});
      const stack = o.stack || [];
      v.stack('S', stack, {
        label:'递归调用栈　·　每层带着自己的 (lo, hi)',
        states: stack.length ? {[stack[stack.length - 1].key]:'active'} : {},
        topTag:'栈顶'
      });
      if(o.vars) v.vars('vars', o.vars, {label:'当前节点的区间', hl:o.hlVars || []});
      if(o.result != null) v.result(o.result, {label:'是否合法 BST'});
    };

    function visit(k, lo, hi, frames, path){
      const id = 'c' + (++seq);
      const stack = frames.concat([{key:id, val:'check(' + sv(k) + ', ' + fmtB(lo) + ', ' + fmtB(hi) + ')'}]);
      if(k == null){
        F.push({hl:[4,5], ok:4, tag:'空位', cls:'t-green',
          msg:'调用 <code>check(空, ' + fmtB(lo) + ', ' + fmtB(hi) + ')</code> → <b>return True</b>：空子树里一个值都没有，没有谁能违反 (' + fmtB(lo) + ', ' + fmtB(hi) + ') 这条区间，天生合法——不用查，也绝不能判假。别嫌这一步多余：正是这个出口让递归能安全走到每个叶子的下一层。画面：调用栈压入一层又立刻弹走。',
          do: draw({stack, path})});
        return true;
      }
      bounds.set(k, [lo, hi]);
      const val = byKey[k].val;
      F.push({hl:[3], tag:'带区间进入', cls:'t-blue',
        msg:'调用 <b>check(' + nm(k) + ', ' + fmtB(lo) + ', ' + fmtB(hi) + ')</b>：给' + nm(k) + '头顶挂上允许区间 <b>(' + fmtB(lo) + ', ' + fmtB(hi) + ')</b>——这不是它自己的属性，是祖先们逐层收紧传下来的"紧箍咒"，区间里每条边界都代表一位祖先。为什么必须带全祖先？只比父子会漏掉跨层反例：默认树的节点 3 是 4 的左孩子，3 &lt; 4 父子比合法，但它还得大于更老的祖先 5。画面：头顶新名牌就是 (lo, hi)，调用栈也压入新的一层。',
        do: draw({stack, cur:k, path: path.concat(k), tags: tagsSnap(),
                  vars:{node: nm(k), lo: fmtB(lo), hi: fmtB(hi), l: '…', r: '…'}})});

      const violated = !(lo < val && val < hi);
      if(violated){
        badSet.add(k);
        F.push({hl:[6,7], ok:6, tag:'越界!', cls:'t-red',
        msg:'<code>' + fmtB(lo) + ' &lt; ' + LCesc(String(val)) + ' &lt; ' + fmtB(hi) + '</code> 不成立 → ' + nm(k) +
            ' 越出了允许区间 (' + fmtB(lo) + ', ' + fmtB(hi) + ')，<b>return False</b>！' +
            (val <= lo
              ? '它踩的是<b>下界</b> ' + fmtB(lo) + '：某位祖先要求"必须比我大"，它没够到。'
              : '它撞的是<b>上界</b> ' + fmtB(hi) + '：某位祖先划的天花板被顶穿了。') +
            '红色就是罪魁祸首，头顶名牌标上"越界!"。它的子孙不用再查——一棵子树里有节点违法，整棵树就判假，直接层层上报 False。',
          do: draw({stack, cur:k, path: path.concat(k), tags: tagsSnap(), bad: snapBad(),
                    vars:{node: nm(k), lo: fmtB(lo), hi: fmtB(hi), l: '—', r: '—'}})});
        return false;
      }
      F.push({hl:[6], no:6, tag:'区间通过', cls:'t-green',
        msg:'<code>' + fmtB(lo) + ' &lt; ' + LCesc(String(val)) + ' &lt; ' + fmtB(hi) + '</code> 成立 ✓ → ' + nm(k) + ' 守住了祖先们的合围，这颗雷没踩。接下来它要替子孙把关：马上往左走，<b>上界收紧</b>成 ' + LCesc(String(val)) + '（左子树全体必须比 ' + LCesc(String(val)) + ' 小）；待会往右走时下界也会抬高成 ' + LCesc(String(val)) + '。区间每下一层就窄一分——"整棵子树都合法"就是这样被拆成一步一步验的。',
        do: draw({stack, cur:k, path: path.concat(k), tags: tagsSnap(),
                  vars:{node: nm(k), lo: fmtB(lo), hi: fmtB(hi), l: '…', r: '…'}})});

      const l = visit(byKey[k].left, lo, val, stack, path.concat(k));
      F.push({hl:[8], tag:'左子树返回', cls: l ? 't-green' : 't-red',
        msg:'左子树（拿的区间是 (' + fmtB(lo) + ', ' + fmtB(val) + ')）回来汇报：<b>' + l + '</b>' + (l ? '——左边一片全部合法。' : '——左边有节点越界（红色）。注意代码是先把 r 也算完、再 return l and r，所以右边还会继续查完。') + '接着查右子树：<b>下界抬高</b>成 ' + LCesc(String(val)) + '，同时上界 ' + fmtB(hi) + ' 原样带上——右子树既要大于 ' + LCesc(String(val)) + '，也不能忘掉更老的祖先。',
        do: draw({stack, cur:k, path: path.concat(k), tags: tagsSnap(), bad: snapBad(),
                  vars:{node: nm(k), lo: fmtB(lo), hi: fmtB(hi), l: String(l), r: '…'}, hlVars:['l']})});

      const r = visit(byKey[k].right, val, hi, stack, path.concat(k));
      F.push({hl:[9], tag:'右子树返回', cls: r ? 't-green' : 't-red',
        msg:'右子树（拿的区间是 (' + fmtB(val) + ', ' + fmtB(hi) + ')）回来汇报：<b>' + r + '</b>' + (r ? '——右半边也守住了。' : '——右半边出了越界者（红色）。') + 'BST 是"所有节点都必须合法"的全称判断，缺一个都不行，所以汇总用 <b>and</b>：l、r 两个布尔必须同时为 True，任何一边是 False，整棵子树就连坐判假。',
        do: draw({stack, cur:k, path: path.concat(k), tags: tagsSnap(), bad: snapBad(),
                  vars:{node: nm(k), lo: fmtB(lo), hi: fmtB(hi), l: String(l), r: String(r)}, hlVars:['r']})});

      const res = l && r;
      F.push({hl:[10], tag: res ? '子树全合法' : '子树有假', cls: res ? 't-green' : 't-red',
        msg:'<code>' + l + ' and ' + r + ' = ' + res + '</code> → 以' + nm(k) + '为根的子树' + (res ? '整体合法：自己的区间检查 + 左右两份汇报全绿，它可以放心向祖先交差。' : '不合法：只要有一个 False，整棵子树连坐判假。') + '调用栈弹出这一层，把结论上报给父亲——父亲再把它并进自己的 l 或 r。',
        do: draw({stack: frames, path, tags: tagsSnap(), bad: snapBad(),
                  vars:{node: nm(k), lo: fmtB(lo), hi: fmtB(hi), l: String(l), r: String(r)}})});
      return res;
    }

    F.push({hl:[1,2,11], tag:'读题', cls:'t-grey',
      msg:'验证 BST：每个节点必须<b>大于左子树的全部、小于右子树的全部</b>——注意是"全部"，不是只跟直接孩子比。反例就埋在默认树的节点 3 身上：它是节点 4 的左孩子，3 &lt; 4 这关父子比能过，但它住在根 5 的右子树里，还得大于祖先 5——只比父子的写法永远发现不了这条跨层约束。所以招式是递归 <code>check(节点, lo, hi)</code>：给每个节点发一个"允许区间"，从 <code>check(root, -∞, ∞)</code> 出发，越往下收得越紧。',
      do: draw({stack: []})});
    F.push({hl:[3,4,5], tag:'出口', cls:'t-grey',
      msg:'两种出口：① <code>check(空位)</code> → 直接 <b>return True</b>——空子树里一个值都没有，没有谁能违反任何区间，就像空房间没有住客、谈不上违规；这也是递归的保底出口，没有它树走到底就崩了。② 非空节点先验自己：值必须落在<b>开区间</b> <code>(lo, hi)</code> 里（开区间 = 等于边界也不行，BST 要求严格大于/小于），验不过当场 return False。',
      do: draw({stack: []})});
    F.push({hl:[6,8,9], tag:'收紧区间', cls:'t-grey',
      msg:'往下传区间只有两条规则：往左走，左子树全体都得比当前值小 → <b>上界 hi 收紧成当前值</b>；往右走，右子树全体都得比当前值大 → <b>下界 lo 抬高成当前值</b>。每个边界只由"路过的某一位祖先"写下，但合起来就等效于全体祖先的合围——比如默认树的节点 3 若被访问，区间会是 (5, 4)：下界 5 来自根、上界 4 来自父亲，两头一起卡，3 哪头都过不去。区间越走越窄，谁越界谁被抓住。',
      do: draw({stack: []})});

    const res = visit(T.root, -Infinity, Infinity, [], []);

    F.push({hl:[11], tag:'验证结束', cls:'t-dark',
      msg: res
        ? '🎉 所有节点都守住了自己头顶的区间 → <b>是合法 BST</b>。复盘：每个节点只做一次 O(1) 的区间检查，全树 n 个节点 → 时间 O(n)；递归栈深 = 树高 h → 空间 O(h)。'
        : '✗ 有节点越界（红色）→ <b>不是 BST</b>。复盘：它撞的红线来自某位祖先——只看相邻父子永远查不出这种跨层违规（想想默认树里 4 的左孩子 3：3 &lt; 4 合法，却必须大于祖先 5）。带区间法全树只走一趟：时间 O(n)、空间 O(h)。',
      do: draw({stack: [], tags: tagsSnap(), bad: snapBad(), result: res})});

    return F;
  }
});
</script>
