<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P008 · 无重复字符的最长子串 · 动画题解</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="wrap" id="app"></div>
<script src="../assets/problems.js"></script>
<script src="../assets/progress.js"></script>
<script src="../assets/viz.js"></script>
<script src="../assets/engine.js"></script>
<script>
LC.register({
  order: 8, num: 3, title: '无重复字符的最长子串', diff: '中等', cat: '滑动窗口',
  method: 'lengthOfLongestSubstring',

  lede: '题目：找出字符串里<b>最长的不含重复字符</b>的连续子串，返回长度。' +
        '这份解法依次枚举左端 <span class="var o">i</span>：先从 <span class="var r">occ</span> 里移除上轮的左端字符，' +
        '再让右端 <span class="var i">rk</span> 尽量向右走，直到下一格重复或到达末尾。' +
        '<code>rk = -1</code> 表示最开始窗口是空的；每轮最后用 <code>rk - i + 1</code> 更新最长纪录。',

  roles: [
    {c:'green', code:'i', text:'左端：for 循环每轮右移一格'},
    {c:'orange', code:'rk', text:'右端：只向右扩张，初始为 -1'},
    {c:'blue', code:'occ', text:'当前窗口的字符集合'},
    {c:'violet', code:'ans', text:'已经找到的最长无重复长度'}
  ],

  codeTitle: '跟着高亮读代码——<code>while rk + 1 &lt; n and s[rk + 1] not in occ</code> 成立时继续扩张；下一格重复或越界时停下，结算当前左端 i 的最长窗口。',

  legend: [
    {c:'blue', text:'已进入窗口的字符'},
    {c:'green', text:'i 当前左端'},
    {c:'orange', text:'rk 当前右端'},
    {c:'red', text:'下一格重复，暂时不能进窗'}
  ],

  idea: '枚举左端 i，每轮先移除旧左端，再让 rk 尽量向右扩张；每个起点都量一次最长无重复窗口，rk 从不回头。',

  qa: [
    {q:'为什么 rk 从 -1 开始？',
     a:'开始时一个字符都没进窗。i=0、rk=-1 让窗口长度 rk-i+1 正好等于 0，下一格 rk+1 正好是下标 0。先判断下一格、加入 occ，再把 rk 加一，第一次扩张也能和后面的步骤用同一套写法。'},
    {q:'为什么每轮只移除 s[i-1] 一个字符？',
     a:'for 让左端 i 每次只右移一格，所以上轮窗口恰好只少掉旧左端 s[i-1]。删除后剩下的窗口仍然无重复；如果下一格依然重复，while 就一次也不执行，先结算这一轮，再由下一轮继续移动左端。'},
    {q:'“极长”与“最长”有什么区别？',
     a:'while 停下后，s[i..rk] 已经不能在当前起点 i 下继续向右扩张，这叫<b>极长</b>。不同起点的极长窗口可能长短不同，ans = max(ans, rk-i+1) 才会把全串的<b>最长</b>长度留下。'},
    {q:'for 里套 while，为什么仍是 O(n)？',
     a:'i 只从 0 走到 n-1，rk 也只从 -1 向右走，绝不退回 i 重扫。每个字符最多加入 occ 一次、移除一次，所以所有 while 加起来最多扩张 n 次，总时间 O(n)。rk 到末尾后，剩下的 i 仍继续结算，但不会再扩张。'}
  ],

  complexity: '时间 O(n)（i、rk 都只向右走） · 空间 O(min(n, |Σ|))（窗口字符集合）',

  form: [{key:'s', label:'s', type:'str', def:'abcabcbb'}],
  presets: [
    {label:'abcabcbb（答案 3）', values:{s:'abcabcbb'}},
    {label:'bbbbb（全是重复）', values:{s:'bbbbb'}},
    {label:'pwwkew（别掉进子序列陷阱）', values:{s:'pwwkew'}},
    {label:'dvdf（经典易错）', values:{s:'dvdf'}},
    {label:'abba（下一格仍重复）', values:{s:'abba'}},
    {label:'空字符串（答案 0）', values:{s:''}}
  ],

  code: `class Solution:
    def lengthOfLongestSubstring(self, s: str) -> int:
        # 哈希集合，记录每个字符是否出现过
        occ = set()
        n = len(s)
        # 右指针，初始值为 -1，相当于我们在字符串的左边界的左侧，还没有开始移动
        rk, ans = -1, 0
        for i in range(n):
            if i != 0:
                # 左指针向右移动一格，移除一个字符
                occ.remove(s[i - 1])
            while rk + 1 < n and s[rk + 1] not in occ:
                # 不断地移动右指针
                occ.add(s[rk + 1])
                rk += 1
            # 第 i 到 rk 个字符是一个极长的无重复字符子串
            ans = max(ans, rk - i + 1)
        return ans
`,

  sol(input){
    const s = Array.from(String(input.s == null ? '' : input.s));
    const occ = new Set(), n = s.length;
    let rk = -1, ans = 0;
    for(let i = 0; i < n; i++){
      if(i !== 0) occ.delete(s[i - 1]);
      while(rk + 1 < n && !occ.has(s[rk + 1])){
        occ.add(s[rk + 1]);
        rk += 1;
      }
      ans = Math.max(ans, rk - i + 1);
    }
    return ans;
  },
  expected: 3,

  quiz: [
    {q:'初始 i=0、rk=-1 时，为什么窗口长度是 0？',
     options:['rk-i+1 = -1-0+1 = 0，下一格 rk+1 就是第 0 格','因为字符串一定是空串','因为第 0 格永远不会加入 occ'],
     answer:0,
     explain:'-1 表示右端还在字符串左边界之外，不是 Python 负下标取最后一个字符。代码实际访问的是 s[rk+1]，第一次访问 s[0]；加入后 rk 才变成 0，窗口长变成 1。',
     jumpTo:4},
    {q:'s="abba"，i 从 0 变成 1，删除旧左端 a 后，rk 会立刻右移吗？',
     options:['会，左边删一个，右边必须进一个','不会，下一格还是 b，occ 里仍有 b；这一轮 while 不执行','会，rk 要重新退回 i 再开始'],
     answer:1,
     explain:'i=0 时窗口是 ab，rk=1。i=1 后只移除 a，occ 还剩 b；下一格 s[2] 也是 b，条件不成立，所以先结算长度 1。到 i=2 时再移除旧 b，右端才可以继续接入新的 b 和 a。ans 一直保留最大长度 2。',
     jumpTo:17},
    {q:'while 停下后，s[i..rk] 一定是整个字符串最长的无重复子串吗？',
     options:['一定是，可以直接返回窗口长度','不一定；它只是在当前起点 i 下不能继续右扩的窗口，还要用 ans 比较各轮长度','不是，因为 occ 里允许重复字符'],
     answer:1,
     explain:'“极长”指固定当前起点后，下一格重复或越界，已经不能再向右扩。“最长”需要比较所有起点；所以每一轮都执行 ans=max(ans,rk-i+1)，最后才返回 ans。',
     jumpTo:14},
  ],

  steps(input){
    const F = [];
    const S = Array.from(String(input.s == null ? '' : input.s)), n = S.length;
    const occ = new Set();
    let rk = -1, ans = 0, bestL = 0, bestR = -1;
    const quote = c => LCesc(JSON.stringify(c));
    const vars = (i, extra) => Object.assign({n:n, i:i, rk:rk, ans:ans, 'occ 项数':occ.size}, extra || {});
    const marks = (i, right, next) => {
      const m = [];
      if(i >= 0 && i < n) m.push({name:'i', idx:i, cls:'mg', text:'▲ i'});
      if(right >= 0 && right < n) m.push({name:'rk', idx:right, cls:'mi', text:'▲ rk'});
      if(next != null && next < n) m.push({name:'next', idx:next, cls:'mv', text:'▲ rk+1'});
      return m;
    };
    const win = (left, right, extra) => {
      const states = {};
      for(let k = Math.max(0, left); k <= right; k++) states[k] = 'in';
      return Object.assign(states, extra || {});
    };
    // 每次创建 draw 时，集合、指针、文字都已经保存为当前帧的快照。
    const draw = o => v => {
      v.arr('s', S, {label:'字符串 <code>s</code> · 左端 <code>i</code>，右端 <code>rk</code>',
        quotes:true, states:o.states || {}, markers:o.marks || []});
      v.set('occ', o.occ, {label:'字符集合 <code>occ</code>', color:'b'});
      v.text('window', o.window, {label:'当前执行状态', html:true});
      v.vars('vars', o.vars, {label:'变量'});
      if(o.best) v.text('best', o.best, {label:'历史最优窗口', html:true});
      if(o.result !== undefined) v.result(o.result, {label:'最长无重复长度'});
    };
    const frameData = (i, left, extra) => Object.assign({states:win(left, rk), marks:marks(i, rk),
      occ:Array.from(occ), vars:vars(i), window:rk >= left ? '窗口 s[' + left + '..' + rk + ']' : '窗口为空'}, extra || {});

    F.push({hl:[1,2,4,5,7], tag:'初始化', cls:'t-grey',
      msg:'先建空集合 occ，字符串有 <b>' + n + '</b> 个字符，<code>rk = -1</code>、<code>ans = 0</code>。rk=-1 表示右端还没进入字符串；等 i=0 时，rk-i+1 正好为 0，下一格 rk+1 正好是下标 0。接下来枚举左端 i，每轮先移除旧左端，再尽量向右扩张。',
      do:draw({states:{}, marks:[], occ:[], vars:vars('—'), window:'空窗口；rk=-1，右端还在字符串左边界之外'})});

    for(let i = 0; i < n; i++){
      const oldLeft = i === 0 ? 0 : i - 1;
      F.push({hl:[8], tag:'枚举左端', cls:'t-ink',
        msg:'<code>for i in range(n)</code>：这轮左端取 <b>i=' + i + '</b>，右端仍停在 rk=' + rk + '，不会退回去重扫。' +
            (i === 0 ? '这是第一轮，occ 还是空的，没有旧字符要删除。' : 'for 只改变了 i，occ 还保存上轮窗口；旧左端 s[' + (i - 1) + ']=' + quote(S[i - 1]) + ' 要到后面的 remove 那行才移除。'),
        do:draw(frameData(i, oldLeft, {states:win(oldLeft, rk, i > 0 ? {[i - 1]:'stale'} : {}),
          window:i > 0 ? '左端已移到 i=' + i + '；旧左端 s[' + (i - 1) + '] 尚未移除' : 'i=0，准备从第 0 格向右扩张'}))});

      F.push({hl:[9], ok:i !== 0 ? 9 : undefined, no:i === 0 ? 9 : undefined,
        tag:'检查是否移除', cls:i === 0 ? 't-grey' : 't-orange',
        msg:i === 0
          ? '<code>i != 0</code> 不成立：第一轮没有上轮窗口，跳过 remove。下一步直接检查 rk+1 能不能进窗。'
          : '<code>i != 0</code> 成立：左端从 ' + (i - 1) + ' 移到了 ' + i + '，只需把旧左端 ' + quote(S[i - 1]) + ' 从 occ 移除一次，剩下的窗口仍然无重复。',
        do:draw(frameData(i, oldLeft, {states:win(oldLeft, rk, i > 0 ? {[i - 1]:'stale'} : {}),
          window:i === 0 ? '第一轮跳过删除' : '准备移除 s[' + (i - 1) + '] = ' + quote(S[i - 1])}))});

      if(i !== 0){
        occ.delete(S[i - 1]);
        F.push({hl:[11], tag:'移除旧左端', cls:'t-orange',
          msg:'执行 <code>occ.remove(s[i-1])</code>，移除 s[' + (i - 1) + ']=' + quote(S[i - 1]) + '（灰色退场格）。现在集合正好对应剩下的窗口 s[' + i + '..' + rk + ']，有 ' + occ.size + ' 个字符；rk 仍是 ' + rk + '，删一个并不代表右边一定能进一个，还要重新查重。',
          do:draw(frameData(i, i, {states:win(i, rk, {[i - 1]:'gone'}),
            window:'已移除旧左端；当前窗口 s[' + i + '..' + rk + ']，长度 ' + (rk - i + 1)}))});
      }

      while(true){
        const next = rk + 1, inBounds = next < n, canAdd = inBounds && !occ.has(S[next]);
        F.push({hl:[12], ok:canAdd ? 12 : undefined, no:canAdd ? undefined : 12,
          tag:canAdd ? '下一格可进窗' : (inBounds ? '下一格重复' : '右端已到头'), cls:canAdd ? 't-green' : 't-red',
          msg:canAdd
            ? '先检查 <code>rk+1=' + next + ' &lt; n=' + n + '</code>，没有越界；再查 s[' + next + ']=' + quote(S[next]) + ' 不在 occ 里，while 两个条件都成立。此刻只是检查，名单和 rk 都还没改变；下一行才把这个字符加入集合。'
            : (inBounds
              ? '下一格 s[' + next + ']=' + quote(S[next]) + ' 已经在 occ 里，<code>s[rk+1] not in occ</code> 不成立，所以暂时不能扩张。rk 停在 ' + rk + '，先量当前起点 i=' + i + ' 的窗口；后续轮次会继续移动 i、移除旧左端。'
              : '<code>rk+1=' + next + '</code> 已经不小于 n=' + n + '，右边没有字符了。and 在第一个条件就停下，不会访问越界的 s[' + next + ']；本轮直接结算长度，后续 i 仍会继续前进。'),
          do:draw(frameData(i, i, {states:win(i, rk, inBounds ? {[next]:canAdd ? 'peek' : 'block'} : {}),
            marks:marks(i, rk, inBounds ? next : null),
            window:inBounds ? '尝试下一格 s[' + next + '] = ' + quote(S[next]) + (canAdd ? '：可以进窗' : '：重复，停止扩张') : '右端到末尾，停止扩张'}))});
        if(!canAdd) break;

        occ.add(S[next]);
        F.push({hl:[14], tag:'加入集合', cls:'t-blue',
          msg:'执行 <code>occ.add(s[rk+1])</code>：把 s[' + next + ']=' + quote(S[next]) + ' 加入名单，occ 现在有 ' + occ.size + ' 个字符。注意本行只改集合，<b>rk 仍是 ' + rk + '</b>；新字符已经登记，指针要等下一行才移过去。',
          do:draw(frameData(i, i, {states:win(i, rk, {[next]:'just'}), marks:marks(i, rk, next),
            window:'新字符已入 occ，等待下一行 rk += 1'}))});

        rk += 1;
        F.push({hl:[15], tag:'右端加一', cls:'t-orange',
          msg:'执行 <code>rk += 1</code>，右端从 ' + (rk - 1) + ' 移到 <b>' + rk + '</b>。现在窗口 s[' + i + '..' + rk + '] 与 occ 完全对应，长度是 ' + (rk - i + 1) + '；回到 while 那行，继续尝试新的 rk+1。',
          do:draw(frameData(i, i, {window:'窗口 s[' + i + '..' + rk + '] = ' + quote(S.slice(i, rk + 1).join('')) + '，长度 ' + (rk - i + 1)}))});
      }

      const len = rk - i + 1, oldAns = ans;
      ans = Math.max(ans, len);
      if(ans > oldAns){ bestL = i; bestR = rk; }
      F.push({hl:[17], tag:'结算当前起点', cls:ans > oldAns ? 't-green' : 't-grey',
        msg:'当前左端 i=' + i + ' 的窗口已经不能再向右扩张，长度 <code>rk-i+1=' + rk + '-' + i + '+1=' + len + '</code>。执行 <code>ans=max(' + oldAns + ', ' + len + ')=' + ans + '</code>，' + (ans > oldAns ? '最长纪录刷新。' : '最长纪录保持不变。') + '“极长”只表示这个起点下扩不动了，不一定是全串“最长”，所以每一轮都要比较。',
        do:draw(frameData(i, i, {vars:vars(i, {'rk-i+1':len}),
          window:'起点 i=' + i + ' 的极长窗口：' + quote(S.slice(i, rk + 1).join('')) + '，长度 ' + len}))});
    }

    F.push({hl:[18], tag:'返回', cls:'t-dark',
      msg:n
        ? '所有起点都枚举完，返回 <code>ans=' + ans + '</code>。历史最优窗口是 s[' + bestL + '..' + bestR + ']=' + quote(S.slice(bestL, bestR + 1).join('')) + '。图上的蓝格和 occ 保留最后一轮的窗口，下面单独列出历史最优，避免把两个时刻混在一起；i 和 rk 都只向右走，总时间 O(n)。'
        : '字符串为空，n=0，for 一轮都不执行。occ 保持为空，rk=-1、ans=0，直接返回 <code>0</code>。',
      do:draw(frameData(n ? n - 1 : '—', n ? n - 1 : 0, {result:ans,
        best:n ? 's[' + bestL + '..' + bestR + '] = ' + quote(S.slice(bestL, bestR + 1).join('')) + '，长度 ' + ans : '空字符串，最长长度为 0',
        window:n ? '最后一轮窗口 s[' + (n - 1) + '..' + rk + ']；历史最优见下方' : '空窗口，未进入循环'}))});
    return F;
  }
});
</script>
