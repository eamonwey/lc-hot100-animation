<head>

<title>P061 · N 皇后 · 动画题解</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="wrap" id="app"></div>
<script src="../assets/problems.js"></script>
<script src="../assets/viz.js"></script>
<script src="../assets/engine.js"></script>
<script>
LC.register({
  order: 61, num: 51, title: 'N 皇后', diff: '困难', cat: '回溯',
  method: 'solveNQueens',

  lede: '题目：在 n×n 棋盘上放 n 个皇后，让<b>任何两个都不同列、不同斜线</b>，返回所有摆法。' +
        '动画逐行放置：<span class="var i">dfs(r)</span> 只管第 r 行——从左到右试每一列，' +
        '<span class="var r">col / d1 / d2</span> 三本账 O(1) 查冲突，被攻击的格子闪红跳过；' +
        '放稳一个就递归去摆下一行，走投无路就拿走皇后（紫）回溯。n 行全部摆好 = 收集一个解。',

  roles: [
    {c:'orange', code:'Q',        text:'刚放上的皇后'},
    {c:'red',    code:'冲突',     text:'被列/对角线攻击 → 闪红跳过'},
    {c:'blue',   code:'col/d1/d2', text:'三本账：列、主对角线(r−c)、副对角线(r+c)'},
    {c:'violet', code:'回溯',      text:'此路不通 → 拿走皇后恢复现场'}
  ],

  codeTitle: '跟着高亮读代码——第 11 行变<span style="color:var(--red)">红</span>＝三本账查出冲突、跳过；' +
             '橙＝放置并递归下一行；紫＝回溯拿走皇后；第 8 行变<span style="color:var(--green)">绿</span>＝n 行全放好，收集一个解。',

  idea: '逐行放皇后（行冲突被结构消灭），列和对角线用三个集合记账：同一条主对角线 r−c 是定值、副对角线 r+c 是定值——O(1) 就知道一格安不安全。',

  qa: [
    {q:'为什么逐行放就不用担心"同行冲突"？',
     a:'每层 dfs 只在"本行"选一列，放完立刻递归下一行——一行永远只有一个候选。行冲突被"一行一层"的结构直接消灭，只剩列和两条斜线要查，这也是回溯题的经典套路：把一个维度的检查变成结构本身。'},
    {q:'r−c、r+c 凭什么能代表对角线？',
     a:'主对角线（↘ 方向）上所有格子的 行−列 相同：(0,0)(1,1)(2,2) 都是 0；副对角线（↙ 方向）上 行+列 相同：(0,2)(1,1)(2,0) 都是 2。把见过的值存进集合，新格子的 r−c、r+c 一查便知有没有前辈。'},
    {q:'n=2、n=3 为什么无解？',
     a:'2×2 放 2 个皇后必然同列或同斜线；3×3 第一行放中间，第二行左右两格都被斜线打，放边上第二行只剩一格且第三行必被夹死。n=1 有 1 个解，n≥4 才开始有解——所以预设里放了 n=3 当反例。'},
    {q:'复杂度？',
     a:'时间 O(n!) 量级：第 1 行 n 个候选、第 2 行最多 n−1 个……三集合剪枝把"试一格查安全"降到 O(1)，远好于暴力。空间 O(n)：三个集合 + 递归栈（棋盘本身 O(n²)，不计入返回值）。'}
  ],

  complexity: '时间 O(n!) 量级（三集合剪枝）　·　空间 O(n)（集合 + 递归栈，棋盘 O(n²)）',

  form: [
    {key:'n', label:'n', type:'num', def:4}
  ],
  presets: [
    {label:'n=4（经典 → 2 个解）', values:{n:4}},
    {label:'n=1（边界 → 1 个解）', values:{n:1}},
    {label:'n=3（无解！）', values:{n:3}}
  ],

  code: `class Solution:
    def solveNQueens(self, n):
        ans = []
        grid = [['.'] * n for _ in range(n)]
        col, d1, d2 = set(), set(), set()   # 列 / 主对角线(r-c) / 副对角线(r+c)
        def dfs(r):                  # 逐行放: 本行试每一列
            if r == n:               # n 行都放好 → 找到一个解
                ans.append([''.join(row) for row in grid])
                return
            for c in range(n):
                if c in col or (r - c) in d1 or (r + c) in d2:
                    continue         # 被攻击 → 跳过
                col.add(c); d1.add(r - c); d2.add(r + c)
                grid[r][c] = 'Q'     # 放置
                dfs(r + 1)           # 下一行
                grid[r][c] = '.'     # 撤销
                col.discard(c); d1.discard(r - c); d2.discard(r + c)
        dfs(0)
        return ans
`,

  sol(input){
    const n = Math.max(1, Math.min(4, Math.round(Number(input.n) || 1)));
    const ans = [];
    const col = new Set(), d1 = new Set(), d2 = new Set();
    const grid = Array.from({length:n}, () => Array(n).fill('.'));
    (function dfs(r){
      if(r === n){ ans.push(grid.map(row => row.join(''))); return; }
      for(let c = 0; c < n; c++){
        if(col.has(c) || d1.has(r - c) || d2.has(r + c)) continue;
        col.add(c); d1.add(r - c); d2.add(r + c);
        grid[r][c] = 'Q';
        dfs(r + 1);
        grid[r][c] = '.';
        col.delete(c); d1.delete(r - c); d2.delete(r + c);
      }
    })(0);
    return ans;
  },
  expected: [['.Q..','...Q','Q...','..Q.'], ['..Q.','Q...','...Q','.Q..']],

  quiz: [
    {q:'棋盘上已放了一个皇后 Q(1,3)（n=4）。下面哪个格子是<b>安全</b>的、可以再放一个皇后?',
     options:['(2,2)：斜线不挨着','(2,1)：列、r−c、r+c 都没撞上','(3,3)：离得够远','(0,3)：在她正上方两格'],
     answer:1,
     explain:'Q(1,3) 占住的三条线:列 3、主对角线 r−c=−2、副对角线 r+c=4。逐一验货:(2,2) 的 r+c=4 撞副对角线;(3,3) 同列 3;(0,3) 同列 3 且 "正上方" 本来就在她的垂直攻击线上——离得远可挡不住皇后;(2,1) 列 1、r−c=1、r+c=3 全都干净 → <b>安全</b>。记住口诀:判安全不看距离,只查这三条线有没有被登记过。',
     jumpTo:5},
    {q:'代入算一算:n=4 时,ans 里收到的<b>第一个</b>解,第 0 行的皇后在哪一列?',
     options:['第 0 列——循环总是先试最左边','第 1 列——c=0 的分支整棵子树都走完仍无解,回溯挪位后才轮到 c=1','第 2 列','第 3 列'],
     answer:1,
     explain:'动画真实过程:Q(0,0) 放下后,第 1 行只剩 c=2 可放,再往下第 2 行三本账把所有列拦光 → 整棵子树报废,回溯拿走 Q(0,0);接着试 c=1,这才一路顺到底收出第一个解 [".Q..","...Q","Q...","..Q."]。dfs 是深度优先:某列的失败不代表整体失败,要等它<b>所有</b>后代都试完才换下一列——这就是"找全所有解"的代价,也是 O(n!) 的来源。',
     jumpTo:37},
    {q:'判一格安不安全,「和已放的每个皇后逐个算斜率/比列」也能做,为什么改用 col/d1/d2 三个集合?',
     options:['集合占的内存更小','逐个比是 O(已放皇后数);集合查一次 O(1),而且账本记的是「整条线」——此后任何格子踩到这三条线之一,不用知道是谁在打就被拦下','集合不会溢出,数组会'],
     answer:1,
     explain:'三个集合把"谁在攻击我"压缩成"这条线空不空":列号、r−c、r+c 各查一次就是 O(1)。r−c 可能是负数,但负数同样是合法的线号,集合不挑。扫描法正确性没问题,只是每格判定都变慢,在 n! 量级的搜索树上,这个常数差距会被指数放大——回溯提速的经典套路就是"把重复的几何判断换成一次性的登记账本"。',
     jumpTo:5},
  ],

  steps(input){
    const F = [];
    const n = Math.max(1, Math.min(4, Math.round(Number(input.n) || 1)));
    const clipped = Number(input.n) !== n;
    const grid = Array.from({length:n}, () => Array(n).fill('.'));
    const col = new Set(), d1 = new Set(), d2 = new Set();
    const ans = [], sols = [];
    let seq = 0;
    const stack = [];

    const snapB = () => grid.map(r => r.slice());
    const stOf = (extra, allDone) => {
      const st = {};
      for(let r = 0; r < n; r++) for(let c = 0; c < n; c++)
        if(grid[r][c] === 'Q') st[r + ',' + c] = allDone ? 'done' : 'in';
      if(extra) Object.assign(st, extra);
      return st;
    };
    const sCol = () => Array.from(col).sort((a, b) => a - b).map(String);
    const sD1 = () => Array.from(d1).sort((a, b) => a - b).map(String);
    const sD2 = () => Array.from(d2).sort((a, b) => a - b).map(String);

    const draw = (o) => (v) => {
      v.grid('B', o.mat, {label:'棋盘 ' + n + '×' + n + '　·　' + (o.glab || '蓝 Q = 已放上、暂未撤销的皇后'), states:o.st, cw:48});
      v.set('C', o.col, {label:'<code>col</code> 已占的列', color:'o'});
      v.set('R', o.d1, {label:'<code>d1</code> 主对角线（r−c）', color:'v'});
      v.set('A', o.d2, {label:'<code>d2</code> 副对角线（r+c）', color:'b'});
      v.stack('S', o.stk, {label:'递归调用栈　·　一层 = 一行', topTag:'栈顶', states:o.sst || {}});
      if(o.res !== undefined) v.result(o.res, {label:'全部解'});
    };

    function dfs(r){
      const id = 'f' + (++seq);
      stack.push({key:id, val:'dfs(r=' + r + ')'});
      if(r === n){
        const sol = grid.map(row => row.join(''));
        ans.push(sol); sols.push(sol);
        F.push({hl:[6,7,8,9], ok:8, tag:'找到一个解！', cls:'t-green',
          msg:'r = ' + n + ' = n：0 ~ ' + (n - 1) + ' 行每行恰好站了一个皇后，而每一步放置前都查过三本账——所以这份摆法<b>天然合法</b>，直接 <code>ans.append</code> 收下第 ' + ans.length + ' 个解 ' + JSON.stringify(sol) + '，棋盘全绿。收完<b>照样 return 回溯</b>：第 ' + n + ' 行没有格子可放，回上层让上面的皇后挪个位置——找一个解靠递归，找<b>全</b>所有解靠每层把剩下的列继续试完。',
          do: draw({mat:snapB(), st:stOf(null, true), glab:' · 第 ' + ans.length + ' 个解，全绿！',
                    col:sCol(), d1:sD1(), d2:sD2(), stk:stack.slice(), sst:{[id]:'just'}})});
        stack.pop();
        return;
      }
      F.push({hl:[6,7], no:7, tag:'进入第 ' + r + ' 行', cls:'t-blue',
        msg:'进入 <code>dfs(r=' + r + ')</code>，一层递归只管一行：n 个皇后挤 n 行，每行必须<b>恰好放一个</b>（少放一行就永远凑不齐 n 个），所以本层唯一的决策就是"第 ' + r + ' 行放哪一列"。当前局势：前 ' + r + ' 行的蓝色 Q 已站好，占用的列 col = {' + sCol().join(', ') + '}、主对角线 d1 = {' + sD1().join(', ') + '}、副对角线 d2 = {' + sD2().join(', ') + '}。接下来 for 循环把第 0 ~ ' + (n - 1) + ' 列<b>每一列都试一遍</b>——不是找到一个能放的就完事，别的列可能长出完全不同的解。',
        do: draw({mat:snapB(), st:stOf(), glab:' · 当前行 r=' + r,
                  col:sCol(), d1:sD1(), d2:sD2(), stk:stack.slice(), sst:{[id]:'active'}})});

      let pend = -1;   // 刚从子层返回、还没"视觉撤销"的皇后所在列
      for(let c = 0; c < n; c++){
        let merged = '';
        if(pend >= 0){
          grid[r][pend] = '.'; col.delete(pend); d1.delete(r - pend); d2.delete(r + pend);
          merged = '第 ' + r + ' 行 c=' + pend + ' 的子层返回了 → 拿走 Q(' + r + ',' + pend + ')、三本账划掉；';
          pend = -1;
        }
        const hitC = col.has(c), hit1 = d1.has(r - c), hit2 = d2.has(r + c);
        const reasons = [
          hitC ? '列 ' + c + ' 被占' : '',
          hit1 ? '主对角线 ' + (r - c) + ' 被占' : '',
          hit2 ? '副对角线 ' + (r + c) + ' 被占' : ''
        ].filter(Boolean).join('、');
        if(hitC || hit1 || hit2){
          F.push({hl: merged ? [16,17,10,11,12] : [10,11,12], no:12, tag:'冲突·跳过', cls:'t-red',
            msg: merged + '试 c=' + c + '：<b>' + reasons + '</b>——皇后横竖斜都能打，' +
                (hitC
                  ? (function(){ for(let rr = 0; rr < r; rr++) if(grid[rr][c] === 'Q') return '同列的 <b>Q(' + rr + ',' + c + ')</b>'; return '已占的列'; })()
                  : hit1
                    ? (function(){ for(let rr = 0; rr < r; rr++){ const cc = rr - (r - c); if(cc >= 0 && cc < n && grid[rr][cc] === 'Q') return '主对角线（r−c=' + (r - c) + '）上的 <b>Q(' + rr + ',' + cc + ')</b>'; } return '已占的主对角线'; })()
                    : (function(){ for(let rr = 0; rr < r; rr++){ const cc = (r + c) - rr; if(cc >= 0 && cc < n && grid[rr][cc] === 'Q') return '副对角线（r+c=' + (r + c) + '）上的 <b>Q(' + rr + ',' + cc + ')</b>'; } return '已占的副对角线'; })()) +
                ' 的攻击线正罩着这格，放下去必被吃 → 闪红警告，<code>continue</code> 试下一列。注意判定的代价：只查了三个集合各一次（O(1)），完全不用回头扫棋盘找"是谁在打它"——这正是花一下登记三条线换来的回报。',
            do: draw({mat:snapB(), st:stOf({[r + ',' + c]:'block'}), glab:' · 当前行 r=' + r,
                      col:sCol(), d1:sD1(), d2:sD2(), stk:stack.slice(), sst:{}})});
          continue;
        }
        col.add(c); d1.add(r - c); d2.add(r + c);
        grid[r][c] = 'Q';
        F.push({hl: merged ? [16,17,13,14,15] : [13,14,15], tag:'放置·递归', cls:'t-orange',
          msg: merged + 'c=' + c + ' 三本账都干净 → 放！先把三条攻击线写进账本：col 收下列 ' + c + '、d1 收下 r−c=' + (r - c) + '、d2 收下 r+c=' + (r + c) + '（r−c 可能是负数——负数同样是合法的"线号"），再放上橙色 <b>Q(' + r + ',' + c + ')</b>。账本记的是<b>整条线</b>而不是单个格子：今后任何格子只要踩到这三条线之一就会被拦下。随后递归 <code>dfs(r=' + (r + 1) + ')</code> 去摆下一行。',
          do: draw({mat:snapB(), st:stOf({[r + ',' + c]:'active'}), glab:' · 当前行 r=' + r + '，刚放 (' + r + ',' + c + ')',
                    col:sCol(), d1:sD1(), d2:sD2(), stk:stack.slice(), sst:{[id]:'active'}})});
        dfs(r + 1);
        pend = c;
      }
      if(pend >= 0){
        grid[r][pend] = '.'; col.delete(pend); d1.delete(r - pend); d2.delete(r + pend);
        F.push({hl:[16,17], tag:'回溯·恢复', cls:'t-violet',
          msg:'第 ' + r + ' 行放在 c=' + pend + ' 后，子层把 ' + n + ' 列全试了一遍仍空手而归——根子在这个位置本身：不管下面怎么摆，总差一行放不下 → <b>Q(' + r + ',' + pend + ') 此路不通，回溯</b>：拿走皇后（变紫），三本账划掉 ' + pend + '、' + (r - pend) + '、' + (r + pend) + '。<b>为什么必须划账？</b>这三条线是被这个皇后挡住的，皇后撤了线就空了；留着不删它就成了"幽灵皇后"，让之后的分支被误判"被占"，白白漏解。<b>回溯为什么能保证不漏解？</b>每一行都从第 0 列到第 n−1 列一个不落地试，任何合法摆法在这一行选的列迟早会被轮到，且轮到时账本一定与它完全吻合（此前的撤销从没留残留）——所以每个解都必然被收进 ans。第 ' + r + ' 行后面没有列可试了 → return 回上一行，让上一行换下一个位置。',
          do: draw({mat:snapB(), st:stOf(), glab:' · 当前行 r=' + r + ' 已清空',
                    col:sCol(), d1:sD1(), d2:sD2(), stk:stack.slice(), sst:{}})});
      }
      stack.pop();
    }

    F.push({hl:[1,2,3,4,5,18], tag:'初始化', cls:'t-grey',
      msg:'n 皇后规则：任意两个皇后<b>不同列、不同斜线</b>；同行不用担心——每层 dfs 只放一个皇后，行冲突被"一行一层"的结构直接消灭。列好记账：<code>col</code> 记下占过的列号就行。斜线要靠数学当<b>身份证</b>：同一条 ↘ 主对角线上，每走一格行、列同时 +1，<b>r−c 永远不变</b>（(0,0)(1,1)(2,2) 全是 0），而不同 ↘ 线的 r−c 必不相同——所以 r−c 唯一标记一条主对角线；同理 ↙ 线上 <b>r+c 永远不变</b>（(0,2)(1,1)(2,0) 全是 2）。于是 <code>d1</code>/<code>d2</code> 只记"见过哪些 r−c、r+c"，新格子查三个集合、O(1) 便知安不安全——比"和每个历史皇后逐个算斜率"又快又稳。' + (clipped ? '（n 限制在 1~4 内演示）' : ''),
      do: draw({mat:snapB(), st:stOf(), glab:' · 空棋盘', col:[], d1:[], d2:[], stk:[]})});

    dfs(0);

    F.push({hl:[19], tag:'总结', cls:'t-dark',
      msg:(sols.length
        ? '全部找完：<b>' + sols.length + ' 个解</b> —— ' + sols.map(s => JSON.stringify(s)).join('　和　') + '。敢说"找全"的底气：每一行都把所有列试过、每次失败都干净撤销（不留幽灵皇后），等于把决策树的每个分叉都亲自走到过。'
        : '全部试完：一个解都没有（n=' + n + ' 时皇后们注定互相攻击，<code>ans</code> 为空）。这不是程序出错——每个分支都被认真试过又干净撤销，才敢断言无解。') +
        '逐行放置把"同行冲突"交给结构消灭，r−c / r+c 两条账本把斜线检查降到 O(1)——回溯题的标准提速套路。',
      do: (v) => {
        v.text('X', sols.length
          ? sols.map((s, i) => '<b>解 ' + (i + 1) + '</b>：' + s.map(row => '<code>' + row + '</code>').join('　')).join('<br>')
          : 'n=' + n + ' 时无解：皇后数太多，棋盘太小。', {label:'答案一览', html:true});
        v.result(sols.slice(), {label:'solveNQueens 返回'});
      }});

    return F;
  }
});
</script>
