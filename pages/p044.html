<script>
LC.register({
  order: 44, num: 199, title: '二叉树的右视图', diff: '中等', cat: '二叉树',
  method: 'rightSideView',

  lede: '题目：站在树的<b>右侧往左看</b>，把每一层"最靠右"的那个节点从上到下记下来。' +
        '套路完全是层序遍历（P040）那一套：队列 <span class="var r">q</span> 一轮弹一整层，' +
        '弹之前先 <span class="var i">n = len(q)</span> 把本层人数拍死——<b>本轮第 n 个（本层最后一个）就是右视图看到的</b>，' +
        '记下它，其余照常把孩子排进队尾。',

  roles: [
    {c:'orange', code:'active', text:'刚出队、正在处理的节点'},
    {c:'blue',   code:'in',     text:'在队列里排队'},
    {c:'green',  code:'done',   text:'处理完毕'},
    {c:'violet', code:'target', text:'本层最后一个 · 右视图可见'}
  ],

  codeTitle: '跟着高亮读代码——第 13 行 <code>i == n-1</code> 是灵魂：变<span style="color:var(--green)">绿</span>＝本轮最后一个，记进 ans；变<span style="color:var(--red)">红</span>＝中间的节点，右侧看不到，只管把孩子入队。',

  legend: [
    {c:'orange', text:'node 刚出队'},
    {c:'blue', text:'还在队列里'},
    {c:'violet', text:'本层最后一个（记入 ans）'}
  ],

  idea: '层序遍历照旧，唯一附加动作：每层弹到第 n 个（i == n-1）时把它的值记进 ans——那就是右侧能看到的一切。',

  qa: [
    {q:'为什么"每层最后一个"就是右视图？',
     a:'层序队列里同一层的节点严格按从左到右排列（先左孩子后右孩子入队）。站在右边看，同层节点互相遮挡，只有最右那个露出来——恰好就是出队顺序里的第 n 个。'},
    {q:'DFS 能做吗？',
     a:'能：根 → 右 → 左的先序遍历，每达到一个"新深度"就把当前值放进 ans 对应位置（该深度第一次到达的一定是最右边的）。两种都 O(n)；BFS 版和"取每层最后一个"的直觉完全对齐，更好讲。'},
    {q:'n = len(q) 忘了写会怎样？',
     a:'队列会边弹边长，孩子混进本层，"最后一个"就永远算不准。先拍死 n，本轮 for 只弹 n 个，孩子全留给下一轮——这就是分层的关键（和 P040 同款技巧）。'},
    {q:'空树 / 单节点呢？',
     a:'空树在第 5 行直接 return []；单节点只有一层，n = 1、i = 0 = n-1 成立，根自己就是右视图 [根值]。'}
  ],

  complexity: '时间 O(n)（每节点进出队各一次）　·　空间 O(w)（队列最宽一层，最坏 O(n)）',

  form: [
    {key:'root', label:'root', type:'tree', def:[1,2,3,null,5,null,4]}
  ],
  presets: [
    {label:'[1,2,3,null,5,null,4]', values:{root:[1,2,3,null,5,null,4]}},
    {label:'满二叉树 [1,2,3,4,5,6,7]', values:{root:[1,2,3,4,5,6,7]}},
    {label:'左斜链 [1,2,null,3]（每层一个）', values:{root:[1,2,null,3]}},
    {label:'单节点 [1]', values:{root:[1]}},
    {label:'空树 []', values:{root:[]}}
  ],

  code: `from collections import deque

class Solution:
    def rightSideView(self, root):
        if not root:                     # 空树: 谁也看不到
            return []
        q = deque([root])                # 队列: 正在处理的这一层
        ans = []
        while q:                         # 一轮 = 完整一层
            n = len(q)                   # 先拍死本层人数
            for i in range(n):
                node = q.popleft()       # 从左往右依次出队
                if i == n - 1:           # 本层最后一个 = 右侧能看到
                    ans.append(node.val)
                if node.left:            # 孩子排进下一层
                    q.append(node.left)
                if node.right:
                    q.append(node.right)
        return ans
`,

  sol(input){
    const T = Viz.parseTree(input.root || []);
    const byKey = {}; T.nodes.forEach(n => byKey[n.key] = n);
    if(T.root == null) return [];
    const q = [T.root], ans = [];
    while(q.length){
      const n = q.length;
      for(let i = 0; i < n; i++){
        const k = q.shift();
        if(i === n - 1) ans.push(byKey[k].val);
        if(byKey[k].left != null) q.push(byKey[k].left);
        if(byKey[k].right != null) q.push(byKey[k].right);
      }
    }
    return ans;
  },
  expected: [1, 3, 4],

  quiz: [
    {q:'右视图是不是就是「从根开始一路只走右孩子」的那条链?',
     options:['是,最右边看到的当然全在右孩子链上','不是——某层最右的节点可能挂在左侧子树里;如 [1,2,3,4,null,null,null],第 3 层只有 4(挂在左边),右视图是 [1,3,4],只走右链会漏掉 4','不是,应该取每层的第一个节点'],
     answer:1,
     explain:'右视图的定义是"每层最靠右的节点",而"最靠右"和"是不是右孩子"是两回事:某层可能只剩左子树的幸存者。反例 [1,2,3,4,null,null,null]:节点 3 没有孩子,但 2 的左孩子 4 站在第 3 层最右,站在右侧看得清清楚楚 → [1,3,4]。只走右孩子链到 3 就断了,漏掉 4。所以必须逐层检查,谁在本层排最后谁入选。',
     jumpTo:35},
    {q:'把输入换成满二叉树 [1,2,3,4,5,6,7],返回的 ans 是?',
     options:['[1,3,4]','[1,2,3]','[1,3,7]'],
     answer:2,
     explain:'第 1 层 n=1,出队 1,i=0=n−1 → 记 1;第 2 层 n=2,出队 2、3,记最后的 3;第 3 层 n=4,出队 4、5、6、7,记最后的 7 → [1,3,7]。满二叉树每层最后一个是纯右孩子,ANS 恰好等于右孩子链,但这是巧合——一般树(见上一题反例)必须靠 i == n−1 逐层判。',
     jumpTo:39},
    {q:'解法二(DFS 根→右→左)里,为什么 depth == len(ans) 一成立,当前节点就是这一层最右的?',
     options:['因为递归每层只会访问一个节点','因为先右后左的顺序保证同一深度右边的永远先到:若这个深度还没记过,当前节点就是第一个到的,之后到的一律在它左边','因为 ans 每次会重新排序'],
     answer:1,
     explain:'根→右→左让"右边优先"在所有深度同时成立:任何时刻,深度 d 若还没被记过(len(ans) == depth),当前节点就是 d 层第一个被访问的,而它右边不可能还有同层的人——它就是最右的。len(ans) 恰好等于"下一个待首访的深度",记了 d 才可能轮到 d+1,所以 ans 天然从上到下有序;换成根→左→右,记出来的就是左视图了。',
     jumpTo:8},
  ],

  steps(input){
    const F = [];
    const T = Viz.parseTree(input.root || []);
    const t = Viz.treeLayout(input.root || []);
    const byKey = {}; T.nodes.forEach(n => byKey[n.key] = n);
    const q = [];                 // 队列: 存节点 key
    const doneSet = new Set();    // 处理完毕
    const view = [];              // 右视图节点 key
    const ans = [];               // 右视图值

    const nm = k => '节点' + LCesc(String(byKey[k].val));
    const snapDone = () => Array.from(doneSet);
    const snapView = () => view.slice();
    const ansText = () => ans.length
      ? 'ans = [<b>' + ans.map(x => LCesc(String(x))).join(', ') + '</b>]'
      : 'ans = []（还没有节点被记入）';

    /* ★ 快照原则：q/done/view/ans 全部在 push 时切片定死，do() 只读快照 o */
    const draw = o => (v) => {
      const states = {};
      (o.done || []).forEach(k => { states[k] = 'done'; });
      (o.q || []).forEach(k => { if(states[k] == null) states[k] = 'in'; });
      if(o.cur != null) states[o.cur] = 'active';
      (o.view || []).forEach(k => { states[k] = 'target'; });
      v.tree('T', t, {label:'二叉树　·　紫 = 右视图看到的节点', states});
      const qn = (o.q || []).map(k => ({key:'n' + k, val: byKey[k].val}));
      const ptrs = [];
      if(qn.length){
        ptrs.push({key:'n' + o.q[0], text:'▼ 队首', cls:'mi'});
        if(o.q.length > 1) ptrs.push({key:'n' + o.q[o.q.length - 1], text:'▼ 队尾', cls:'mg'});
      }
      if(o.lastTag && o.q.length) ptrs.push({key:'n' + o.q[0], text:'▼ 本层最后一个', cls:'mv'});
      v.list('Q', qn, {label:'队列 <code>q</code>　·　左端出队(popleft)、右端入队', pointers: ptrs});
      if(o.vars) v.vars('vars', o.vars, {label:'本轮进度', hl:o.hlVars || []});
      if(o.ansText != null) v.text('ans', o.ansText, {html:true, label:'<code>ans</code>　·　已看到的值'});
      if(o.result != null) v.result(o.result, {label:'右视图'});
    };

    F.push({hl:[1,3,4], tag:'读题', cls:'t-grey',
      msg:'站在树右侧往左看，同一层的节点会互相遮挡，只有<b>最靠右</b>的那个露出来——把每层这个「幸存者」从上到下记下来就是答案。做法 = 层序遍历 + 一个小心思：队列一轮弹完整一层，弹到<b>本层最后一个</b>时把它的值记进 ans。画面上紫色就是被选中的「本层最后一个」。',
      do: draw({q:[], done:[], view:[], ansText: ansText()})});

    F.push({hl:[5,6], ok: T.root == null ? 5 : undefined, no: T.root != null ? 5 : undefined,
      tag:'根检查', cls: T.root == null ? 't-green' : 't-blue',
      msg: T.root != null
        ? '第 5 行 <code>not root</code> 不成立 → 树有货，开工。这一行是给空树兜底的：不判的话，下一行 <code>deque([root])</code> 会把 None 塞进队列，后面代码直接崩。（第 6 行的 <code>return []</code> 就是空树的出口）'
        : '根是空的 → 第 6 行直接 <b>return []</b>：树一层都没有，站在右侧自然什么也看不到。',
      do: draw({q:[], done:[], view:[], ansText: ansText()})});

    if(T.root == null){
      F.push({hl:[6], tag:'返回空', cls:'t-dark',
        msg:'🎉 空树的右视图就是 <b>[]</b>：没有节点可看，一个空列表正好是「什么都没看到」的准确表达。',
        do: draw({q:[], done:[], view:[], ansText: ansText(), result: []})});
      return F;
    }

    q.push(T.root);
    F.push({hl:[7,8], tag:'建队列', cls:'t-blue',
      msg:'根' + nm(T.root) + '入队，它是第 1 层目前唯一的成员；<code>ans = []</code> 等着收货。队列的规矩：左端出队（popleft）、右端入队——<b>先发现的先处理</b>。这个规矩保证了同一层的节点在队列里严格从左到右排队（左孩子先于右孩子入队），「最后一个」的判断才有意义。▼ 队首、▼ 队尾两个箭头帮你定位。',
      do: draw({q: q.slice(), done: snapDone(), view: snapView(), vars:{层:'-', i:'-', n:'-'}, ansText: ansText()})});

    let d = 1;
    while(q.length){
      const n = q.length;
      F.push({hl:[9], ok:9, tag:'第 ' + d + ' 层开始', cls:'t-blue',
        msg:'while 检查：队列非空 → 还有第 <b>' + d + '</b> 层没处理。关键性质：此刻队列里装的全是第 ' + d + ' 层的节点（上一轮只弹了上一层、只塞进了这一层），而且从左到右排好了。一旦混进下一层的孩子，「本层最后一个」就会算错——所以下一帧要先做 n = len(q) 把本层封死。',
        do: draw({q: q.slice(), done: snapDone(), view: snapView(), vars:{层:d, i:'-', n:'待定'}, ansText: ansText()})});
      F.push({hl:[10], tag:'拍死本层人数', cls:'t-orange',
        msg:'<code>n = len(q) = ' + n + '</code>：先把本层人数<b>拍死</b>，本轮 for 只弹 ' + n + ' 个，期间新入队的孩子全留给下一轮。数一数队列面板：从左到右正是这 ' + n + ' 个节点，<b>第 ' + n + ' 个（i = ' + (n - 1) + '）就是本层最后一个</b>，也就是右视图要记的人。踩坑提醒：忘了拍 n、在 <code>while q</code> 里直接弹到空，孩子会混进本层，答案必错。',
        do: draw({q: q.slice(), done: snapDone(), view: snapView(), vars:{层:d, i:'-', n:n}, hlVars:['n'], ansText: ansText()})});

      for(let i = 0; i < n; i++){
        F.push({hl:[11], ok:11, tag:'for 第 ' + (i + 1) + ' / ' + n + ' 轮', cls:'t-ink',
          msg:'for 循环第 ' + (i + 1) + ' 轮（共 ' + n + ' 轮）：i = ' + i + '。队首' + nm(q[0]) + '即将出队——它此刻还站在队列最左端，先认清是谁要走了。每个节点出队后只做三件事：判断要不要记 ans → 左孩子入队 → 右孩子入队。',
          do: draw({q: q.slice(), done: snapDone(), view: snapView(), cur: q[0],
                    vars:{层:d, i:i, n:n}, ansText: ansText()})});
        const k = q.shift();
        F.push({hl:[12], tag:'出队', cls:'t-orange',
          msg:'<code>node = q.popleft()</code>：' + nm(k) + ' 离开队首，在树上由蓝（排队）变橙（处理中）。它是不是本层最后一个？马上用第 13 行的 <code>i == n-1</code> 来审。',
          do: draw({q: q.slice(), done: snapDone(), view: snapView(), cur: k,
                    vars:{层:d, i:i, n:n}, ansText: ansText()})});

        const isLast = (i === n - 1);
        F.push({hl:[13], ok: isLast ? 13 : undefined, no: isLast ? undefined : 13,
          tag:'本层最后?', cls: isLast ? 't-green' : 't-red',
          msg: isLast
            ? '<code>i = ' + i + ' == n - 1 = ' + (n - 1) + '</code> 成立！' + nm(k) + ' 是第 ' + d + ' 层<b>最后</b>一个——本层其余 ' + (n - 1) + ' 个节点都在它左边，站在右侧全被它挡住，只有它露出来。它的值马上进 ans。'
            : '<code>i = ' + i + ' ≠ n - 1 = ' + (n - 1) + '</code> 不成立 → ' + nm(k) + ' 右边还有 ' + (n - 1 - i) + ' 个同层兄弟排着队，会被它们挡住，右侧看不到它——跳过记录，只管接下来把孩子入队。',
          do: draw({q: q.slice(), done: snapDone(), view: snapView(), cur: k, lastTag: isLast,
                    vars:{层:d, i:i, n:n}, ansText: ansText()})});

        if(isLast){
          ans.push(byKey[k].val);
          view.push(k);
          F.push({hl:[14], tag:'记入 ans', cls:'t-green',
            msg:'<code>ans.append(' + LCesc(String(byKey[k].val)) + ')</code> → ans = [' + ans.map(x => LCesc(String(x))).join(', ') + ']。第 ' + d + ' 层的「代表」出炉，树上映紫色！每层都恰好在这里记一次，所以 <b>ans 的长度最终 = 树的层数</b>，而且天然按从上到下排列，不用再排序。',
            do: draw({q: q.slice(), done: snapDone(), view: snapView(), cur: k, lastTag: true,
                      vars:{层:d, i:i, n:n}, hlVars:['ans'], ansText: ansText()})});
        }

        const hasL = byKey[k].left != null, hasR = byKey[k].right != null;
        if(hasL) q.push(byKey[k].left);
        F.push({hl:[15,16], ok: hasL ? 15 : undefined, no: hasL ? undefined : 15,
          tag:'左孩子', cls: hasL ? 't-blue' : 't-grey',
          msg: hasL
            ? '第 15 行：' + nm(k) + ' 有左孩子 ' + nm(byKey[k].left) + ' → 排到<b>队尾</b>。左孩子自己哪怕"长得再靠左"，也是第 ' + (d + 1) + ' 层的候选——它属不属于右视图，轮到下一层用同样的办法判，这一层不做主。'
            : '第 15 行：' + nm(k) + ' 没有左孩子 → <code>if node.left</code> 不成立，跳过。这一侧的家族线到此为止，队列不会多出 phantom（幽灵）节点。',
          do: draw({q: q.slice(), done: snapDone(), view: snapView(), cur: k, lastTag: isLast,
                    vars:{层:d, i:i, n:n}, ansText: ansText()})});
        if(hasR) q.push(byKey[k].right);
        F.push({hl:[17,18], ok: hasR ? 17 : undefined, no: hasR ? undefined : 17,
          tag:'右孩子', cls: hasR ? 't-blue' : 't-grey',
          msg: hasR
            ? '第 17 行：右孩子 ' + nm(byKey[k].right) + ' 同样排到队尾，属于第 ' + (d + 1) + ' 层——注意入队顺序永远是先左后右，这维持着「同层从左到右」的队列次序。' + nm(k) + ' 三件事做完，标绿退休。'
            : '第 17 行：右孩子也没有 → ' + nm(k) + ' 是叶子，两个孩子都不入队，标绿收工。它这一支彻底结束。',
          do: draw({q: q.slice(), done: snapDone(), view: snapView(), cur: k, lastTag: isLast,
                    vars:{层:d, i:i, n:n}, ansText: ansText()})});
        doneSet.add(k);
      }
      d++;
    }

    F.push({hl:[9], no:9, tag:'队列空了', cls:'t-red',
      msg:'while 检查：队列空 → 所有层处理完毕，循环结束。复盘一下：<code>n = len(q)</code> 保证每轮只弹一层，<code>i == n-1</code> 保证每层只记最后一个——两个动作配合，任何节点都不会被漏数或重数。',
      do: draw({q:[], done: snapDone(), view: snapView(), ansText: ansText()})});

    F.push({hl:[19], tag:'返回结果', cls:'t-dark',
      msg:'🎉 <code>return ans</code> = <b>[' + ans.map(x => LCesc(String(x))).join(', ') + ']</b> —— 从上到下 ' + ans.length + ' 个值，正是站在右侧看到的画面。复杂度：每个节点进出队各一次，时间 O(n)；队列最宽时装完整一层，空间 O(w)。整个算法只比普通层序遍历多了 <code>i == n-1</code> 一个判断。',
      do: draw({q:[], done: snapDone(), view: snapView(), ansText: ansText(), result: ans.slice()})});

    return F;
  },

  /* ========= 解法二：力扣官方题解 · DFS 根→右→左（每个深度的首访） ========= */
  alt: {
    label: '官方 · DFS 根→右→左',
    method: 'rightSideView',

    lede: '还是同一道题，这次<b>不用队列</b>：官方题解方法二用<b>递归 DFS</b>，按「根 → 右 → 左」的顺序走——' +
          '同一深度里<b>右边的永远先被访问</b>，所以"深度 d 第一次到达的节点"必然是 d 层最右边的那个。' +
          '用 <code>depth == len(ans)</code> 判断"这个深度是不是第一次来"（右侧竖条就是递归调用栈），' +
          '首访的值按深度 0..max 依次落进 <span class="var o">ans</span>——顺序天然就是从上到下。',

    roles: [
      {c:'orange', code:'active', text:'当前正在访问的节点（首访瞬间=金橙高亮）'},
      {c:'blue',   code:'in',     text:'当前递归路径上的祖先'},
      {c:'violet', code:'target', text:'首访节点 · 已记入 ans（右视图）'},
      {c:'green',  code:'done',   text:'整棵子树访问完毕'}
    ],

    codeTitle: '解法二没有队列：右侧竖条是递归调用栈。盯住第 8 行 <code>depth == len(ans)</code>——变<span style="color:var(--green)">绿</span>＝这个深度第一次到达（先走右边，它就是最右节点），变<span style="color:var(--red)">红</span>＝深度早有代表，被挡住，跳过。',

    legend: [
      {c:'orange', text:'当前访问 / 首访瞬间'},
      {c:'blue', text:'递归路径上的祖先'},
      {c:'violet', text:'首访节点 = 右视图'},
      {c:'green', text:'访问完毕'}
    ],

    idea: '按「根→右→左」DFS：每个深度第一个被访问到的节点就是该深度最右的节点——depth == len(ans) 即首访，按深度 0..max 收集。',

    complexity: '时间 O(n)（每个节点访问一次）　·　空间 O(h)（递归栈，h 为树高；BFS 版是 O(w) 队列宽）',

    qa: [
      {q:'BFS 层序版（解法一）和 DFS 版怎么选？',
       a:'时间都是 O(n)；空间的形状不同：BFS 占"最宽一层" O(w)，DFS 占"最深一条路" O(h)。<b>宽扁树选 DFS 省内存，又高又瘦的树选 BFS 省内存</b>。面试里 BFS 版更好讲（"每层最后一个"直觉直给），DFS 版代码更短、连队列都不用建。'},
      {q:'为什么"每个深度第一个被访问的"就是最右的？',
       a:'遍历顺序是 根→右→左：任何时刻，同一深度的节点里<b>右边的永远先被访问</b>。所以 <code>depth == len(ans)</code>（这个深度还没记过）成立时，当前节点一定是该深度最右的；之后再到的一律在它左边，全部跳过。'},
      {q:'ans 为什么按下标天然有序？',
       a:'首访的深度只会恰好等于 <code>len(ans)</code>：先记深度 0，才可能轮到深度 1……所以 append 的顺序天然是"从上到下"，不需要排序，也不需要按层分桶——<code>ans[d]</code> 就直接是深度 d 的答案。'},
      {q:'换成 根→左→右 还能做吗？',
       a:'直接记就成"左视图"了。想拿右视图要么每层取最后一个（多此一举），要么老老实实 根→右→左——先右后左是这道题递归写法的全部秘密。'}
    ],

    code: `# 解法二:力扣官方题解 方法二 DFS(根→右→左)
class Solution:
    def rightSideView(self, root):
        ans = []                        # ans[d] = 深度 d 首访(最右)节点的值
        def dfs(node, depth):           # 每深度第一个到达的就是最右
            if not node:                # 递归出口: 空位直接返回
                return
            if depth == len(ans):       # 该深度第一次到达 = 最右节点
                ans.append(node.val)
            dfs(node.right, depth + 1)  # 先递归右子树
            dfs(node.left, depth + 1)   # 再递归左子树
        dfs(root, 0)                    # 从根、深度 0 出发
        return ans
`,

    sol(input){
      const T = Viz.parseTree(input.root || []);
      const byKey = {}; T.nodes.forEach(n => byKey[n.key] = n);
      const ans = [];
      function dfs(k, d){
        if(k == null) return;
        if(d === ans.length) ans.push(byKey[k].val);
        dfs(byKey[k].right, d + 1);
        dfs(byKey[k].left, d + 1);
      }
      dfs(T.root, 0);
      return ans;
    },
    expected: [1, 3, 4],

    steps(input){
      const F = [];
      const T = Viz.parseTree(input.root || []);
      const t = Viz.treeLayout(input.root || []);
      const byKey = {}; T.nodes.forEach(n => byKey[n.key] = n);
      const firstDep = new Map();     // key -> 首访深度(= 该深度最右节点)
      const doneSet = new Set();      // 整棵子树访问完毕
      const ans = [];                 // ans[d] = 深度 d 首访节点的值
      let callSeq = 0;

      const vName = k => k == null ? 'null' : '节点' + LCesc(String(byKey[k].val));
      const snapFirst = () => Array.from(firstDep.keys());
      const snapDone = () => Array.from(doneSet);
      const snapTags = () => { const o = {}; firstDep.forEach((d, k) => { o[k] = {text:'首访 d=' + d, cls:'mv'}; }); return o; };
      const ansText = () => ans.length
        ? ans.map((x, i) => '深度 <b>' + i + '</b> 的首访 → <b>' + LCesc(String(x)) + '</b>').join('<br>')
        : '<code>ans = []</code>（还没有任何深度被首访）';
      /* ★ 快照原则：first/done/tags/ans/stack/path/vars 全部在 push 那一刻求值定死 */
      const snapAll = () => ({first: snapFirst(), done: snapDone(), tags: snapTags(), ansText: ansText()});

      const draw = o => (v) => {
        const states = {};
        (o.done || []).forEach(k => { states[k] = 'done'; });
        (o.path || []).forEach(k => { states[k] = 'in'; });
        (o.first || []).forEach(k => { states[k] = 'target'; });
        if(o.cur != null) states[o.cur] = 'active';
        v.tree('T', t, {label:'二叉树　·　橙=当前访问(首访瞬间) 紫=首访·已记入 ans 绿=访问完毕', states, tags: o.tags || {}});
        const stack = o.stack || [];
        v.stack('S', stack, {
          label:'递归调用栈 <code>dfs(node, depth)</code>　·　越往下越新',
          states: stack.length ? {[stack[stack.length - 1].key]:'active'} : {},
          topTag:'栈顶'
        });
        if(o.vars) v.vars('vars', o.vars, {label:'深度与首访记录', hl:o.hlVars || []});
        v.text('ans', o.ansText, {html:true, label:'<code>ans</code>　·　按深度 0..max 收集'});
        if(o.result != null) v.result(o.result, {label:'右视图'});
      };

      function visit(k, depth, frames, path){
        const id = 'c' + (++callSeq);
        const stack = frames.concat([{key:id, val:'dfs(' + (k == null ? 'null' : vName(k)) + ', d=' + depth + ')'}]);
        if(k == null){
          F.push({hl:[6,7], ok:6, tag:'递归出口', cls:'t-grey',
            msg:'调用 <code>dfs(null, d=' + depth + ')</code>：上层节点在这个方向上没有孩子，走到了空位，<code>not node</code> 成立 → 什么都不记，直接返回。空位是递归的「悬崖边」，保证搜索不会无限下钻；每个节点最多产生两次这样的空调用。',
            do: draw(Object.assign(snapAll(), {stack, vars:{depth:depth, 'ans长度': ans.length}}))});
          return;
        }
        F.push({hl:[6], no:6, tag:'进入函数', cls:'t-blue',
          msg:'调用 <b>dfs(' + vName(k) + ', d=' + depth + ')</b>：节点存在，压栈。先别急着记——灵魂判断来了：<code>depth = ' + depth + '</code>，<code>len(ans) = ' + ans.length + '</code>，相等吗？相等 = 深度 ' + depth + ' 第一次到达（它就是这层最右的）；不相等 = 这层早有代表，它是被右边挡住的后来者。',
          do: draw(Object.assign(snapAll(), {stack, cur:k, path: path.concat(k), vars:{depth:depth, 'ans长度': ans.length}}))});
        if(depth === ans.length){
          const d0 = depth;
          ans.push(byKey[k].val);
          firstDep.set(k, depth);
          F.push({hl:[8,9], ok:8, tag:'首访!', cls:'t-green',
            msg:'<code>depth = ' + d0 + ' == len(ans) = ' + d0 + '</code> 成立 → 深度 ' + d0 + ' <b>第一次被访问</b>！为什么它就是最右的？因为代码先递归右子树，同一深度里右边的永远先到——' + vName(k) + ' 前面不可能还有同层的人。它的值落进 <code>ans[' + d0 + ']</code>，树上标紫挂「首访 d=' + d0 + '」名牌。ans 长度 +1，「下一个待首访的深度」也 +1，判断式永远自洽。',
            do: draw(Object.assign(snapAll(), {stack, cur:k, path: path.concat(k), vars:{depth:d0, 'ans长度': ans.length}, hlVars:['ans长度']}))});
        } else {
          F.push({hl:[8], no:8, tag:'深度已有主', cls:'t-red',
            msg:'<code>depth = ' + depth + ' &lt; len(ans) = ' + ans.length + '</code> → 深度 ' + depth + ' 早有主人（首访值 ' + LCesc(String(ans[depth])) + ' 已在 ans[' + depth + ']）。由于先右后左，先到的一定在' + vName(k) + ' 的<b>右边</b>——它被同层右边的兄弟挡住，右侧看不到。跳过，连 ans 都不碰。',
            do: draw(Object.assign(snapAll(), {stack, cur:k, path: path.concat(k), vars:{depth:depth, 'ans长度': ans.length}}))});
        }

        visit(byKey[k].right, depth + 1, stack, path.concat(k));
        F.push({hl:[10], tag:'右子树返回', cls:'t-green',
          msg:'第 10 行执行完：' + vName(k) + ' 的右子树整棵访问完毕，能记的首访都记好了。接着第 11 行递归<b>左</b>子树——左边节点能不能进 ans，取决于同一深度右边的兄弟有没有把首访占掉；没占到才轮到左边补位，占到了就全是白跑（DFS 只能老实走完）。',
          do: draw(Object.assign(snapAll(), {stack, cur:k, path: path.concat(k), vars:{depth:depth, 'ans长度': ans.length}}))});
        visit(byKey[k].left, depth + 1, stack, path.concat(k));
        doneSet.add(k);
        F.push({hl:[11], tag:'左子树返回 · 出栈', cls:'t-orange',
          msg:'第 11 行执行完：' + vName(k) + ' 的整棵子树都访问完毕，出栈——栈矮一格，控制权回到父节点。它在深度 ' + depth + ' 是否首访早已定死，之后不会再变。每个节点恰好进出栈各一次，这就是时间 O(n) 的来源。',
          do: draw(Object.assign(snapAll(), {stack: frames, path, vars:{depth:depth, 'ans长度': ans.length}}))});
      }

      F.push({hl:[1,2,3], tag:'读题', cls:'t-grey',
        msg:'解法二彻底换掉队列：按「根 → 右 → 左」做<b>递归 DFS</b>。直觉：站在右侧看，同一层里右边的总把左边的挡住——只要保证<b>右边的永远先被访问</b>，那么「每个深度第一个到的节点」就是右侧看到的那个。右侧竖条是递归调用栈，ans 按「深度 = 下标」从上到下收集，最后直接返回。',
        do: draw(Object.assign(snapAll(), {stack: []}))});
      F.push({hl:[4,5], tag:'初始化', cls:'t-grey',
        msg:'<code>ans = []</code>：<code>ans[d]</code> 将存放深度 d 首访节点的值。内层函数 <code>dfs(node, depth)</code> 每次都带着当前深度往下钻。记住一个恒等式：<code>len(ans)</code> 永远等于「下一个待首访的深度」——记了深度 0 才可能轮到深度 1，所以 ans 天然从上到下有序，不用排序也不用按层分桶。',
        do: draw(Object.assign(snapAll(), {stack: [], vars:{depth:'-', 'ans长度': 0}}))});
      F.push({hl:[12], tag:'启动', cls:'t-blue',
        msg:'<code>dfs(root, 0)</code>：从根、深度 0 出发。根必然是首访——深度 0 之前没有任何更早的访问者，而它就是第 0 层最右的节点，右视图的第一个值注定是根。之后每层都会考一遍灵魂判断 <code>depth == len(ans)</code>：这个深度，我是不是第一个来的？',
        do: draw(Object.assign(snapAll(), {stack: [], vars:{depth:0, 'ans长度': 0}}))});

      visit(T.root, 0, [], []);

      F.push({hl:[13], tag:'返回结果', cls:'t-dark',
        msg:'🎉 递归全部结束，<code>return ans</code> = <b>[' + ans.map(x => LCesc(String(x))).join(', ') + ']</b> —— 每个深度的首访节点连成一列，正是站在右侧看到的画面，全程没用队列。对比解法一：时间同为 O(n)，空间从「最宽一层 O(w)」换成「最深一条路 O(h)」——宽扁的树选 DFS 更省内存，又高又瘦的树选 BFS 更省。',
        do: draw(Object.assign(snapAll(), {stack: [], result: ans.slice()}))});

      return F;
    }
  }
});
</script>
