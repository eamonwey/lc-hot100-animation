<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P004 · 移动零 · 动画题解</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="wrap" id="app"></div>
<script src="../assets/problems.js"></script>
<script src="../assets/progress.js"></script>
<script src="../assets/viz.js"></script>
<script src="../assets/engine.js"></script>
<script>
LC.register({
  order: 4, num: 283, title: '移动零', diff: '简单', cat: '双指针',
  method: 'moveZeroes',

  lede: '题目：把数组里所有的 <b>0 挪到末尾</b>，非零数保持原来的先后顺序，而且要<b>原地改</b>（不另开新数组）。' +
        '动画里 <span class="var i">fast</span> 负责逐格探路捡东西，<span class="var o">slow</span> 是“非零区”的边界墙：' +
        '捡到非零数就和 slow 位置交换、slow 右移一格；遇到 0 则原地不动。一遍扫完，0 全被挤到右边。',

  roles: [
    {c:'green',  code:'slow', text:'非零区的墙：左边全是非零数'},
    {c:'orange', code:'fast', text:'探路指针：逐格检查'},
    {c:'red',    code:'0',    text:'中间被 0 暂时占着的缓冲区'}
  ],

  codeTitle: '跟着高亮读代码——<code>if nums[fast] != 0</code> 变<span style="color:var(--green)">绿</span>＝捡到非零数要交换，变<span style="color:var(--red)">红</span>＝是 0，直接放过。',

  legend: [
    {c:'green', text:'[0, slow) 已归位的非零区'},
    {c:'orange', text:'fast 正在探的格子'},
    {swatch:'var(--grey-soft)', text:'slow ~ fast 之间：全是 0 的缓冲区'}
  ],

  idea: 'fast 只管找非零数，找到就换到 slow 手里；slow 是非零区的墙、只进不退——一遍扫完，0 全被挤到右边。',

  qa: [
    {q:'交换过后，非零数的相对顺序为什么不会乱？',
     a:'fast 从左往右“先到先得”：先捡到的非零数先放进 slow 的位置，而 slow 只会往右走，所以 [0, slow) 里的非零数保持原来的先后顺序。被换出去的只是 0，反正它们最终就该待在右边，放在哪儿都无所谓。'},
    {q:'循环不变式是什么？',
     a:'每一轮开始时都保证：<b>[0, slow) 全是非零数且保持原序；[slow, fast) 全是 0；[fast, n) 还没看过</b>。fast 走到头时，非零区 + 零区正好铺满整个数组，任务完成。'},
    {q:'能不交换、直接覆盖再补 0 吗？',
     a:'可以：先遍历一遍把非零数依次覆盖到前面，再把 slow 之后的位置全部填 0。两趟写法也很好懂；交换版的优势是一趟完成、不会覆盖任何还没读过的数。'}
  ],

  complexity: '时间 O(n)（fast 每格只看一次）　·　空间 O(1)（原地双指针）',

  form: [
    {key:'nums', label:'nums', type:'arr', def:[0,1,0,3,12]}
  ],
  presets: [
    {label:'[0,1,0,3,12]', values:{nums:[0,1,0,3,12]}},
    {label:'[0]（单个 0）', values:{nums:[0]}},
    {label:'[0,0,0]（全是 0）', values:{nums:[0,0,0]}},
    {label:'[1,2,3]（没有 0）', values:{nums:[1,2,3]}},
    {label:'[4,2,0,1,0,3,0]（多 0 混合）', values:{nums:[4,2,0,1,0,3,0]}}
  ],

  code: `class Solution:
    def moveZeroes(self, nums):
        slow = 0                        # 墙: slow 左边全是排好的非零数
        for fast in range(len(nums)):   # fast 逐格探路
            if nums[fast] != 0:         # 捡到非零数?
                nums[slow], nums[fast] = nums[fast], nums[slow]  # 换到墙外
                slow += 1               # 非零区向右扩一格
`,

  sol(input){
    const nums = input.nums || [];
    let slow = 0;
    for(let fast = 0; fast < nums.length; fast++){
      if(nums[fast] !== 0){
        const tmp = nums[slow];
        nums[slow] = nums[fast];
        nums[fast] = tmp;
        slow++;
      }
    }
    return nums;
  },
  expected: [1,3,12,0,0],

  quiz: [
    {q:'fast 扫到 0 时,为什么「什么都不做」让它留在原地,而不是主动把它往右边换?',
     options:['0 数值太小,不值得处理','主动交换会把 0 提前塞进非零区,破坏「[0,slow) 全是非零且原序,[slow,fast) 全是 0」的不变式;留在原地当缓冲垫,等后面的非零数来和它换','因为 0 不允许被交换'],
     answer:1,
     explain:'这套算法的纪律是:非零数按扫到的先后被 slow 接进非零区,0 只当「垫在 slow 和 fast 之间的缓冲垫」。若手痒把 0 主动换到别处,缓冲区里混进非零数(或非零区混进 0),不变式当场破,最后顺序就乱。0 原地等着——后面每来一个非零数,交换时被顶出去的恰好就是个 0,各得其所。',
     jumpTo:3},
    {q:'nums = [0,0,1] 跑完这个算法,数组变成什么?',
     options:['[1,0,0]','[0,1,0]','[0,0,1]'],
     answer:0,
     explain:'fast=0 是 0、fast=1 也是 0,都原地放过,slow 一直停在 0;fast=2 捡到 1,和 slow 位置的 0 交换 → [1,0,0],slow 右移到 1。扫完 1 个非零数在左边保持原序,2 个 0 挤到右边。不是 [0,1,0]——那是「把 1 挪一格」的局部思路,双指针是把 1 直接换到非零区的墙边。',
     jumpTo:18},
    {q:'任何一轮循环开始时,slow 和 fast 之间的那段「缓冲区」里装的是什么?',
     options:['全是 0','全是非零数','0 和非零数混着,不用管'],
     answer:0,
     explain:'循环不变式:每一轮开始时 [0, slow) 全是非零数且保持原序,[slow, fast) 全是被挤出来的 0,[fast, n) 还没看过。fast 捡到非零数就和 slow 交换——被顶走的恰好是缓冲区里的一个 0,不变式继续成立;fast 走到头,非零区加零区正好铺满整个数组,0 全在右边。',
     jumpTo:2},
  ],

  steps(input){
    const F = [];
    const nums = input.nums.slice();
    let slow = 0;

    /* ★ 快照：states / marks 全部在 F.push 那一刻用当时的 slow、fast 算死 */
    const statesAt = (slow0, fast0) => {
      const st = {};
      nums.forEach((val, k) => {
        if(k < slow0) st[k] = 'done';
        else if(k < fast0) st[k] = 'stale';
      });
      if(fast0 < nums.length) st[fast0] = 'active';
      return st;
    };
    const marksAt = (slow0, fast0) => {
      const m = [];
      if(slow0 < nums.length) m.push({name:'slow', idx:slow0, cls:'mg', text:'▲ slow'});
      if(fast0 < nums.length) m.push({name:'fast', idx:fast0, cls:'mi', text:'▲ fast'});
      return m;
    };

    const draw = (o) => (v) => {
      v.arr('nums', nums, {label:'数组 <code>nums</code>（原地修改）',
        states:o.states || {}, markers:o.marks || []});
      if(o.vars) v.vars('vars', o.vars, {label:'变量'});
      if(o.result != null) v.result(o.result, {label:'返回结果'});
    };

    F.push({hl:[1,2,3], tag:'初始化', cls:'t-grey',
      msg:'<code>slow = 0</code>：非零区暂时是空的（绿色墙立在 0 号位，数组此刻还是原样）。分工明确：<b>fast 逐格探路，捡到非零数就和 slow 位置交换、墙右移一格；遇到 0 原地放过</b>。先把不变式立好：任何时刻 [0, slow) 全是非零数且保持原序，[slow, fast) 全是被挤出来的 0——只要每轮都守住它，fast 走到头时 0 自然全在右边。类比：fast 是拣货员，slow 是货架隔板，捡到货就塞到隔板前，隔板跟着右移。',
      do: draw({states:statesAt(0, 0), marks:marksAt(0, 0), vars:{slow:0, fast:0}})});

    for(let fast = 0; fast < nums.length; fast++){
      const val = nums[fast];

      F.push({hl:[4], tag:'探路', cls:'t-ink',
        msg:'<code>fast</code> 走到第 <b>' + fast + '</b> 格：<code>nums[fast] = ' + val + '</code>（橙色当前格）。读数：非零区已有 ' + slow + ' 个数（标绿、原序），slow 与 fast 之间隔着 ' + (fast - slow) + ' 格缓冲区（按不变式全是 0）。fast 只管往前探、从不开倒车，接下来只需回答一个问题：这格是 0 还是非 0？',
        do: draw({states:statesAt(slow, fast), marks:marksAt(slow, fast),
                  vars:{slow:slow, fast:fast, 'nums[fast]':val}})});

      const nz = val !== 0;
      F.push({hl:[5], ok: nz ? 5 : undefined, no: nz ? undefined : 5, tag:'判断',
        cls: nz ? 't-green' : 't-red',
        msg: nz
          ? '<code>' + val + ' ≠ 0</code> → 捡到非零数！它值得进非零区，而且必须放进 slow 位置——那是非零区的第一个空位，放这儿才能紧接在已有非零数后面、不破坏原序。马上交换；缓冲区里被顶走的是 0，反正它本来就该去右边，不心疼。'
          : '<code>nums[fast] = 0</code> → 是个 0，什么都不用做：它正好留在原地给缓冲区垫底，等后面的非零数来把它换到右边去，fast 自己继续走。踩坑提醒：千万别手痒去交换——0 提前混进非零区，"非零且原序"的不变式当场被破坏，最后顺序全乱。',
        do: draw({states:statesAt(slow, fast), marks:marksAt(slow, fast),
                  vars:{slow:slow, fast:fast, 'nums[fast]':val}})});

      if(nz){
        const self = slow === fast;
        const tmp = nums[slow];
        nums[slow] = val;
        nums[fast] = tmp;

        const stSwap = {};
        nums.forEach((v2, k) => {
          if(k < slow) stSwap[k] = 'done';
          else if(k === slow) stSwap[k] = 'just';
          else if(k <= fast) stSwap[k] = 'stale';
        });
        F.push({hl:[6], tag:'交换', cls:'t-orange',
          msg: self
            ? 'slow 和 fast 正好重合（都在第 ' + slow + ' 格）——说明这个非零数前面一个 0 都没有，缓冲区是空的：<code>nums[' + slow + ']</code> 自己和自己换、原地站好，<b>' + val + '</b> 直接落进非零区。这不是白做：开头连续非零时两个指针就会这样并排走。'
            : '<code>nums[' + slow + '] ⇄ nums[' + fast + ']</code>：<b>' + val + '</b> 换进非零区（黄色格），被顶出来的 ' + tmp + ' 是个 0，留在缓冲区等着去右边。为什么顺序不会乱：非零数按 fast 扫到的先后依次放进 slow 位置，先到先得、slow 只进不退——原序天然保住。',
          do: draw({states:stSwap, marks:marksAt(slow, fast),
                    vars:{slow:slow, fast:fast, 'nums[slow]':nums[slow]}})});

        slow++;
        F.push({hl:[7], tag:'墙右移', cls:'t-green',
          msg:'<code>slow = ' + slow + '</code>：绿墙右移一格，非零区扩到 ' + slow + ' 个数（绿色格）。复查不变式：[0, slow) 全是非零且原序，slow 到 fast 之间依然全是 0（刚被顶过去的那个 0 也在其中）——每轮都成立，归纳到 fast 走完，前 slow 位就是全部非零数、后面全是 0，任务必成。',
          do: draw({states:statesAt(slow, fast), marks:marksAt(slow, fast),
                    vars:{slow:slow, fast:fast}})});
      }
    }

    const endStates = {};
    nums.forEach((v2, k) => { endStates[k] = k < slow ? 'done' : 'muted'; });
    F.push({hl:[7], tag:'原地完成', cls:'t-dark',
      msg:'fast 扫完整组：<b>' + slow + ' 个非零数保持原顺序排在左边（绿色），' + (nums.length - slow) + ' 个 0 全被挤到右边（灰色）</b> 🎉 数组被原地改好——<b>原题不返回任何值，nums 本身就是答案</b>；全程没开第二个数组。复盘：fast 每格只看一次是 O(n) 时间；只用了 slow 指针和一个交换暂存，O(1) 空间——双指针的"分区"套路：一个负责探路，一个守住边界。',
      do: draw({states:endStates, marks:marksAt(slow, nums.length),
                vars:{slow:slow, fast:nums.length}, result:null})});
    return F;
  }
});
</script>
