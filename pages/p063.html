<script>
LC.register({
  order: 63, num: 74, title: '搜索二维矩阵', diff: '中等', cat: '二分查找',
  method: 'searchMatrix',

  lede: '题目：矩阵每行内部升序，而且<b>下一行开头 &gt; 上一行末尾</b>——把它按行拉直，就是一条严格递增的一维数列！' +
        '所以整个矩阵可以<b>拉直成数组做标准二分</b>：<span class="var o">mid</span> 是一维下标，' +
        '用 <code>mid//n</code> 求行、<code>mid%n</code> 求列换算回矩阵。' +
        '动画上方是一维视图、下方是原矩阵，<b>两个视图同步高亮</b>，换算口诀每轮都现场演一遍。',

  roles: [
    {c:'blue',   code:'left',  text:'一维区间左端'},
    {c:'orange', code:'mid',   text:'本轮中点（一维下标）'},
    {c:'violet', code:'right', text:'一维区间右端'},
    {c:'green',  code:'(r,c)', text:'mid 换算出的矩阵格子：r = mid//n，c = mid%n'}
  ],

  codeTitle: '跟着高亮读代码——第 7 行是灵魂：一维下标 → 行列的换算。' +
             '第 8 行变<span style="color:var(--green)">绿</span>＝命中返回 True；第 10 行绿＝太小去右半、第 12 行绿＝太大去左半。',

  idea: '行末 < 下一行行首 ⇒ 拉直即有序：把 m×n 矩阵当长度 m·n 的有序数组二分，mid//n 是行、mid%n 是列。',

  qa: [
    {q:'凭什么敢把矩阵拉直？',
     a:'题目保证两件事：行内升序 + 后一行的开头 &gt; 前一行的结尾。两条合起来，按行拼接后整条严格递增——一维二分的前提"有序"成立。注意 LC 240"搜索二维矩阵 II"（只有每行每列各自升序）不满足第二条，就不能这么拉直。'},
    {q:'mid//n 和 mid%n 怎么理解？',
     a:'每行摆 n 个数：mid ÷ n 的<b>商</b> = 走完了几整行（行号 r），<b>余数</b> = 在当前行走到第几个（列号 c）。例如 mid=5、n=4：5//4=1 行、5%4=1 列 → matrix[1][1]。反过来也成立：格子 (i,j) 拉直后是第 i×n+j 个。'},
    {q:'和"逐行二分"比呢？',
     a:'逐行二分是 O(m·log n)：先扫每行判断在不在范围，再行内二分。拉直二分一次 O(log(mn)) ≈ O(log m + log n)，代码还更短。两者都远好于 O(mn) 暴力扫描。'},
    {q:'复杂度？',
     a:'时间 O(log(mn))：候选每轮减半；空间 O(1)：只有左右中点三个下标。注意拉直是"逻辑上"的——代码里从没真的复制数组，全靠下标换算。'}
  ],

  complexity: '时间 O(log(mn))　·　空间 O(1)',

  form: [
    {key:'matrix', label:'matrix（每行一行）', type:'grid', maxRows:4, maxCols:4, def:[[1,3,5,7],[10,11,16,20],[23,30,34,60]]},
    {key:'target', label:'target', type:'num', def:3}
  ],
  presets: [
    {label:'target=3（默认 → true）', values:{matrix:[[1,3,5,7],[10,11,16,20],[23,30,34,60]], target:3}},
    {label:'target=16 → true', values:{matrix:[[1,3,5,7],[10,11,16,20],[23,30,34,60]], target:16}},
    {label:'target=60 → true（最后一个）', values:{matrix:[[1,3,5,7],[10,11,16,20],[23,30,34,60]], target:60}},
    {label:'target=4 → false（不存在）', values:{matrix:[[1,3,5,7],[10,11,16,20],[23,30,34,60]], target:4}}
  ],

  code: `class Solution:
    def searchMatrix(self, matrix, target):
        m, n = len(matrix), len(matrix[0])
        left, right = 0, m * n - 1      # 拉直后的一维下标
        while left <= right:
            mid = (left + right) // 2
            val = matrix[mid // n][mid % n]   # 一维 → 行列
            if val == target:
                return True
            if val < target:            # 中点太小 → 去右半
                left = mid + 1
            else:                       # 中点太大 → 去左半
                right = mid - 1
        return False
`,

  sol(input){
    const matrix = (input.matrix || []).map(r => (r || []).map(Number));
    const target = Number(input.target);
    const m = matrix.length, n = m ? matrix[0].length : 0;
    if(!m || !n) return false;
    let left = 0, right = m * n - 1;
    while(left <= right){
      const mid = (left + right) >> 1;
      const val = matrix[Math.floor(mid / n)][mid % n];
      if(val === target) return true;
      if(val < target) left = mid + 1;
      else right = mid - 1;
    }
    return false;
  },
  expected: true,

  quiz: [
    {q:'什么前提下,才敢把整个矩阵拉直成一条有序数组做二分?',
     options:['只要每行内部升序就够了','行内升序 + 下一行开头 > 上一行末尾,两条合起来按行拉直才是严格递增;LC 240 那种只有行、列各自升序的矩阵就不满足','矩阵必须每行长度相同且是方阵'],
     answer:1,
     explain:'二分的前提是"一维有序"。行内升序只保证行内不乱;若上一行末尾 7 下一行开头却可能比它小,拉直后就有"凹坑",砍一半的依据失效。LC 74 的第二条保证(行末 < 下行行首)把所有行无缝焊成一条递增链,才敢整体二分。240(搜索二维矩阵 II)只有行列各自升序,得用"右上角 elimination"那套 O(m+n) 走法,两题别混。',
     jumpTo:1},
    {q:'代入算一算:默认矩阵(3 行 4 列)不变,target = 30。第一轮 mid = (0+11)//2,取到的数是多少?',
     options:['16——位于矩阵正中间附近','11——mid=5,换算 (1,1)','20——mid=7','23——第 2 行开头'],
     answer:1,
     explain:'mid = (0+11)//2 = 5(整除,不是四舍五入的 6)。换算:行 = 5//4 = 1,列 = 5%4 = 1 → matrix[1][1] = <b>11</b>。11 < 30 → left = 6,去右半。这个取值只跟矩阵尺寸有关,跟 target 是几无关——换成 target=60 第一轮取到的也是 11。选 16 的人把 (0+11)/2 当成 5.5 进位了;向下取整配合 mid±1,谁都不会漏。',
     jumpTo:4},
    {q:'「拉直」需要先把 m×n 个数复制进一个一维数组吗?',
     options:['需要,不然下标对不上矩阵','不需要:代码里没有任何复制,mid//n、mid%n 两个除法现场换算,额外空间 O(1)','看语言而定,Java 要复制 Python 不用'],
     answer:1,
     explain:'left/right/mid 全程都是一维下标,只有"取值那一瞬间"才用 mid//n、mid%n 换算回行列去碰 matrix——反方向换算也成立:格子 (i,j) 就是拉直后的第 i×n+j 格。所以"拉直"只是一种<b>逻辑视图</b>,零复制、零额外空间;把它真复制出来虽然也能对,但空间凭空涨到 O(mn),面试里属于白丢分。',
     jumpTo:21},
  ],

  steps(input){
    const F = [];
    let matrix = (input.matrix || []).map(r => (r || []).map(Number));
    const notes = [];
    if(matrix.length > 4){ matrix = matrix.slice(0, 4); notes.push('行数限 4'); }
    const m = matrix.length;
    let n = m ? matrix[0].length : 0;
    if(n > 4){ n = 4; notes.push('列数限 4'); }
    matrix = matrix.map(r => { const rr = r.slice(0, n); while(rr.length < n) rr.push(null); return rr; });
    const target = Number(input.target);
    const flat = [];
    matrix.forEach(r => r.forEach(v => flat.push(v)));
    const total = m * n;

    const draw = (o) => (v) => {
      const L = o.L, R = o.R, mid = o.mid;
      const st1 = {}, stG = {};
      for(let x = 0; x < flat.length; x++){
        const inW = x >= L && x <= R;
        st1[x] = inW ? 'in' : 'muted';
        const r = Math.floor(x / n), c = x % n;
        stG[r + ',' + c] = inW ? 'in' : 'muted';
      }
      if(mid != null){
        st1[mid] = 'active';
        stG[Math.floor(mid / n) + ',' + (mid % n)] = 'active';
      }
      if(o.found != null){
        st1[o.found] = 'target';
        stG[Math.floor(o.found / n) + ',' + (o.found % n)] = 'target';
      }
      const mk = [];
      if(L >= 0 && L < flat.length) mk.push({name:'left', idx:L, cls:'mr', text:'▲ left'});
      if(mid != null) mk.push({name:'mid', idx:mid, cls:'mi', text:'▲ mid'});
      if(R >= 0 && R < flat.length) mk.push({name:'right', idx:R, cls:'mv', text:'▲ right'});
      v.arr('F1', flat, {label:'拉直后的一维视图　·　<code>target = ' + o.tgt + '</code>' + (o.pfx ? '（' + o.pfx + '）' : ''), states:st1, markers:mk, cw:34});
      v.grid('M', matrix, {label:'原矩阵　·　第 i 行 j 列 ⇔ 拉直后第 i×' + n + '+j 格　·　蓝 = 现在的候选区间', states:stG, cw:40});
      v.vars('V', o.vars, {label:'变量'});
      if(o.res !== undefined) v.result(o.res, {label:'返回值'});
    };
    const vv = (L, R, mid, val) => {
      const o = {left:L, right:R, mid:mid, target:target};
      if(mid != null) o['mid→(r,c)'] = Math.floor(mid / n) + ',' + (mid % n);
      if(val !== undefined) o['取到的 val'] = val;
      return o;
    };

    function trace(t, pfx, main){
      let L = 0, R = total - 1;
      while(L <= R){
        F.push({hl:[5], ok:5, tag:pfx + 'while 检查', cls:'t-blue',
          msg:pfx + '<code>left=' + L + ' ≤ right=' + R + '</code> → 一维区间还剩 <b>' + (R - L + 1) + '</b> 个候选，继续二分。画面导览：上排是拉直视图（亮格 = 候选），下方矩阵把同一段候选拼成蓝色区域——已淘汰的部分两块视图同步变灰，它们始终是同一批数的两种摆法。',
          do: draw({tgt:t, pfx:pfx, L:L, R:R, mid:null, vars:vv(L, R, null)})});
        const mid = (L + R) >> 1;
        const r = Math.floor(mid / n), c = mid % n;
        F.push({hl:[6,7], tag:pfx + '取中点·换算', cls:'t-orange',
          msg:pfx + '<code>mid = (' + L + '+' + R + ')//2 = ' + mid + '</code> → 换算上矩阵：<b>行 = ' + mid + '//' + n + ' = ' + r + '</b>（前 ' + r + ' 整行共占 ' + (r * n) + ' 格），<b>列 = ' + mid + '%' + n + ' = ' + c + '</b>（在本行第 ' + (c + 1) + ' 个）→ 一维第 ' + mid + ' 格就是 <code>matrix[' + r + '][' + c + ']</code>。画面：橙牌在上下两块视图里落的是同一个数——只是坐标换了套衣服。',
          do: draw({tgt:t, pfx:pfx, L:L, R:R, mid:mid, vars:vv(L, R, mid)})});
        const val = matrix[r][c];
        if(val === t){
          F.push({hl:[8], ok:8, tag:pfx + '命中！', cls:'t-green',
            msg:pfx + '<code>matrix[' + r + '][' + c + '] = ' + val + '</code>，正是 target=' + t + ' → 中点直接命中！两块视图同时标金：一维第 ' + mid + ' 格和矩阵第 ' + r + ' 行第 ' + c + ' 列，本来就是同一个数。',
            do: draw({tgt:t, pfx:pfx, L:L, R:R, mid:mid, found:mid, vars:vv(L, R, mid, val)})});
          if(main) F.push({hl:[9], tag:pfx + '返回', cls:'t-dark',
            msg:pfx + '<code>return True</code> ✅ target=' + t + ' 住在第 ' + r + ' 行第 ' + c + ' 列——拉直后第 ' + mid + ' 格。复盘一个易被忽略的点：代码里从没真的复制过数组，"拉直"只活在 <code>mid//n</code>、<code>mid%n</code> 这两个换算里，额外空间 O(1)。',
            do: draw({tgt:t, pfx:pfx, L:L, R:R, mid:mid, found:mid, vars:vv(L, R, mid, val), res:true})});
          return true;
        }
        F.push({hl:[8], no:8, tag:pfx + '比对', cls:'t-ink',
          msg:pfx + '取到的数是 <b>' + val + '</b> ≠ ' + t + '，中点不是答案。别被二维外表唬住——拉直后它就是递增数列的第 ' + mid + ' 个，' + (val < t ? '比 target 小，它和它前面的全体出局' : '比 target 大，它和它后面的全体出局') + '，照样敢砍一半。',
          do: draw({tgt:t, pfx:pfx, L:L, R:R, mid:mid, vars:vv(L, R, mid, val)})});
        const oL = L, oR = R, small = val < t;
        if(small){
          F.push({hl:[10,11], ok:10, tag:pfx + '中点太小', cls:'t-orange',
            msg:pfx + val + ' &lt; ' + t + '：拉直数列里它前面的（含它）全都 &lt; target → 答案只可能在<b>右半</b>。<code>left = mid + 1 = ' + (mid + 1) + '</code>。注意 left/right 始终是一维下标，只有取值那一刻才换算回行列——这正是本解法的分工。',
            do: draw({tgt:t, pfx:pfx, L:mid + 1, R:R, mid:mid, vars:vv(mid + 1, R, mid, val)})});
          L = mid + 1;
        } else {
          F.push({hl:[12,13], ok:12, tag:pfx + '中点太大', cls:'t-orange',
            msg:pfx + val + ' &gt; ' + t + '：它后面的（含它）全都 &gt; target → 答案只可能在<b>左半</b>。<code>right = mid − 1 = ' + (mid - 1) + '</code>。被砍掉的格子两块视图立刻同步变灰。',
            do: draw({tgt:t, pfx:pfx, L:L, R:mid - 1, mid:mid, vars:vv(L, mid - 1, mid, val)})});
          R = mid - 1;
        }
        F.push({hl:[small ? 11 : 13], tag:pfx + '砍掉一半', cls:'t-violet',
          msg:pfx + '候选从 [' + oL + ', ' + oR + '] 缩到 [' + L + ', ' + R + ']：' + (oR - oL + 1) + ' 个变 ' + Math.max(0, R - L + 1) + ' 个，每轮砍掉近一半——' + total + ' 个格子最多 ⌈log₂' + Math.max(total, 2) + '⌉ ≈ ' + Math.ceil(Math.log2(Math.max(total, 2))) + ' 轮，这就是 O(log(mn)) 的来历。',
          do: draw({tgt:t, pfx:pfx, L:L, R:R, mid:null, vars:vv(L, R, null)})});
      }
      F.push({hl:[5], no:5, tag:pfx + '区间空了', cls:'t-red',
        msg:pfx + '<code>left=' + L + ' &gt; right=' + R + '</code> → 候选缩空，全部 ' + total + ' 个格子扫完也没见到 ' + t + '。拉直数列里没有它，矩阵里自然也没有——两个视图本来就是同一批数的两种摆法。',
        do: draw({tgt:t, pfx:pfx, L:L, R:R, mid:null, vars:vv(L, R, null)})});
      if(main) F.push({hl:[14], tag:pfx + '返回', cls:'t-dark',
        msg:pfx + '<code>return False</code> —— 一维数列里没有 ' + t + '，矩阵里自然也没有。整场查找没复制过数组、没多开一格空间：所谓"拉直"，全部实现就是 <code>mid//n</code> 与 <code>mid%n</code> 两次除法。',
        do: draw({tgt:t, pfx:pfx, L:L, R:R, mid:null, vars:vv(L, R, null), res:false})});
      return false;
    }

    F.push({hl:[1,2,3,4], tag:'初始化', cls:'t-grey',
      msg:total + ' 个格子按行拉直：[' + flat.map(x => x == null ? '∅' : x).join(', ') + ']。为什么敢拉直？题目保证<b>行内升序 + 下一行开头 &gt; 上一行末尾</b>' + (m >= 2 && n >= 1 && flat[n - 1] != null && flat[n] != null ? '（本例第 0 行末尾 ' + flat[n - 1] + ' &lt; 第 1 行开头 ' + flat[n] + '）' : '') + '——两条合起来，整条数列严格递增，一维二分的前提"有序"成立。区间 [0, ' + (total - 1) + '] 全场待命，下面就是标准一维二分。' + (notes.length ? '（' + notes.join('；') + '）' : ''),
      do: draw({tgt:target, L:0, R:total - 1, mid:null, vars:vv(0, total - 1, null)})});
    F.push({hl:[7], tag:'换算口诀', cls:'t-grey',
      msg:'唯一的新知识是<b>下标换算</b>：矩阵每行摆 <code>' + n + '</code> 个数，一维下标 mid 除以 n——<b>商 = 行号</b>（走完了几整行），<b>余数 = 列号</b>（在本行走到第几个）。' + (n > 0 && m > 1 ? '例如 mid=' + (n + 1) + '：' + (n + 1) + '//' + n + '=' + Math.floor((n + 1) / n) + ' 行、' + (n + 1) + '%' + n + '=' + ((n + 1) % n) + ' 列 → matrix[1][1]，正是拉直后的第 ' + (n + 1) + ' 格。' : '') + '等下每轮取中点都现场演一遍换算，上下两块视图同步高亮。',
      do: draw({tgt:target, L:0, R:total - 1, mid:null, vars:vv(0, total - 1, null)})});

    const found = trace(target, '', true);

    F.push({hl:[9,14], ok: found ? 9 : undefined, no: found ? undefined : 14,
      tag:'总结', cls:'t-dark',
      msg:(found
        ? '第 9 行 <code>return True</code> 收工。套路复盘三步：<b>①确认拉直后有序（行内升序 + 行末 &lt; 下行行首）→ ②标准一维二分 → ③取值时用 mid//n、mid%n 换算回行列</b>。要是 target 不在矩阵里（预设 target=4 可看全过程），区间会一路缩空 → 第 14 行 <code>return False</code>。'
        : '区间缩空也没找到 → 第 14 行 <code>return False</code>。套路复盘三步：<b>①确认拉直后有序 → ②标准一维二分 → ③mid//n、mid%n 换算回行列取值</b>。注意 LC 240（只有行、列各自升序）不满足"行末 &lt; 下行行首"，就不能这么拉直。') +
        ' 一维二分 + 一行换算公式，就把整个矩阵收进 O(log(mn))。',
      do: (function(){
        return (v) => {
          v.arr('F1', flat, {label:'拉直后的一维视图　·　<code>target = ' + target + '</code>', states:(function(){ const st = {}; for(let x = 0; x < flat.length; x++) st[x] = 'muted'; return st; })(), cw:34});
          v.grid('M', matrix, {label:'原矩阵　·　第 i 行 j 列 ⇔ 拉直后第 i×' + n + '+j 格', states:(function(){ const st = {}; for(let r = 0; r < m; r++) for(let c = 0; c < n; c++) st[r + ',' + c] = 'muted'; return st; })(), cw:40});
          v.result(found, {label:'返回值'});
        };
      })()});

    return F;
  },

  /* ========= 解法二：力扣官方 · 两次二分(先挑行，再挑格) ========= */
  alt: {
    label: '官方 · 两次二分',
    method: 'searchMatrix',

    lede: '题目不变：行内升序 + 下一行开头 &gt; 上一行末尾。主解法把矩阵拉直成一条做<b>一次</b>二分；这里演<b>官方「两次二分」</b>：' +
          '第一次只在<b>首列</b>里二分，锁定「行首 ≤ target 的最后一行」r——行首是全行最小的数，行首一旦超标，整行连同下面全部出局；' +
          '第二次只在第 r 行<b>行内</b>标准二分。两次开销 O(log m) + O(log n)，矩阵原封不动。',

    roles: [
      {c:'blue',   code:'候选行', text:'第一次二分：行首没被排除的行'},
      {c:'orange', code:'mid',   text:'本轮中点（先取行，后取格）'},
      {c:'green',  code:'r',     text:'锁定的行：行首 ≤ target 的最后一行'},
      {c:'violet', code:'target', text:'第二次二分命中的格子'}
    ],

    codeTitle: '跟着高亮读代码——上段（第 5~10 行）在首列里挑行：mid 行染橙、出局行变灰；下段（第 13~20 行）在第 r 行里挑格：▲ lo / ▲ mid / ▲ hi 三块名牌夹逼。',

    legend: [
      {c:'blue', text:'候选行 / 候选格'},
      {c:'orange', text:'mid 行 / mid 格'},
      {swatch:'var(--grey-soft)', text:'灰 = 已排除'},
      {c:'violet', text:'命中的 target'}
    ],

    idea: '两次二分各管一维：先在首列二分锁定「最后一个行首 ≤ target 的行」，再在这行里二分找 target——O(log m) + O(log n)。',

    qa: [
      {q:'一次拉直二分 O(log(mn)) 和两次二分 O(log m + log n)，到底差多少？',
       a:'渐进上<b>一样</b>——log(mn) 本来就等于 log m + log n。真实差别在写法与依赖：拉直二分是一个循环 + mid//n、mid%n 换算，且一次吃下整条有序性；两次二分是两个更"纯"的标准二分，不用换算、各管一维，更好写也好讲。轮数上一次二分 ≈ ⌈log₂(mn)⌉，两次 ≈ ⌈log₂m⌉ + ⌈log₂n⌉，后者通常还多半轮（取整损耗），属于同一档。'},
      {q:'为什么第一次二分只看行首就能淘汰整行、甚至连下面的行一起淘汰？',
       a:'行内升序 ⇒ 行首是全行最小的数。mid 行首 &gt; target ⇒ 这一行所有数都超标，整行出局；又因行首逐行递增，mid 以下的行首只会更大——连坐出局，所以 bottom 直接跳到 mid − 1。反过来行首 ≤ target 时，mid 行有资格但更下面可能也有，top 跳到 mid + 1，把 mid 留作候选。'},
      {q:'为什么最后锁定的是 bottom，target 若存在必在这一行？',
       a:'反证：若 target 住在第 q 行，则 q 行首 ≤ target ≤ q 行末 &lt; q+1 行首——"行首 ≤ target"的资格恰好延续到第 q 行为止，q+1 起全部超标。所以最后一个有资格的行正是 q 本身，行内标准二分即可收网。'},
      {q:'bottom = −1（target 比左上角还小）会崩吗？',
       a:'不会。r = max(bottom, 0) 兜底：此时连第 0 行行首都 &gt; target，整行注定找不到，拿第 0 行去行内二分只是白走一趟、自然返回 False——省下一个特判，逻辑仍然正确。'}
    ],

    complexity: '时间 O(log m + log n)（两次独立二分）　·　空间 O(1)',

    code: `class Solution:
    def searchMatrix(self, matrix, target):
        m, n = len(matrix), len(matrix[0])
        top, bottom = 0, m - 1
        while top <= bottom:            # 第一次二分: 首列里挑行
            mid = (top + bottom) // 2
            if matrix[mid][0] <= target:
                top = mid + 1           # mid 行有资格, 更下面可能也有
            else:
                bottom = mid - 1        # mid 行整行超标, 下面连坐
        r = max(bottom, 0)              # 最后一个 行首 ≤ target 的行
        lo, hi = 0, n - 1
        while lo <= hi:                 # 第二次二分: 第 r 行里挑格
            mid = (lo + hi) // 2
            if matrix[r][mid] == target:
                return True
            if matrix[r][mid] < target:
                lo = mid + 1
            else:
                hi = mid - 1
        return False
`,

    sol(input){
      const matrix = (input.matrix || []).map(rw => (rw || []).map(Number));
      const target = Number(input.target);
      const m = matrix.length, n = m ? matrix[0].length : 0;
      if(!m || !n) return false;
      let top = 0, bottom = m - 1;
      while(top <= bottom){
        const mid = (top + bottom) >> 1;
        if(matrix[mid][0] <= target) top = mid + 1;
        else bottom = mid - 1;
      }
      const r = Math.max(bottom, 0);
      let lo = 0, hi = n - 1;
      while(lo <= hi){
        const mid = (lo + hi) >> 1;
        if(matrix[r][mid] === target) return true;
        if(matrix[r][mid] < target) lo = mid + 1;
        else hi = mid - 1;
      }
      return false;
    },
    expected: true,

    steps(input){
      const F = [];
      let matrix = (input.matrix || []).map(rw => (rw || []).map(Number));
      const notes = [];
      if(matrix.length > 4){ matrix = matrix.slice(0, 4); notes.push('行数限 4'); }
      const m = matrix.length;
      let n = m ? matrix[0].length : 0;
      if(n > 4){ n = 4; matrix = matrix.map(rw => rw.slice(0, n)); notes.push('列数限 4'); }
      matrix = matrix.map(rw => { const rr = rw.slice(0, n); while(rr.length < n) rr.push(null); return rr; });
      const target = Number(input.target);
      const GLAB1 = '矩阵　·　蓝 = 候选行　·　灰 = 已出局';

      /* ★ 快照原则：候选区间/染色/名牌在 push 那一刻定死 */
      const draw = (o) => (v) => {
        v.grid('M', matrix, {label:o.glab || '矩阵', states:o.gst || {}, cw:46});
        if(o.phase === 1){
          v.arr('C', matrix.map(rw => rw[0]), {label:'首列 <code>matrix[*][0]</code>　·　行首逐行递增', states:o.cst || {}, markers:o.cm || [], cw:64});
        } else if(o.phase === 2){
          v.arr('R', matrix[o.r] || [], {label:'第 ' + o.r + ' 行 <code>matrix[' + o.r + '][*]</code>　·　行内升序', states:o.rst || {}, markers:o.rm || [], cw:56});
        }
        if(o.vars) v.vars('V', o.vars, {label:'变量', hl:o.vhl || []});
        if(o.res !== undefined) v.result(o.res, {label:'返回值'});
      };
      const ph1Rows = (top, bottom, mid) => {
        const st = {};
        for(let r = 0; r < m; r++){
          const cls = (r >= top && r <= bottom) ? (r === mid ? 'active' : 'in') : 'muted';
          for(let c = 0; c < n; c++) st[r + ',' + c] = cls;
        }
        return st;
      };
      const ph2Rows = (r, lo, hi, midC, foundC) => {
        const st = {};
        for(let rr = 0; rr < m; rr++) for(let c = 0; c < n; c++) st[rr + ',' + c] = (rr === r) ? 'in' : 'muted';
        if(lo != null) for(let c = 0; c < n; c++) st[r + ',' + c] = (c >= lo && c <= hi) ? 'in' : 'muted';
        if(midC != null && midC >= 0 && midC < n) st[r + ',' + midC] = 'active';
        if(foundC != null) st[r + ',' + foundC] = 'target';
        return st;
      };
      const colSt = (top, bottom, mid) => {
        const st = {};
        for(let r = 0; r < m; r++) st[r] = (r >= top && r <= bottom) ? (r === mid ? 'active' : 'in') : 'muted';
        return st;
      };
      const rowSt = (lo, hi, mid, found) => {
        const st = {};
        for(let c = 0; c < n; c++) st[c] = (lo != null && c >= lo && c <= hi) ? (c === mid ? 'active' : 'in') : 'muted';
        if(found != null) st[found] = 'target';
        return st;
      };
      const colMk = (top, mid, bottom) => {
        const mk = [];
        if(top != null && top >= 0 && top < m) mk.push({name:'top', idx:top, cls:'mr', text:'▲ top'});
        if(mid != null && mid >= 0 && mid < m) mk.push({name:'mid', idx:mid, cls:'mi', text:'▲ mid'});
        if(bottom != null && bottom >= 0 && bottom < m) mk.push({name:'bottom', idx:bottom, cls:'mv', text:'▲ bottom'});
        return mk;
      };
      const rowMk = (lo, mid, hi) => {
        const mk = [];
        if(lo != null && lo >= 0 && lo < n) mk.push({name:'lo', idx:lo, cls:'mr', text:'▲ lo'});
        if(mid != null && mid >= 0 && mid < n) mk.push({name:'mid', idx:mid, cls:'mi', text:'▲ mid'});
        if(hi != null && hi >= 0 && hi < n) mk.push({name:'hi', idx:hi, cls:'mv', text:'▲ hi'});
        return mk;
      };

      F.push({hl:[1,2,3,4], tag:'初始化', cls:'t-grey',
        msg:'m = ' + m + ' 行、n = ' + n + ' 列，target = ' + target + (notes.length ? '（' + notes.join('；') + '）' : '') + '。解法二演示<b>官方「两次二分」</b>：第 1 次只在<b>首列</b>里二分，锁定「行首 ≤ target 的最后一行」r；第 2 次只在第 r 行<b>行内</b>标准二分。两次开销 O(log m) + O(log n)，矩阵原封不动、全程只动几个下标。',
        do: draw({phase:1, glab:GLAB1, gst:ph1Rows(0, m - 1, null), cst:colSt(0, m - 1, null), cm:colMk(0, null, m - 1),
                  vars:{top:0, bottom:m - 1, '首列[mid]':'—', target:target}})});

      F.push({hl:[7], tag:'规矩：一行只看行首', cls:'t-grey',
        msg:'为什么一行只看一个数就够：行内升序 ⇒ <b>行首是全行最小的数</b>。行首 &gt; target ⇒ 整行全超标、出局；行首又逐行递增，它下面的行只会更大——<b>连坐出局</b>，一次比较白送淘汰一大片。反过来，行首 ≤ target 只说明这行"有资格"，"最后一个有资格的行"可能更靠下，还得继续找。',
        do: draw({phase:1, glab:GLAB1, gst:ph1Rows(0, m - 1, null), cst:colSt(0, m - 1, null), cm:colMk(0, null, m - 1),
                  vars:{top:0, bottom:m - 1, '首列[mid]':'—', target:target}})});

      let top = 0, bottom = m - 1, p1 = 0;
      while(top <= bottom){
        p1++;
        F.push({hl:[5], ok:5, tag:'while 检查', cls:'t-blue',
          msg:'<code>top = ' + top + ' ≤ bottom = ' + bottom + '</code> → 首列里还有 ' + (bottom - top + 1) + ' 个候选行（蓝行）。不变式：若 target 存在，它所在的行（= 最后一个行首 ≤ target 的行）一定还落在 [top, bottom] 里。',
          do: draw({phase:1, glab:GLAB1, gst:ph1Rows(top, bottom, null), cst:colSt(top, bottom, null), cm:colMk(top, null, bottom),
                    vars:{top:top, bottom:bottom, '首列[mid]':'—', target:target}})});

        const mid = (top + bottom) >> 1;
        const head = matrix[mid][0];
        F.push({hl:[6], tag:'取中点', cls:'t-orange',
          msg:'<code>mid = (' + top + ' + ' + bottom + ')//2 = ' + mid + '</code> → 橙行 = 第 ' + mid + ' 行，只取行首 <code>matrix[' + mid + '][0] = ' + head + '</code> 出来受审。整行 ' + n + ' 个数一个都不用看——行首一人代表全行。',
          do: draw({phase:1, glab:GLAB1, gst:ph1Rows(top, bottom, mid), cst:colSt(top, bottom, mid), cm:colMk(top, mid, bottom),
                    vars:{top:top, bottom:bottom, '首列[mid]':head, target:target}, vhl:['首列[mid]']})});

        const oT = top, oB = bottom;
        if(head <= target){
          F.push({hl:[7], ok:7, tag:'行首 ≤ target', cls:'t-green',
            msg:'行首 ' + head + ' ≤ target = ' + target + ' → 第 ' + mid + ' 行<b>有资格</b>。但"最后一个有资格的行"可能更靠下（下面的行首更大，也许仍 ≤ target），所以 top 要跳到 <code>mid + 1</code> 继续往下逼。不信第 ' + mid + ' 行之上藏着 target？那 target ≤ 那行行末 &lt; 第 ' + mid + ' 行行首 = ' + head + ' ≤ target，自相矛盾——所以 mid 之上的行全部出局（变灰）。',
            do: draw({phase:1, glab:GLAB1, gst:ph1Rows(mid, bottom, mid), cst:colSt(mid, bottom, mid), cm:colMk(top, mid, bottom),
                      vars:{top:top, bottom:bottom, '首列[mid]':head, target:target}})});
          top = mid + 1;
          F.push({hl:[8], tag:'候选行收缩', cls:'t-violet',
            msg:'<code>top = mid + 1 = ' + top + '</code>：候选行从 [' + oT + ', ' + oB + '] 缩到 [' + top + ', ' + bottom + ']。注意 mid 行没有被扔掉——它仍是答案的候选，只是"最后一个有资格的"还得往下确认。',
            do: draw({phase:1, glab:GLAB1, gst:ph1Rows(top, bottom, null), cst:colSt(top, bottom, null), cm:colMk(top, null, bottom),
                      vars:{top:top, bottom:bottom, '首列[mid]':'—', target:target}})});
        } else {
          F.push({hl:[7], no:7, tag:'行首 > target', cls:'t-red',
            msg:'行首 ' + head + ' &gt; target = ' + target + ' → 第 ' + mid + ' 行<b>整行超标</b>（行内最小的数都不够格）。行首逐行递增，它下面的行首只会更大——<b>连坐出局</b>，bottom 直接跳到 <code>mid − 1</code>，一次性缩掉下半段。',
            do: draw({phase:1, glab:GLAB1, gst:ph1Rows(top, mid, mid), cst:colSt(top, mid, mid), cm:colMk(top, mid, bottom),
                      vars:{top:top, bottom:bottom, '首列[mid]':head, target:target}})});
          bottom = mid - 1;
          F.push({hl:[9,10], tag:'候选行收缩', cls:'t-violet',
            msg:'<code>bottom = mid − 1 = ' + bottom + '</code>：候选行从 [' + oT + ', ' + oB + '] 缩到 [' + top + ', ' + bottom + ']，第 ' + mid + ' 行及以下整片变灰。每轮至少砍一半——' + m + ' 行最多 ⌈log₂' + Math.max(m, 2) + '⌉ = ' + Math.max(1, Math.ceil(Math.log2(Math.max(m, 2)))) + ' 轮就能锁定行，这就是第一次二分的 O(log m)。',
            do: draw({phase:1, glab:GLAB1, gst:ph1Rows(top, bottom, null), cst:colSt(top, bottom, null), cm:colMk(top, null, bottom),
                      vars:{top:top, bottom:bottom, '首列[mid]':'—', target:target}})});
        }
      }

      F.push({hl:[5], no:5, tag:'首列缩空', cls:'t-red',
        msg:'<code>top = ' + top + ' &gt; bottom = ' + bottom + '</code> → 第一次二分结束，共 ' + p1 + ' 轮。bottom 停在 <code>' + bottom + '</code>：它正是「行首 ≤ target 的最后一行」。为什么 target 若存在必在此行：若它住在第 q 行，则 q 行首 ≤ target ≤ q 行末 &lt; q+1 行首——"行首 ≤ target"的资格恰好延续到第 q 行为止，q+1 起全部超标，最后一个有资格的行只能是 q 本身。',
        do: draw({phase:1, glab:GLAB1, gst:ph1Rows(top, bottom, null), cst:colSt(top, bottom, null), cm:colMk(null, null, bottom >= 0 ? bottom : null),
                  vars:{top:top, bottom:bottom, '首列[mid]':'—', target:target}})});

      const r = Math.max(bottom, 0);
      F.push({hl:[11], tag:'锁定行 r', cls:'t-green',
        msg:'<code>r = max(bottom, 0) = ' + r + '</code>。max 的兜底：bottom 只在 target 比 <code>matrix[0][0]</code> 还小时才会是 −1——此时第 0 行也注定找不到，拿第 0 行去白走一趟行内二分、自然返回 False，省下一个特判。现在画面只剩第 ' + r + ' 行有嫌疑：target 若存在，就藏在它里面。',
        do: draw({phase:1, glab:'矩阵　·　target 若存在必在橙行', gst:ph1Rows(r, r, r), cst:colSt(r, r, r),
                  cm:[{name:'r', idx:r, cls:'mi', text:'▲ r'}],
                  vars:{top:top, bottom:bottom, '首列[mid]':'—', target:target}})});

      let lo = 0, hi = n - 1, p2 = 0, hit = -1;
      F.push({hl:[12], tag:'第二次二分开工', cls:'t-grey',
        msg:'<code>lo = 0, hi = ' + (n - 1) + '</code>：在第 ' + r + ' 行 [' + matrix[r].map(x => x == null ? '∅' : x).join(', ') + '] 里标准二分找 ' + target + '。画面切到<b>行视图</b>，▲ lo / ▲ mid / ▲ hi 三块名牌开始夹逼——和一维二分一模一样，唯一的新知识（行首代表全行）已经在第一次二分里用完了。',
        do: draw({phase:2, r:r, glab:'矩阵　·　只剩第 ' + r + ' 行有嫌疑',
                  gst:ph2Rows(r, 0, n - 1, null, null), rst:rowSt(0, n - 1, null, null), rm:rowMk(0, null, n - 1),
                  vars:{r:r, lo:0, hi:n - 1, target:target}})});

      while(lo <= hi){
        p2++;
        const mid = (lo + hi) >> 1;
        const val = matrix[r][mid];
        F.push({hl:[13], ok:13, tag:'while 检查', cls:'t-blue',
          msg:'<code>lo = ' + lo + ' ≤ hi = ' + hi + '</code> → 行内还有 ' + (hi - lo + 1) + ' 个候选格（蓝格），继续二分。',
          do: draw({phase:2, r:r, gst:ph2Rows(r, lo, hi, null, null), rst:rowSt(lo, hi, null, null), rm:rowMk(lo, null, hi),
                    vars:{r:r, lo:lo, hi:hi, target:target}})});
        F.push({hl:[14], tag:'取中点', cls:'t-orange',
          msg:'<code>mid = (' + lo + ' + ' + hi + ')//2 = ' + mid + '</code> → 橙格 <code>matrix[' + r + '][' + mid + '] = ' + val + '</code>，拿它和 target 比一比。',
          do: draw({phase:2, r:r, gst:ph2Rows(r, lo, hi, mid, null), rst:rowSt(lo, hi, mid, null), rm:rowMk(lo, mid, hi),
                    vars:{r:r, lo:lo, hi:hi, target:target}})});
        if(val === target){
          hit = mid;
          F.push({hl:[15], ok:15, tag:'命中！', cls:'t-green',
            msg:'<code>matrix[' + r + '][' + mid + '] = ' + val + '</code>，正是 target → 紫格定格！两次二分总账：第一次 ' + p1 + ' 轮挑出第 ' + r + ' 行，第二次 ' + p2 + ' 轮命中——合计 ' + (p1 + p2) + ' 次比较，O(log m) + O(log n)。',
            do: draw({phase:2, r:r, gst:ph2Rows(r, lo, hi, mid, mid), rst:rowSt(lo, hi, mid, mid), rm:rowMk(lo, mid, hi),
                      vars:{r:r, lo:lo, hi:hi, target:target}})});
          break;
        }
        const oL = lo, oH = hi, small = val < target;
        F.push({hl:[17], ok:small ? 17 : undefined, no:small ? undefined : 17,
          tag:'比对', cls:small ? 't-blue' : 't-red',
          msg: small
            ? val + ' &lt; target = ' + target + '：行内升序，它左边的（含它）全都不够大 → 答案只可能在<b>右半</b>，<code>lo = mid + 1</code>。'
            : val + ' &gt; target = ' + target + '：它右边的（含它）全都超标 → 答案只可能在<b>左半</b>，<code>hi = mid − 1</code>。',
          do: draw({phase:2, r:r, gst:ph2Rows(r, lo, hi, mid, null), rst:rowSt(lo, hi, mid, null), rm:rowMk(lo, mid, hi),
                    vars:{r:r, lo:lo, hi:hi, target:target}})});
        if(small) lo = mid + 1; else hi = mid - 1;
        F.push({hl:small ? [18] : [19,20], tag:'砍掉一半', cls:'t-violet',
          msg:'候选格从 [' + oL + ', ' + oH + '] 缩到 [' + lo + ', ' + hi + ']：每轮砍半，' + n + ' 格最多 ⌈log₂' + Math.max(n, 2) + '⌉ = ' + Math.max(1, Math.ceil(Math.log2(Math.max(n, 2)))) + ' 轮——这就是第二次二分的 O(log n)。',
          do: draw({phase:2, r:r, gst:ph2Rows(r, lo, hi, null, null), rst:rowSt(lo, hi, null, null), rm:rowMk(lo, null, hi),
                    vars:{r:r, lo:lo, hi:hi, target:target}})});
      }

      if(hit >= 0){
        F.push({hl:[16], tag:'返回', cls:'t-dark',
          msg:'<code>return True</code> ✅ target = ' + target + ' 住在第 ' + r + ' 行第 ' + hit + ' 列。对比主解法：拉直二分用 mid//n、mid%n 把一维下标换算回行列；两次二分干脆不换算——首列管行、行内管格，各是各的标准二分。',
          do: draw({phase:2, r:r, gst:ph2Rows(r, null, null, hit, hit), rst:rowSt(null, null, hit, hit), rm:[],
                    vars:{r:r, lo:lo, hi:hi, target:target}, res:true})});
        F.push({hl:[16], tag:'总结', cls:'t-dark',
          msg:'复盘两种二分的账：主解法把矩阵<b>拉直</b>成一条做一次二分，O(log(mn))；本解法分两次——首列挑行 O(log m) + 行内挑格 O(log n)。因为 log(mn) = log m + log n，两者<b>同一量级</b>、轮数几乎一样；真正的差别在写法与依赖：拉直要背换算公式、一次吃下整条有序性；两次二分是两个更纯的标准二分、不用换算、更好写好讲。注意前提都是"行末 &lt; 下行行首"——像 LC 240 那种只有行列各自升序的矩阵，两招都会失效，得用右上角 O(m+n) 的走法。',
          do: draw({phase:2, r:r, gst:ph2Rows(r, null, null, hit, hit), rst:rowSt(null, null, hit, hit), rm:[],
                    vars:{r:r, lo:lo, hi:hi, target:target}, res:true})});
      } else {
        F.push({hl:[13], no:13, tag:'行内缩空', cls:'t-red',
          msg:'<code>lo = ' + lo + ' &gt; hi = ' + hi + '</code> → 第 ' + r + ' 行里也没有 ' + target + '。第一次二分已经保证"若存在必在第 ' + r + ' 行"，这行没有就是真没有——两段二分接力的逻辑闭合。',
          do: draw({phase:2, r:r, gst:ph2Rows(r, null, null, null, null), rst:rowSt(null, null, null, null), rm:[],
                    vars:{r:r, lo:lo, hi:hi, target:target}})});
        F.push({hl:[21], tag:'返回', cls:'t-dark',
          msg:'<code>return False</code>。两次二分一次都没碰"整个矩阵"：第一次只在首列比了 ' + p1 + ' 次，第二次只在第 ' + r + ' 行比了 ' + p2 + ' 次——矩阵其余格子全程陪跑。',
          do: draw({phase:2, r:r, gst:ph2Rows(r, null, null, null, null), rst:rowSt(null, null, null, null), rm:[],
                    vars:{r:r, lo:lo, hi:hi, target:target}, res:false})});
        F.push({hl:[21], tag:'总结', cls:'t-dark',
          msg:'复盘两种二分的账：主解法把矩阵<b>拉直</b>成一条做一次二分，O(log(mn))；本解法分两次——首列挑行 O(log m) + 行内挑格 O(log n)。因为 log(mn) = log m + log n，两者<b>同一量级</b>；差别在写法与依赖：拉直要 mid//n、mid%n 换算且依赖整条有序，两次二分是两个更纯的标准二分、不用换算、更好写好讲。注意前提都是"行末 &lt; 下行行首"——像 LC 240 那种只有行列各自升序的矩阵，两招都会失效，得用右上角 O(m+n) 的走法。',
          do: draw({phase:2, r:r, gst:ph2Rows(r, null, null, null, null), rst:rowSt(null, null, null, null), rm:[],
                    vars:{r:r, lo:lo, hi:hi, target:target}, res:false})});
      }

      return F;
    }
  }
});
